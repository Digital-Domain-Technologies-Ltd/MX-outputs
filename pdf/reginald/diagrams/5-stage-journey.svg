<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #00d4aa; }
      .subtitle { font-size: 11px; fill: #888888; font-style: italic; }
      .stage-num { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .stage-label { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .stage-sublabel { font-size: 9px; fill: #ffffff; opacity: 0.9; }
      .req-label { font-size: 8.5px; fill: #e0e0e0; font-weight: 600; }
      .req-item { font-size: 8px; fill: #aaaaaa; }
      .fail-text { font-size: 8.5px; fill: #ff6b6b; font-weight: 600; }
      .benefit-label { font-size: 8px; fill: #00d4aa; font-weight: 600; }
      .insight-title { font-size: 12px; font-weight: 700; }
      .insight-text { font-size: 10px; fill: #aaaaaa; }
    </style>
    <linearGradient id="stage1-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#5a4bd1"/>
    </linearGradient>
    <linearGradient id="stage2-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#0770c2"/>
    </linearGradient>
    <linearGradient id="stage3-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00a381"/>
    </linearGradient>
    <linearGradient id="stage4-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <linearGradient id="stage5-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#d35843"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="520" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">The 5-Stage AI Readiness Journey</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">Miss any stage and the entire chain breaks — agents offer no second chance</text>

  <!-- Stage 1 — Discovery -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="136" height="52" rx="8" fill="url(#stage1-grad)"/>
    <text x="12" y="32" class="stage-num">1</text>
    <text x="32" y="24" class="stage-label">Discovery</text>
    <text x="32" y="38" class="stage-sublabel">Can they find you?</text>
    <text x="0" y="72" class="req-label">Requires:</text>
    <text x="0" y="84" class="req-item">&#8226; robots.txt / sitemap.xml</text>
    <text x="0" y="95" class="req-item">&#8226; Semantic HTML</text>
    <text x="0" y="106" class="req-item">&#8226; Server-side rendering</text>
    <text x="0" y="117" class="req-item">&#8226; Crawlable structure</text>
    <text x="0" y="138" class="fail-text">&#9888; Fail: You don't exist</text>
    <text x="0" y="155" class="benefit-label">+ SEO, WCAG</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="160" y1="96" x2="175" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 2 — Citation -->
  <g transform="translate(178, 70)">
    <rect x="0" y="0" width="136" height="52" rx="8" fill="url(#stage2-grad)"/>
    <text x="12" y="32" class="stage-num">2</text>
    <text x="32" y="24" class="stage-label">Citation</text>
    <text x="32" y="38" class="stage-sublabel">Do they reference you?</text>
    <text x="0" y="72" class="req-label">Requires:</text>
    <text x="0" y="84" class="req-item">&#8226; Fact-level clarity</text>
    <text x="0" y="95" class="req-item">&#8226; Schema.org JSON-LD</text>
    <text x="0" y="106" class="req-item">&#8226; Citation-worthy architecture</text>
    <text x="0" y="117" class="req-item">&#8226; Standalone definitions</text>
    <text x="0" y="138" class="fail-text">&#9888; Fail: Hallucinated details</text>
    <text x="0" y="155" class="benefit-label">+ GEO, SEO, WCAG</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="318" y1="96" x2="333" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 3 — Search & Compare -->
  <g transform="translate(336, 70)">
    <rect x="0" y="0" width="136" height="52" rx="8" fill="url(#stage3-grad)"/>
    <text x="12" y="32" class="stage-num">3</text>
    <text x="32" y="24" class="stage-label">Search &amp; Compare</text>
    <text x="32" y="38" class="stage-sublabel">Can they evaluate you?</text>
    <text x="0" y="72" class="req-label">Requires:</text>
    <text x="0" y="84" class="req-item">&#8226; JSON-LD microdata</text>
    <text x="0" y="95" class="req-item">&#8226; Explicit comparison attributes</text>
    <text x="0" y="106" class="req-item">&#8226; Semantic feature extraction</text>
    <text x="0" y="117" class="req-item">&#8226; Structured specifications</text>
    <text x="0" y="138" class="fail-text">&#9888; Fail: Skipped in comparisons</text>
    <text x="0" y="155" class="benefit-label">+ GEO, SEO, WCAG</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="476" y1="96" x2="491" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 4 — Price Understanding -->
  <g transform="translate(494, 70)">
    <rect x="0" y="0" width="136" height="52" rx="8" fill="url(#stage4-grad)"/>
    <text x="12" y="32" class="stage-num">4</text>
    <text x="32" y="24" class="stage-label" fill="#1a1a1a">Price</text>
    <text x="32" y="38" class="stage-sublabel" fill="#1a1a1a" opacity="0.8">Do they parse costs?</text>
    <text x="0" y="72" class="req-label">Requires:</text>
    <text x="0" y="84" class="req-item">&#8226; Schema.org Product/Offer</text>
    <text x="0" y="95" class="req-item">&#8226; ISO 4217 currency codes</text>
    <text x="0" y="106" class="req-item">&#8226; PriceSpecification types</text>
    <text x="0" y="117" class="req-item">&#8226; Decimal format validation</text>
    <text x="0" y="138" class="fail-text">&#9888; Fail: 100x price errors</text>
    <text x="0" y="155" class="benefit-label">+ SEO rich results, GEO</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="634" y1="96" x2="649" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 5 — Purchase Confidence -->
  <g transform="translate(652, 70)">
    <rect x="0" y="0" width="136" height="52" rx="8" fill="url(#stage5-grad)"/>
    <text x="12" y="32" class="stage-num">5</text>
    <text x="32" y="24" class="stage-label">Purchase</text>
    <text x="32" y="38" class="stage-sublabel">Can they complete it?</text>
    <text x="0" y="72" class="req-label">Requires:</text>
    <text x="0" y="84" class="req-item">&#8226; Explicit state (data-state)</text>
    <text x="0" y="95" class="req-item">&#8226; Semantic forms (&lt;button&gt;)</text>
    <text x="0" y="106" class="req-item">&#8226; Persistent feedback (alerts)</text>
    <text x="0" y="117" class="req-item">&#8226; UCP commerce protocol</text>
    <text x="0" y="138" class="fail-text">&#9888; Fail: Cart abandoned silently</text>
    <text x="0" y="155" class="benefit-label">+ WCAG, UX</text>
  </g>

  <!-- Catastrophic Failure Principle bar -->
  <rect x="20" y="265" width="760" height="48" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#ff6b6b">Catastrophic Failure Principle</text>
  <text x="400" y="302" text-anchor="middle" font-size="10" fill="#888888">Miss any stage and the entire commerce chain breaks. Unlike humans, agents provide no analytics visibility and offer no second chance.</text>

  <!-- Convergence box -->
  <rect x="20" y="330" width="760" height="84" rx="6" fill="#0d1f1a" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="400" y="354" text-anchor="middle" class="insight-title" fill="#00d4aa">Convergence: One Implementation, Three Audiences</text>
  <g transform="translate(60, 367)">
    <!-- AI Agents -->
    <rect x="0" y="0" width="200" height="30" rx="4" fill="#6c5ce7" opacity="0.9"/>
    <text x="100" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">AI Agents (primary focus)</text>
    <!-- Search Engines -->
    <rect x="225" y="0" width="200" height="30" rx="4" fill="#0984e3" opacity="0.9"/>
    <text x="325" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Search Engines (side benefit)</text>
    <!-- Accessibility -->
    <rect x="450" y="0" width="220" height="30" rx="4" fill="#00b894" opacity="0.9"/>
    <text x="560" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Users with Disabilities (side benefit)</text>
  </g>

  <!-- Computational Trust outcome -->
  <rect x="20" y="432" width="760" height="58" rx="6" fill="#111111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#e0e0e0">Complete the journey &#8594; Earn computational trust &#8594; Agents return and recommend you</text>
  <text x="400" y="476" text-anchor="middle" font-size="10" fill="#888888">Structured metadata turns expensive inference into cheap lookup — saving compute, energy, and latency at every stage</text>

  <!-- MX attribution -->
  <text x="400" y="510" text-anchor="middle" font-size="8" fill="#444444">CogNovaMX Ltd — The Machine Experience</text>
</svg>
