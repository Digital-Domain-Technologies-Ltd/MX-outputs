<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outer { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
    .box { fill: #fff; stroke: #1976d2; stroke-width: 2; }
    .trust { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
    .small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
    .arrow { stroke: #1976d2; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
  </style>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="20" y="20" width="660" height="310" class="outer" rx="8"/>
  <text x="350" y="50" class="title" text-anchor="middle">REGINALD</text>

  <!-- INGEST box -->
  <rect x="50" y="80" width="150" height="120" class="box" rx="4"/>
  <text x="125" y="105" class="text" text-anchor="middle" font-weight="bold">INGEST</text>
  <text x="125" y="130" class="small" text-anchor="middle">Submit</text>
  <text x="125" y="145" class="small" text-anchor="middle">Validate</text>
  <text x="125" y="160" class="small" text-anchor="middle">Queue</text>

  <!-- Arrow 1 -->
  <path d="M 200 140 L 250 140" class="arrow"/>

  <!-- INDEX box -->
  <rect x="260" y="80" width="150" height="120" class="box" rx="4"/>
  <text x="335" y="105" class="text" text-anchor="middle" font-weight="bold">INDEX</text>
  <text x="335" y="130" class="small" text-anchor="middle">Validate</text>
  <text x="335" y="145" class="small" text-anchor="middle">Sign</text>
  <text x="335" y="160" class="small" text-anchor="middle">Store</text>

  <!-- Arrow 2 -->
  <path d="M 410 140 L 460 140" class="arrow"/>

  <!-- SERVE box -->
  <rect x="470" y="80" width="150" height="120" class="box" rx="4"/>
  <text x="545" y="105" class="text" text-anchor="middle" font-weight="bold">SERVE</text>
  <text x="545" y="130" class="small" text-anchor="middle">Query API</text>
  <text x="545" y="145" class="small" text-anchor="middle">CDN Edge</text>
  <text x="545" y="160" class="small" text-anchor="middle">Headers</text>

  <!-- Trust Layer -->
  <rect x="50" y="230" width="570" height="70" class="trust" rx="4"/>
  <text x="335" y="255" class="text" text-anchor="middle" font-weight="bold">TRUST LAYER</text>
  <text x="335" y="280" class="small" text-anchor="middle">Signing Engine    |    Verification    |    Compliance Levels</text>
</svg>
