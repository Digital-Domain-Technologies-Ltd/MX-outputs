<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outer { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
    .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .layer { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
    .comp { fill: #fff; stroke: #666; stroke-width: 1; }
    .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
    .small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
    .arrow { stroke: #1976d2; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
  </style>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="20" y="20" width="660" height="340" class="outer" rx="8"/>
  <text x="350" y="50" class="title" text-anchor="middle">MAXINE</text>

  <!-- INTAKE box -->
  <rect x="50" y="80" width="150" height="110" class="box" rx="4"/>
  <text x="125" y="105" class="text" text-anchor="middle">INTAKE</text>
  <text x="125" y="130" class="small" text-anchor="middle">Parse</text>
  <text x="125" y="145" class="small" text-anchor="middle">Classify</text>
  <text x="125" y="160" class="small" text-anchor="middle">Route</text>

  <!-- Arrow 1 -->
  <path d="M 200 135 L 250 135" class="arrow"/>

  <!-- REASON box -->
  <rect x="260" y="80" width="150" height="110" class="box" rx="4"/>
  <text x="335" y="105" class="text" text-anchor="middle">REASON</text>
  <text x="335" y="130" class="small" text-anchor="middle">Interpret</text>
  <text x="335" y="145" class="small" text-anchor="middle">Context</text>
  <text x="335" y="160" class="small" text-anchor="middle">Intent</text>

  <!-- Arrow 2 -->
  <path d="M 410 135 L 460 135" class="arrow"/>

  <!-- EXECUTE box -->
  <rect x="470" y="80" width="150" height="110" class="box" rx="4"/>
  <text x="545" y="105" class="text" text-anchor="middle">EXECUTE</text>
  <text x="545" y="130" class="small" text-anchor="middle">Plan</text>
  <text x="545" y="145" class="small" text-anchor="middle">Act</text>
  <text x="545" y="160" class="small" text-anchor="middle">Verify</text>

  <!-- Integration Layer -->
  <rect x="50" y="220" width="570" height="110" class="layer" rx="4"/>
  <text x="335" y="245" class="text" text-anchor="middle">INTEGRATION LAYER</text>

  <!-- Component boxes inside layer -->
  <rect x="70" y="260" width="100" height="50" class="comp" rx="4"/>
  <text x="120" y="280" class="small" text-anchor="middle">REGINALD</text>
  <text x="120" y="295" class="small" text-anchor="middle">Trust</text>

  <rect x="190" y="260" width="100" height="50" class="comp" rx="4"/>
  <text x="240" y="280" class="small" text-anchor="middle">mx-exec</text>
  <text x="240" y="295" class="small" text-anchor="middle">Execute</text>

  <rect x="310" y="260" width="100" height="50" class="comp" rx="4"/>
  <text x="360" y="280" class="small" text-anchor="middle">Tools</text>
  <text x="360" y="295" class="small" text-anchor="middle">APIs</text>

  <rect x="430" y="260" width="100" height="50" class="comp" rx="4"/>
  <text x="480" y="280" class="small" text-anchor="middle">Memory</text>
  <text x="480" y="295" class="small" text-anchor="middle">Context</text>
</svg>
