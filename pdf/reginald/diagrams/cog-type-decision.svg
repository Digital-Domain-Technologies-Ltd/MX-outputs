<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="180" viewBox="0 0 450 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .question { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .yes { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    .no { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #333; }
    .small { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #666; }
  </style>

  <!-- Question box -->
  <rect x="20" y="60" width="200" height="50" class="question" rx="4"/>
  <text x="120" y="82" class="text" text-anchor="middle">Has runbook: or</text>
  <text x="120" y="97" class="text" text-anchor="middle">@embedded:script-id?</text>

  <!-- Arrow down -->
  <line x1="220" y1="85" x2="250" y2="85" stroke="#333" stroke-width="2"/>

  <!-- Decision point -->
  <circle cx="265" cy="85" r="8" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- YES branch -->
  <line x1="273" y1="85" x2="310" y2="50" stroke="#388e3c" stroke-width="2"/>
  <text x="283" y="55" class="small" fill="#388e3c">YES</text>
  <rect x="310" y="30" width="120" height="40" class="yes" rx="4"/>
  <text x="370" y="47" class="text" text-anchor="middle">Action COG</text>
  <text x="370" y="62" class="small" text-anchor="middle">(executable)</text>

  <!-- NO branch -->
  <line x1="273" y1="85" x2="310" y2="120" stroke="#f57c00" stroke-width="2"/>
  <text x="283" y="130" class="small" fill="#f57c00">NO</text>
  <rect x="310" y="100" width="120" height="40" class="no" rx="4"/>
  <text x="370" y="117" class="text" text-anchor="middle">Info COG</text>
  <text x="370" y="132" class="small" text-anchor="middle">(reference only)</text>
</svg>
