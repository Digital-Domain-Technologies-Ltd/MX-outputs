<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #333; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #666; font-style: italic; }
    .mono { font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; fill: #333; }
  </style>

  <!-- Main box -->
  <rect x="50" y="20" width="300" height="240" class="box" rx="4"/>

  <!-- Content lines -->
  <text x="70" y="50" class="mono">---</text>
  <text x="70" y="70" class="mono">name: my-document</text>
  <text x="70" y="90" class="mono">description: "Example"</text>
  <text x="70" y="110" class="mono">---</text>

  <text x="70" y="150" class="mono"># Human-Readable Content</text>
  <text x="70" y="170" class="mono">This is the document...</text>

  <!-- Divider line -->
  <line x1="50" y1="125" x2="350" y2="125" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>

  <!-- Labels -->
  <text x="370" y="55" class="label">YAML frontmatter</text>
  <text x="370" y="75" class="label">start</text>

  <text x="370" y="105" class="label">YAML frontmatter</text>
  <text x="370" y="125" class="label">end</text>

  <text x="370" y="165" class="label">Markdown body</text>

  <!-- Arrows -->
  <path d="M 355 60 L 365 60" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 355 110 L 365 110" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 355 160 L 365 160" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
