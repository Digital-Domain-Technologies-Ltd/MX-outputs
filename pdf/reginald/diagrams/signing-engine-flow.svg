<?xml version="1.0" encoding="UTF-8"?>
<svg width="550" height="200" viewBox="0 0 550 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .sub { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
    .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
    .small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .vline { stroke: #999; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- COG Input -->
  <rect x="30" y="50" width="120" height="50" class="box" rx="4"/>
  <text x="90" y="80" class="text" text-anchor="middle">COG Input</text>

  <!-- Arrow to Validator -->
  <path d="M 150 75 L 190 75" class="arrow"/>

  <!-- Validator -->
  <rect x="200" y="50" width="120" height="50" class="box" rx="4"/>
  <text x="260" y="80" class="text" text-anchor="middle">Validator</text>

  <!-- Arrow to Signer -->
  <path d="M 320 75 L 360 75" class="arrow"/>

  <!-- Signer -->
  <rect x="370" y="50" width="120" height="50" class="box" rx="4"/>
  <text x="430" y="80" class="text" text-anchor="middle">Signer</text>

  <!-- Vertical lines -->
  <line x1="260" y1="100" x2="260" y2="130" class="vline"/>
  <line x1="430" y1="100" x2="430" y2="130" class="vline"/>

  <!-- Schema Validator -->
  <rect x="190" y="130" width="110" height="45" class="sub" rx="4"/>
  <text x="245" y="150" class="small" text-anchor="middle">Schema</text>
  <text x="245" y="165" class="small" text-anchor="middle">Validator</text>

  <!-- Ed25519 Keypair -->
  <rect x="370" y="130" width="110" height="45" class="sub" rx="4"/>
  <text x="425" y="150" class="small" text-anchor="middle">Ed25519</text>
  <text x="425" y="165" class="small" text-anchor="middle">Keypair</text>
</svg>
