<?xml version="1.0" encoding="UTF-8"?>
<svg width="550" height="250" viewBox="0 0 550 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .level5 { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    .level34 { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
    .level12 { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
    .text { font-family: system-ui, sans-serif; font-size: 11px; fill: #333; font-weight: bold; }
    .small { font-family: system-ui, sans-serif; font-size: 9px; fill: #666; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .branch { stroke: #666; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Maxine Request -->
  <rect x="30" y="50" width="110" height="50" class="box" rx="4"/>
  <text x="85" y="72" class="text" text-anchor="middle">Maxine</text>
  <text x="85" y="87" class="small" text-anchor="middle">Request</text>

  <!-- Arrow 1 -->
  <path d="M 140 75 L 180 75" class="arrow"/>

  <!-- REGINALD Verify -->
  <rect x="190" y="50" width="110" height="50" class="box" rx="4"/>
  <text x="245" y="72" class="text" text-anchor="middle">REGINALD</text>
  <text x="245" y="87" class="small" text-anchor="middle">Verify</text>

  <!-- Arrow 2 -->
  <path d="M 300 75 L 340 75" class="arrow"/>

  <!-- Decision -->
  <rect x="350" y="50" width="110" height="50" class="box" rx="4"/>
  <text x="405" y="80" class="text" text-anchor="middle">Decision</text>

  <!-- Vertical line from decision -->
  <line x1="405" y1="100" x2="405" y2="130" class="branch"/>

  <!-- Branch lines -->
  <line x1="405" y1="130" x2="150" y2="130" class="branch"/>
  <line x1="150" y1="130" x2="150" y2="160" class="branch"/>

  <line x1="405" y1="130" x2="275" y2="130" class="branch"/>
  <line x1="275" y1="130" x2="275" y2="160" class="branch"/>

  <line x1="405" y1="130" x2="405" y2="160" class="branch"/>

  <!-- Level 5 -->
  <rect x="90" y="165" width="120" height="60" class="level5" rx="4"/>
  <text x="150" y="185" class="text" text-anchor="middle">Level 5</text>
  <text x="150" y="200" class="small" text-anchor="middle">Execute</text>
  <text x="150" y="212" class="small" text-anchor="middle">Trusted</text>

  <!-- Level 3-4 -->
  <rect x="215" y="165" width="120" height="60" class="level34" rx="4"/>
  <text x="275" y="185" class="text" text-anchor="middle">Level 3-4</text>
  <text x="275" y="200" class="small" text-anchor="middle">Warn and</text>
  <text x="275" y="212" class="small" text-anchor="middle">Execute</text>

  <!-- Level 1-2 -->
  <rect x="345" y="165" width="120" height="60" class="level12" rx="4"/>
  <text x="405" y="185" class="text" text-anchor="middle">Level 1-2</text>
  <text x="405" y="200" class="small" text-anchor="middle">Refuse</text>
  <text x="405" y="212" class="small" text-anchor="middle">or Ask</text>
</svg>
