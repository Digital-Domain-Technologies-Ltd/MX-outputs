<?xml version="1.0" encoding="UTF-8"?>
<svg width="550" height="320" viewBox="0 0 550 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outer { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
    .edge { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .origin { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    .title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
    .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
    .small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
    .line { stroke: #666; stroke-width: 2; }
  </style>

  <!-- Outer container -->
  <rect x="20" y="20" width="510" height="280" class="outer" rx="8"/>
  <text x="275" y="50" class="title" text-anchor="middle">REGINALD CDN</text>

  <!-- Edge nodes -->
  <rect x="60" y="80" width="100" height="60" class="edge" rx="4"/>
  <text x="110" y="105" class="text" text-anchor="middle">Edge</text>
  <text x="110" y="125" class="small" text-anchor="middle">EU</text>

  <rect x="210" y="80" width="100" height="60" class="edge" rx="4"/>
  <text x="260" y="105" class="text" text-anchor="middle">Edge</text>
  <text x="260" y="125" class="small" text-anchor="middle">US</text>

  <rect x="360" y="80" width="100" height="60" class="edge" rx="4"/>
  <text x="410" y="105" class="text" text-anchor="middle">Edge</text>
  <text x="410" y="125" class="small" text-anchor="middle">Asia</text>

  <!-- Lines from edges to center -->
  <line x1="110" y1="140" x2="110" y2="170" class="line"/>
  <line x1="110" y1="170" x2="260" y2="200" class="line"/>

  <line x1="260" y1="140" x2="260" y2="200" class="line"/>

  <line x1="410" y1="140" x2="410" y2="170" class="line"/>
  <line x1="410" y1="170" x2="260" y2="200" class="line"/>

  <!-- Origin -->
  <rect x="185" y="210" width="150" height="60" class="origin" rx="4"/>
  <text x="260" y="235" class="text" text-anchor="middle">Origin</text>
  <text x="260" y="255" class="small" text-anchor="middle">(Glasgow)</text>
</svg>
