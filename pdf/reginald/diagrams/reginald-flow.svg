<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
    .center { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
    .small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Publisher -->
  <rect x="30" y="40" width="130" height="80" class="box" rx="4"/>
  <text x="95" y="65" class="text" text-anchor="middle">Publisher</text>
  <text x="95" y="85" class="small" text-anchor="middle">Submits</text>
  <text x="95" y="100" class="small" text-anchor="middle">COG docs</text>

  <!-- Arrow 1 -->
  <path d="M 160 80 L 210 80" class="arrow"/>

  <!-- REGINALD Registry -->
  <rect x="220" y="40" width="150" height="80" class="center" rx="4"/>
  <text x="295" y="65" class="text" text-anchor="middle">REGINALD</text>
  <text x="295" y="82" class="small" text-anchor="middle">Registry</text>
  <text x="295" y="97" class="small" text-anchor="middle">Stores | Verifies</text>

  <!-- Arrow 2 -->
  <path d="M 370 80 L 420 80" class="arrow"/>

  <!-- AI Agent -->
  <rect x="430" y="40" width="130" height="80" class="box" rx="4"/>
  <text x="495" y="65" class="text" text-anchor="middle">AI Agent</text>
  <text x="495" y="85" class="small" text-anchor="middle">Queries</text>
  <text x="495" y="100" class="small" text-anchor="middle">Gets answer</text>
</svg>
