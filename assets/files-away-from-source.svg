<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Files Away From Their Source</title>
  <desc id="desc">An MX file leaves a publisher carrying a YAML metadata band. The file arrives intact at five destinations — an AI agent, an email inbox, a printed page with a QR code, a regulator, and a long-term archive — its metadata band still visible at every stop. A REGINALD registry node sits between source and destinations, resolving the file's canonical identity from anywhere.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d2137"/>
    </linearGradient>

    <linearGradient id="fileBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4f8"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ba4e6"/>
    </marker>

    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a843"/>
    </marker>

    <symbol id="file" viewBox="0 0 120 150">
      <rect x="2" y="2" width="116" height="146" rx="4" fill="url(#fileBody)" stroke="#1a3a5c" stroke-width="1.5"/>
      <rect x="2" y="2" width="116" height="44" rx="4" fill="#1a3a5c"/>
      <rect x="2" y="42" width="116" height="2" fill="#d4a843"/>
      <text x="10" y="16" font-family="SFMono-Regular, Consolas, monospace" font-size="7" fill="#d4a843">---</text>
      <text x="10" y="26" font-family="SFMono-Regular, Consolas, monospace" font-size="7" fill="#e8edf2">mx:</text>
      <text x="10" y="34" font-family="SFMono-Regular, Consolas, monospace" font-size="6" fill="#b3c1d4">  canonicalUrn</text>
      <text x="10" y="40" font-family="SFMono-Regular, Consolas, monospace" font-size="6" fill="#b3c1d4">  expires</text>
      <line x1="12" y1="58" x2="108" y2="58" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="68" x2="100" y2="68" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="78" x2="108" y2="78" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="88" x2="92" y2="88" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="98" x2="104" y2="98" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="108" x2="88" y2="108" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="118" x2="100" y2="118" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="128" x2="80" y2="128" stroke="#b3c1d4" stroke-width="1"/>
      <line x1="12" y1="138" x2="96" y2="138" stroke="#b3c1d4" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <text x="60" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Files Away From Their Source</text>
  <text x="60" y="86" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#b3c1d4">What an MX file carries with it, wherever it lands.</text>

  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#1a3a5c" stroke="#2070c0" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#5ba4e6">PUBLISHER</text>
    <line x1="20" y1="40" x2="180" y2="40" stroke="#2070c0" stroke-width="1" opacity="0.4"/>
    <use href="#file" x="40" y="50" width="120" height="150"/>
  </g>
  <text x="160" y="445" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b3c1d4">source of the file</text>

  <g transform="translate(490, 260)">
    <circle cx="100" cy="100" r="90" fill="#0a1628" stroke="#d4a843" stroke-width="2"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#d4a843" stroke-width="1" opacity="0.4"/>
    <text x="100" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#d4a843">REGINALD</text>
    <text x="100" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#e8edf2">registry</text>
    <text x="100" y="130" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#b3c1d4">canonicalUrn -&gt; location</text>
  </g>
  <text x="590" y="485" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#b3c1d4">resolves identity from anywhere</text>

  <path d="M 270 320 Q 380 290 490 360" fill="none" stroke="#d4a843" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <g transform="translate(820, 130)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#2070c0" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5ba4e6">AI AGENT</text>
    <use href="#file" x="60" y="30" width="40" height="50"/>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">cites attested facts</text>
  </g>

  <g transform="translate(1000, 130)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#2070c0" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5ba4e6">EMAIL</text>
    <use href="#file" x="60" y="30" width="40" height="50"/>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">attached, intact</text>
  </g>

  <g transform="translate(820, 270)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#d4a843" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4a843">PRINT + QR</text>
    <use href="#file" x="40" y="30" width="40" height="50"/>
    <g transform="translate(95, 35)">
      <rect x="0" y="0" width="40" height="40" fill="#ffffff"/>
      <rect x="4" y="4" width="8" height="8" fill="#0a1628"/>
      <rect x="16" y="4" width="4" height="4" fill="#0a1628"/>
      <rect x="28" y="4" width="8" height="8" fill="#0a1628"/>
      <rect x="4" y="16" width="4" height="4" fill="#0a1628"/>
      <rect x="20" y="16" width="4" height="4" fill="#0a1628"/>
      <rect x="32" y="16" width="4" height="4" fill="#0a1628"/>
      <rect x="4" y="28" width="8" height="8" fill="#0a1628"/>
      <rect x="16" y="24" width="4" height="4" fill="#0a1628"/>
      <rect x="20" y="32" width="8" height="4" fill="#0a1628"/>
      <rect x="28" y="28" width="8" height="8" fill="#0a1628"/>
    </g>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">QR resolves to COG</text>
  </g>

  <g transform="translate(1000, 270)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#2070c0" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5ba4e6">REGULATOR</text>
    <use href="#file" x="60" y="30" width="40" height="50"/>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">evidence on demand</text>
  </g>

  <g transform="translate(820, 410)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#2070c0" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5ba4e6">ARCHIVE</text>
    <use href="#file" x="60" y="30" width="40" height="50"/>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">readable years later</text>
  </g>

  <g transform="translate(1000, 410)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#1a3a5c" stroke="#2070c0" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#5ba4e6">ANOTHER SITE</text>
    <use href="#file" x="60" y="30" width="40" height="50"/>
    <text x="80" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#b3c1d4">republished, verifiable</text>
  </g>

  <path d="M 690 330 Q 760 240 820 185" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 690 330 Q 830 250 1000 185" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 690 360 L 820 325" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 690 360 L 1000 325" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 690 400 Q 760 440 820 465" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 690 400 Q 830 460 1000 465" fill="none" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>

  <g transform="translate(60, 545)">
    <rect x="0" y="0" width="14" height="14" fill="#1a3a5c" stroke="#d4a843" stroke-width="1"/>
    <rect x="0" y="0" width="14" height="4" fill="#d4a843"/>
    <text x="22" y="11" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#e8edf2">YAML frontmatter band travels with the body</text>
  </g>
  <g transform="translate(420, 545)">
    <line x1="0" y1="7" x2="22" y2="7" stroke="#5ba4e6" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="30" y="11" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#e8edf2">the file travels to a destination</text>
  </g>
  <g transform="translate(760, 545)">
    <line x1="0" y1="7" x2="22" y2="7" stroke="#d4a843" stroke-width="2" marker-end="url(#arrowGold)"/>
    <text x="30" y="11" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#e8edf2">identity stays resolvable through REGINALD</text>
  </g>

  <text x="600" y="605" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b3c1d4" font-style="italic">MX makes the file readable, attributable, and trustworthy once it has left the page, the domain, the platform, or the format it was first published in.</text>
</svg>
