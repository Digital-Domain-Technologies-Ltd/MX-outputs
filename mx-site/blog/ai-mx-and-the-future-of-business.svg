<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="title desc">
  <title id="title">AI, MX, and the Future of Business — three pillars supporting the agentic journey</title>
  <desc id="desc">Three pillars labelled Strategy (Leapfrog), Implementation (MX Handbook and Protocols) and Community (The Gathering) form a base. Above them, an arrow shows agents moving through Discovery, Citation, Comparison and Confidence to reach a buyer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#142847"/>
    </linearGradient>
    <linearGradient id="pillarStrategy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f1f4d"/>
    </linearGradient>
    <linearGradient id="pillarImpl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0a5e57"/>
    </linearGradient>
    <linearGradient id="pillarCommunity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c3a06"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#fde68a"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff">AI, MX, and the Future of Business</text>
  <text x="450" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9fb4d4">Three pillars. One agentic journey. A web that no longer needs to guess.</text>

  <!-- Agentic journey arrow -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#0a1628">
    <rect x="60"  y="110" width="160" height="56" rx="6" fill="#fde68a"/>
    <text x="140" y="135" text-anchor="middle" font-weight="bold">Discovery</text>
    <text x="140" y="153" text-anchor="middle">crawl &amp; semantics</text>

    <rect x="240" y="110" width="160" height="56" rx="6" fill="#fde68a"/>
    <text x="320" y="135" text-anchor="middle" font-weight="bold">Citation</text>
    <text x="320" y="153" text-anchor="middle">structured facts</text>

    <rect x="420" y="110" width="160" height="56" rx="6" fill="#fde68a"/>
    <text x="500" y="135" text-anchor="middle" font-weight="bold">Comparison</text>
    <text x="500" y="153" text-anchor="middle">specs &amp; price</text>

    <rect x="600" y="110" width="160" height="56" rx="6" fill="#fde68a"/>
    <text x="680" y="135" text-anchor="middle" font-weight="bold">Confidence</text>
    <text x="680" y="153" text-anchor="middle">provenance</text>
  </g>
  <path d="M220 138 L240 138" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M400 138 L420 138" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M580 138 L600 138" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 138 L820 138" stroke="#fde68a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Buyer node -->
  <circle cx="850" cy="138" r="22" fill="#ffffff"/>
  <text x="850" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0a1628">Buyer</text>

  <!-- Subtitle for journey -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" fill="#9fb4d4">The agentic journey — miss any stage and the chain breaks.</text>

  <!-- Pillars label -->
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="12" fill="#9fb4d4">The three pillars holding the journey up</text>

  <!-- Pillar: Strategy -->
  <g>
    <rect x="60"  y="225" width="240" height="220" rx="10" fill="url(#pillarStrategy)" stroke="#3b5fb5" stroke-width="1"/>
    <text x="180" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#ffffff">1. Strategy</text>
    <text x="180" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#cdd9f0">The Leapfrog</text>
    <line x1="90" y1="294" x2="270" y2="294" stroke="#3b5fb5" stroke-width="1"/>
    <text x="78" y="320" font-family="Arial, sans-serif" font-size="12" fill="#e6edf8">Skip the messy middle.</text>
    <text x="78" y="340" font-family="Arial, sans-serif" font-size="12" fill="#e6edf8">Leave legacy CMS debt</text>
    <text x="78" y="358" font-family="Arial, sans-serif" font-size="12" fill="#e6edf8">behind. Move directly to</text>
    <text x="78" y="376" font-family="Arial, sans-serif" font-size="12" fill="#e6edf8">AI-native, semantic HTML.</text>
    <text x="78" y="412" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#9fb4d4">Digital Domain Technologies</text>
    <text x="78" y="430" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#9fb4d4">Free MX Maturity Audit</text>
  </g>

  <!-- Pillar: Implementation -->
  <g>
    <rect x="330" y="225" width="240" height="220" rx="10" fill="url(#pillarImpl)" stroke="#2dd4bf" stroke-width="1"/>
    <text x="450" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#ffffff">2. Implementation</text>
    <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#cdf3ee">Engineering for trust</text>
    <line x1="360" y1="294" x2="540" y2="294" stroke="#2dd4bf" stroke-width="1"/>
    <text x="348" y="320" font-family="Arial, sans-serif" font-size="12" fill="#e6f7f4">State what is true,</text>
    <text x="348" y="340" font-family="Arial, sans-serif" font-size="12" fill="#e6f7f4">where the machine looks,</text>
    <text x="348" y="358" font-family="Arial, sans-serif" font-size="12" fill="#e6f7f4">in a form it can parse.</text>
    <text x="348" y="376" font-family="Arial, sans-serif" font-size="12" fill="#e6f7f4">No guessing. No hallucination.</text>
    <text x="348" y="412" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#9ee2da">MX: The Handbook — out now</text>
    <text x="348" y="430" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#9ee2da">MX: The Protocols — 1 July 2026</text>
  </g>

  <!-- Pillar: Community -->
  <g>
    <rect x="600" y="225" width="240" height="220" rx="10" fill="url(#pillarCommunity)" stroke="#f59e0b" stroke-width="1"/>
    <text x="720" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#ffffff">3. Community</text>
    <text x="720" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fde6c9">Open standards</text>
    <line x1="630" y1="294" x2="810" y2="294" stroke="#f59e0b" stroke-width="1"/>
    <text x="618" y="320" font-family="Arial, sans-serif" font-size="12" fill="#fdf2e0">A machine-readable web</text>
    <text x="618" y="340" font-family="Arial, sans-serif" font-size="12" fill="#fdf2e0">is a public good.</text>
    <text x="618" y="358" font-family="Arial, sans-serif" font-size="12" fill="#fdf2e0">No single vendor owns it.</text>
    <text x="618" y="376" font-family="Arial, sans-serif" font-size="12" fill="#fdf2e0">No single vendor blocks it.</text>
    <text x="618" y="412" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#fbd089">The Gathering — tg.community</text>
    <text x="618" y="430" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#fbd089">Sponsors welcome</text>
  </g>

  <!-- Connecting lines from pillars up to journey strip -->
  <g stroke="#9fb4d4" stroke-width="1" stroke-dasharray="3,4" fill="none" opacity="0.6">
    <path d="M180 225 L180 175"/>
    <path d="M450 225 L450 175"/>
    <path d="M720 225 L720 175"/>
  </g>

  <!-- Footer -->
  <text x="60"  y="500" font-family="Arial, sans-serif" font-size="12" fill="#9fb4d4">The MX Paradox: what works for the machine works for the human.</text>
  <text x="60"  y="522" font-family="Arial, sans-serif" font-size="11" fill="#6b87b5">mx.allabout.network</text>
  <text x="840" y="522" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b87b5">Tom Cranstoun · CogNovaMX</text>
</svg>
