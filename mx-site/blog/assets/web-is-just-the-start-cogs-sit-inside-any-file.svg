<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 320"
     role="img"
     aria-labelledby="diagram-title diagram-desc">

  <title id="diagram-title">COGs sit inside any file format</title>
  <desc id="diagram-desc">Seven file icons in a row, labelled .md, .html, .pdf, .mp4, .mp3, .jpg, and .json. Each file carries the same COG metadata block in its header. The visual shows that COGs travel inside existing file formats and do not require a new runtime or proprietary tooling.</desc>

  <rect width="800" height="320" fill="#f4efe6"/>

  <text x="400" y="38"
        text-anchor="middle"
        font-family="Fraunces, Georgia, serif"
        font-size="20"
        font-weight="500"
        fill="#1a1815">COGs sit inside any file format</text>

  <!-- File 1: .md -->
  <g transform="translate(37, 80)">
    <path d="M 0 0 L 70 0 L 90 20 L 90 130 L 0 130 Z"
          fill="#ebe4d6" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 70 0 L 70 20 L 90 20"
          fill="none" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="40" width="66" height="22" rx="3" fill="#b85328"/>
    <text x="45" y="56" text-anchor="middle"
          font-family="Inter Tight, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#f4efe6"
          letter-spacing="1.5">COG</text>
    <text x="45" y="100" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="500" fill="#1a1815">.md</text>
  </g>

  <!-- File 2: .html -->
  <g transform="translate(143, 80)">
    <path d="M 0 0 L 70 0 L 90 20 L 90 130 L 0 130 Z"
          fill="#ebe4d6" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 70 0 L 70 20 L 90 20"
          fill="none" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="40" width="66" height="22" rx="3" fill="#b85328"/>
    <text x="45" y="56" text-anchor="middle"
          font-family="Inter Tight, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#f4efe6"
          letter-spacing="1.5">COG</text>
    <text x="45" y="100" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="500" fill="#1a1815">.html</text>
  </g>

