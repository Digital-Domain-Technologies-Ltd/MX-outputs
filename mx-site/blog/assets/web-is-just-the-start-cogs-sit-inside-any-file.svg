    <path d="M 70 0 L 70 20 L 90 20"
          fill="none" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="40" width="66" height="22" rx="3" fill="#b85328"/>
    <text x="45" y="56" text-anchor="middle"
          font-family="Inter Tight, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#f4efe6"
          letter-spacing="1.5">COG</text>
    <text x="45" y="100" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
