  </g>

  <!-- File 7: .json -->
  <g transform="translate(673, 80)">
    <path d="M 0 0 L 70 0 L 90 20 L 90 130 L 0 130 Z"
          fill="#ebe4d6" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 70 0 L 70 20 L 90 20"
          fill="none" stroke="#1a1815" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="40" width="66" height="22" rx="3" fill="#b85328"/>
    <text x="45" y="56" text-anchor="middle"
          font-family="Inter Tight, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#f4efe6"
          letter-spacing="1.5">COG</text>
    <text x="45" y="100" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="13" font-weight="500" fill="#1a1815">.json</text>
  </g>

  <!-- Caption -->
  <text x="400" y="258"
        text-anchor="middle"
        font-family="Inter Tight, system-ui, sans-serif"
        font-size="14"
        fill="#1a1815">The same metadata block - identity, state, provenance, conformance - travels</text>
  <text x="400" y="278"
        text-anchor="middle"
        font-family="Inter Tight, system-ui, sans-serif"
        font-size="14"
        fill="#1a1815">inside every file format. No new runtime. No proprietary tooling.</text>

</svg>
