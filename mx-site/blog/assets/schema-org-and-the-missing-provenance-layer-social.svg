<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a1628"/>
  <rect x="0" y="0" width="6" height="630" fill="#3b82f6"/>
  <text x="60" y="120" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#3b82f6" letter-spacing="3">COGNOVAMX</text>
  <text x="60" y="220" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Schema.org keeps growing.</text>
  <text x="60" y="290" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">The provenance layer</text>
  <text x="60" y="360" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">does not exist yet.</text>
  <text x="60" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748b">Schema.org tells machines what content is.</text>
  <text x="60" y="492" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748b">It says nothing about who asserted it.</text>
  <text x="60" y="570" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3b82f6">mx.allabout.network/blog</text>
</svg>
