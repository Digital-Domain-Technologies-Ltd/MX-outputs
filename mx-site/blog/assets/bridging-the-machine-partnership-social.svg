  </text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="22"
        text-anchor="middle" fill="#4a4a4a">
    Hill named the leader. MX names the discipline.
  </text>

  <!-- Author -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="26"
        text-anchor="middle" fill="#555">
