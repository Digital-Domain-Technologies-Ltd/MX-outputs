<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bridging the Machine Partnership">
  <title>Bridging the Machine Partnership</title>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Blue accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#0066cc"/>

  <!-- Eyebrow -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="22"
        text-anchor="middle" fill="#0066cc" font-weight="700"
        letter-spacing="3">
    PARTNERSHIP
  </text>

  <!-- Title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="56"
        font-weight="bold" text-anchor="middle" fill="#1a202c">
    Bridging the Machine
  </text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="56"
        font-weight="bold" text-anchor="middle" fill="#1a202c">
