<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where MX meets the UNESCO Recommendation on the Ethics of AI">
  <title>Where MX meets the UNESCO Recommendation on the Ethics of AI</title>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Blue accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#0066cc"/>

  <!-- Eyebrow -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="22"
        text-anchor="middle" fill="#0066cc" font-weight="700"
        letter-spacing="3">
    POLICY ALIGNMENT
  </text>

  <!-- Title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" text-anchor="middle" fill="#1a202c">
