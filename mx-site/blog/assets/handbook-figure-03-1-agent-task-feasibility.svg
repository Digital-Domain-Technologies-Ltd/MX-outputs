  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .diamond-text { font-size: 10.5px; fill: #fff; font-weight: 500; }
      .box-text { font-size: 11px; fill: #fff; font-weight: 500; }
      .yes-label { font-size: 10px; fill: #2e7d32; font-weight: 700; }
      .no-label { font-size: 10px; fill: #b71c1c; font-weight: 700; }
      .outcome-title { font-size: 12px; fill: #fff; font-weight: 700; letter-spacing: 0.5px; }
      .outcome-detail { font-size: 10px; fill: rgba(255,255,255,0.9); }
      .figure-label { font-size: 12px; fill: #888; font-style: italic; }
      .fail-text { font-size: 9px; fill: #777; }
    </style>
    <marker id="ad" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto">
      <path d="M0,0 L3.5,7 L7,0 Z" fill="#546e7a"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2e7d32"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b71c1c"/>
    </marker>
    <marker id="aa" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Figure caption -->
  <text x="400" y="24" text-anchor="middle" class="figure-label">Figure 3.1: How agents evaluate task completion feasibility</text>

  <!-- ============ TASK BOX (top centre) ============ -->
  <rect x="250" y="38" width="300" height="38" rx="19" fill="#1565c0"/>
  <text x="400" y="53" text-anchor="middle" class="box-text" font-size="10">Agent receives task:</text>
  <text x="400" y="66" text-anchor="middle" class="box-text" font-size="12">"Book a restaurant"</text>

  <!-- Arrow down -->
  <line x1="400" y1="76" x2="400" y2="96" stroke="#546e7a" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- ============ DIAMOND 1 ============ -->
  <polygon points="400,100 500,140 400,180 300,140" fill="#37474f" stroke="#263238" stroke-width="1"/>
  <text x="400" y="136" text-anchor="middle" class="diamond-text">Can I find</text>
  <text x="400" y="148" text-anchor="middle" class="diamond-text">the target?</text>

  <!-- Yes: right -->
  <line x1="500" y1="140" x2="580" y2="140" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="535" y="133" text-anchor="middle" class="yes-label">Yes</text>

  <!-- No: down -->
  <line x1="400" y1="180" x2="400" y2="208" stroke="#546e7a" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- Failure hint: left of diamond 1 -->
  <text x="292" y="133" text-anchor="end" class="fail-text">No sitemap, no semantic</text>
  <text x="292" y="145" text-anchor="end" class="fail-text">HTML, no endpoints</text>

  <!-- ============ DIAMOND 2 ============ -->
  <polygon points="400,212 500,252 400,292 300,252" fill="#37474f" stroke="#263238" stroke-width="1"/>
  <text x="400" y="248" text-anchor="middle" class="diamond-text">Can I identify</text>
  <text x="400" y="260" text-anchor="middle" class="diamond-text">the form?</text>

  <!-- Yes: right -->
  <line x1="500" y1="252" x2="580" y2="252" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="535" y="245" text-anchor="middle" class="yes-label">Yes</text>

  <!-- No: down -->
  <line x1="400" y1="292" x2="400" y2="320" stroke="#546e7a" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- Failure hint: left of diamond 2 -->
  <text x="292" y="245" text-anchor="end" class="fail-text">No form labels, no ARIA,</text>
  <text x="292" y="257" text-anchor="end" class="fail-text">JS-only interactions</text>

  <!-- ============ DIAMOND 3 ============ -->
  <polygon points="400,324 500,364 400,404 300,364" fill="#37474f" stroke="#263238" stroke-width="1"/>
  <text x="400" y="360" text-anchor="middle" class="diamond-text">Do I have</text>
  <text x="400" y="372" text-anchor="middle" class="diamond-text">required context?</text>

  <!-- Yes: right -->
  <line x1="500" y1="364" x2="580" y2="364" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="535" y="357" text-anchor="middle" class="yes-label">Yes</text>

  <!-- No: down -->
  <line x1="400" y1="404" x2="400" y2="422" stroke="#b71c1c" stroke-width="2"/>

  <!-- Failure hint: left of diamond 3 -->
  <text x="292" y="357" text-anchor="end" class="fail-text">No Schema.org pricing,</text>
  <text x="292" y="369" text-anchor="end" class="fail-text">no availability data</text>

  <!-- ============ OUTCOME: SUCCESS (right side, top) ============ -->
  <rect x="588" y="112" width="185" height="56" rx="6" fill="#2e7d32"/>
  <text x="680" y="133" text-anchor="middle" class="outcome-title">SUCCESS</text>
  <text x="680" y="149" text-anchor="middle" class="outcome-detail">Complete context provided.</text>
  <text x="680" y="161" text-anchor="middle" class="outcome-detail">Task executed autonomously.</text>

  <!-- ============ OUTCOME: PARTIAL (right side, middle) ============ -->
  <rect x="588" y="224" width="185" height="56" rx="6" fill="#e65100"/>
  <text x="680" y="245" text-anchor="middle" class="outcome-title">PARTIAL</text>
  <text x="680" y="261" text-anchor="middle" class="outcome-detail">Agent requests clarification</text>
  <text x="680" y="273" text-anchor="middle" class="outcome-detail">from user before proceeding.</text>

  <!-- ============ OUTCOME: BLOCKED (right side, bottom) ============ -->
  <rect x="588" y="336" width="185" height="56" rx="6" fill="#b71c1c"/>
  <text x="680" y="357" text-anchor="middle" class="outcome-title">BLOCKED</text>
  <text x="680" y="373" text-anchor="middle" class="outcome-detail">Insufficient context.</text>
  <text x="680" y="385" text-anchor="middle" class="outcome-detail">Escalate to human.</text>

  <!-- ============ FAILURE PATH: Diamond 3 No to BLOCKED ============ -->
  <!-- Down from diamond 3, curve right to BLOCKED bottom -->
  <path d="M400,422 L400,440 Q400,448 408,448 L530,448 Q538,448 538,440 L538,392 L586,392" fill="none" stroke="#b71c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="413" y="416" class="no-label">No</text>

  <!-- ============ ACCUMULATION EXPLANATION ============ -->
  <!-- Subtle annotation explaining the Yes progression -->
  <rect x="30" y="424" width="260" height="50" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="160" y="443" text-anchor="middle" style="font-size:9.5px;fill:#555;font-weight:600;">Each "Yes" passes to the next check.</text>
  <text x="160" y="456" text-anchor="middle" style="font-size:9.5px;fill:#555;">Each "No" falls through — fewer "Yes"</text>
  <text x="160" y="469" text-anchor="middle" style="font-size:9.5px;fill:#555;">answers means less agent capability.</text>

  <!-- Bottom caption -->
  <text x="400" y="494" text-anchor="middle" style="font-size:10px;fill:#999;">Each decision point corresponds to explicit metadata that site owners control</text>
</svg>
