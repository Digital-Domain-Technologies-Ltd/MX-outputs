<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TYPO3 and MX: editorial discipline, and a platform that supports it">
  <title>TYPO3 and MX: editorial discipline, and a platform that supports it</title>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Blue accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#0066cc"/>

  <!-- Eyebrow -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="22"
