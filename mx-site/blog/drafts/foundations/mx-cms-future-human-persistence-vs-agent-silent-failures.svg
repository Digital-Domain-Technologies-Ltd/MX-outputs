  <!-- Title -->
  <text x="400" y="25" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Human Persistence vs Agent Silent Failures</text>
  
  <!-- Human side (left) -->
  <text x="200" y="60" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Human Behavior</text>
  
  <circle cx="200" cy="100" r="35" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <text x="200" y="107" font-size="12" fill="white" text-anchor="middle" font-weight="bold">User</text>
  
  <!-- Parsing error -->
  <rect x="140" y="150" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="200" y="167" font-size="11" fill="white" text-anchor="middle">Parsing Error</text>
  <text x="200" y="182" font-size="10" fill="white" text-anchor="middle">or Ambiguity</text>
  
  <!-- Human actions -->
  <text x="200" y="215" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="bold">Human Response:</text>
  <text x="200" y="232" font-size="9" fill="#7f8c8d" text-anchor="middle">• Retries</text>
  <text x="200" y="246" font-size="9" fill="#7f8c8d" text-anchor="middle">• Calls support</text>
  <text x="200" y="260" font-size="9" fill="#7f8c8d" text-anchor="middle">• Uses workarounds</text>
  
  <!-- Arrow down -->
  <path d="M 200 135 L 200 148" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowdown)"/>
  
  <!-- Agent side (right) -->
  <text x="600" y="60" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">Agent Behavior</text>
  
  <circle cx="600" cy="100" r="35" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="600" y="107" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Agent</text>
  
  <!-- Parsing error -->
  <rect x="540" y="150" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="600" y="167" font-size="11" fill="white" text-anchor="middle">Parsing Error</text>
  <text x="600" y="182" font-size="10" fill="white" text-anchor="middle">or Ambiguity</text>
  
  <!-- Silent failure -->
  <circle cx="600" cy="235" r="30" fill="#34495e" stroke="#2c3e50" stroke-width="2" opacity="0.5"/>
  <text x="600" y="232" font-size="20" fill="white" text-anchor="middle">✗</text>
  <text x="600" y="250" font-size="10" fill="white" text-anchor="middle">Gone</text>
  
  <!-- Arrow down -->
  <path d="M 600 135 L 600 148" stroke="#229954" stroke-width="2" marker-end="url(#arrowdown)"/>
  <path d="M 600 190 L 600 203" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowdown)" stroke-dasharray="3,3"/>
  
  <!-- Agent actions -->
  <text x="600" y="213" font-size="10" fill="#e74c3c" text-anchor="middle" font-weight="bold">Agent Response:</text>
  
  <!-- Labels -->
  <text x="70" y="240" font-size="11" fill="#27ae60" font-weight="bold">Visible failure</text>
  <text x="70" y="255" font-size="9" fill="#7f8c8d">Shows in analytics</text>
  
  <text x="730" y="240" font-size="11" fill="#e74c3c" font-weight="bold">Silent failure</text>
  <text x="730" y="255" font-size="9" fill="#7f8c8d">Invisible in analytics</text>
  
  <!-- VS -->
  <circle cx="400" cy="150" r="25" fill="white" stroke="#95a5a6" stroke-width="2"/>
  <text x="400" y="157" font-size="16" font-weight="bold" fill="#7f8c8d" text-anchor="middle">VS</text>
  
