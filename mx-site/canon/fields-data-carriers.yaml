title: MX Field Dictionary — Carrier Formats Companion
version: '5.6'
created: 2026-02-13T00:00:00.000Z
modified: '2026-10-12'
author: The Gathering
description: >-
  Open standard carrier-format metadata schemas for code (function/class/API/test/inline/dependency/repository).
  Companion to fields-data.yaml; implementations opt in as needed. Databases defer to DCAT and CSVW; media defers to
  Schema.org and EXIF/XMP.
category: standard
mx:
  status: active
  license: MIT
  partOf: mx-the-gathering
  tags:
    - fields
    - metadata
    - carriers
    - code
    - database
    - media
  audience:
    - machines
    - humans
  contentType: field-dictionary
  runbook: >-
    Companion carrier-format dictionary. Implementations that annotate code, databases, or media content merge this with
    fields-data.yaml. Pure document-metadata systems do not need this file.
  fields:
    - name: runtime
      type: string
      authoring: authored
      definition: 'Execution environment. Values: node, browser, deno, bun.'
      example: node
      validValues:
        - node
        - browser
        - deno
        - bun
      notes: Required for script profile.
      status: canonical
      profile: script
    - name: dependencies
      type: array
      authoring: authored
      inPlainWords: 'It depends on {value}.'
      definition: Package dependencies. Array of package names or package@version strings.
      example:
        - markdownlint-cli2
        - gray-matter
      notes: Array of package names or package@version strings.
      status: canonical
      profile: script
    - name: project.name
      type: string
      authoring: authored
      requiredIn: [code-repository]
      definition: Project name for code repository metadata.
      example: My Project
      status: canonical
      profile: code-repository
    - name: project.description
      type: string
      authoring: authored
      requiredIn: [code-repository]
      definition: Brief description of what this project does.
      example: API backend for order processing
      status: canonical
      profile: code-repository
    - name: project.repository
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Source repository URL.
      example: https://github.com/example/my-project
      status: canonical
      profile: code-repository
    - name: project.documentation
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Documentation site URL.
      example: https://docs.example.com/my-project
      status: canonical
      profile: code-repository
    - name: context.domain
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Business or technical domain of the project.
      example: e-commerce
      status: canonical
      profile: code-repository
    - name: context.purpose
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: What the project does (operational purpose, not document description).
      example: API backend for order processing
      status: canonical
      profile: code-repository
    - name: context.constraints
      type: array
      authoring: authored
      optionalIn: [code-repository]
      definition: Non-functional requirements and constraints.
      example:
        - Must handle 10,000 requests per second
        - GDPR compliant
      status: canonical
      profile: code-repository
    - name: stack.language
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Primary programming language.
      example: typescript
      status: canonical
      profile: code-repository
    - name: stack.runtime
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Execution environment.
      example: node
      status: canonical
      profile: code-repository
    - name: stack.version
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Language or runtime version.
      example: 20.x
      status: canonical
      profile: code-repository
    - name: stack.framework
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Primary framework.
      example: express
      status: canonical
      profile: code-repository
    - name: conventions.style
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Code style tool or guide.
      example: prettier
      status: canonical
      profile: code-repository
    - name: conventions.testing
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Testing framework.
      example: jest
      status: canonical
      profile: code-repository
    - name: conventions.documentation
      type: string
      authoring: authored
      optionalIn: [code-repository]
      definition: Documentation format.
      example: jsdoc
      status: canonical
      profile: code-repository
    - name: owner
      type: string
      inPlainWords: '{value} is responsible for it.'
      authoring: authored
      optionalIn: [code-file]
      definition: Team or person responsible for this file or resource.
      example: platform-team
      notes: Used at file and directory level in code metadata. Media rights and database tables defer to their own standards (Schema.org, DCAT, CSVW).
      status: canonical
      profile:
        - code-file
    - name: pure
      type: boolean
      inPlainWords: 'Whether the function changes nothing outside itself: {value}.'
      authoring: authored
      optionalIn: [code-function]
      definition: Whether function has no side effects.
      example: true
      status: canonical
      profile: code-function
    - name: idempotent
      type: boolean
      authoring: authored
      optionalIn: [code-function, code-api]
      definition: Whether repeated calls produce the same result.
      example: true
      status: canonical
      profile:
        - code-function
        - code-api
    - name: complexity
      type: string
      authoring: authored
      optionalIn: [code-function]
      definition: Time complexity in Big O notation.
      example: O(n)
      status: canonical
      profile: code-function
    - name: throws
      type: array
      authoring: authored
      optionalIn: [code-function]
      definition: Exception types this function may throw. Use raises for Python.
      example:
        - InvalidDiscountError
        - NegativePriceError
      status: canonical
      profile: code-function
    - name: since
      type: string
      authoring: authored
      optionalIn: [code-function]
      definition: Version when this function was introduced.
      example: 1.2.0
      status: canonical
      profile: code-function
    - name: see
      type: array
      authoring: authored
      optionalIn: [code-function]
      definition: Related functions or documentation.
      example:
        - calculateSubtotal
        - docs/pricing.md
      status: canonical
      profile: code-function
    - name: pattern
      type: string
      inPlainWords: 'It follows the {value} design pattern.'
      authoring: authored
      optionalIn: [code-class]
      definition: Design pattern used by this class.
      example: singleton
      validValues:
        - singleton
        - factory
        - observer
        - strategy
        - builder
        - adapter
        - decorator
        - proxy
        - command
        - mediator
      status: canonical
      profile: code-class
    - name: threadSafe
      type: boolean
      authoring: authored
      optionalIn: [code-class]
      definition: Whether class is safe for concurrent access.
      example: false
      status: canonical
      profile: code-class
    - name: invariants
      type: array
      authoring: authored
      optionalIn: [code-class]
      definition: Conditions that must always be true for this class.
      example:
        - If currentUser is set, tokens must be valid
        - Token refresh happens before expiry
      status: canonical
      profile: code-class
    - name: dependency.purpose
      type: string
      authoring: authored
      optionalIn: [code-dependency]
      definition: Why this dependency exists.
      example: HTTP server framework
      status: canonical
      profile: code-dependency
    - name: dependency.critical
      type: boolean
      authoring: authored
      optionalIn: [code-dependency]
      definition: Whether this dependency is critical to the project.
      example: true
      status: canonical
      profile: code-dependency
    - name: dependency.upgradePolicy
      type: string
      authoring: authored
      optionalIn: [code-dependency]
      definition: How aggressively to upgrade this dependency.
      example: conservative
      validValues:
        - aggressive
        - conservative
        - locked
        - manual
      status: canonical
      profile: code-dependency
    - name: dependency.alternativesConsidered
      type: array
      authoring: authored
      optionalIn: [code-dependency]
      definition: Alternative packages considered before choosing this dependency.
      example:
        - fastify
        - koa
      status: canonical
      profile: code-dependency
    - name: testType
      type: string
      inPlainWords: 'It is a {value} test.'
      authoring: authored
      requiredIn: [code-test]
      definition: Type of test file.
      example: integration
      validValues:
        - unit
        - integration
        - e2e
        - performance
        - security
        - smoke
        - acceptance
      status: canonical
      profile: code-test
    - name: coverageTarget
      type: number
      authoring: authored
      optionalIn: [code-test]
      definition: Target code coverage percentage.
      example: 90
      status: canonical
      profile: code-test
    - name: subject
      type: string
      inPlainWords: 'It tests {value}.'
      authoring: authored
      requiredIn: [code-test]
      definition: What this test file tests.
      example: src/services/pricing.ts
      status: canonical
      profile: code-test
    - name: fixtures
      type: array
      authoring: authored
      optionalIn: [code-test]
      definition: Test data files required.
      example:
        - __fixtures__/sample-cart.json
      status: canonical
      profile: code-test
    - name: method
      type: string
      inPlainWords: 'The endpoint answers the HTTP {value} method.'
      authoring: authored
      requiredIn: [code-api]
      definition: HTTP method for API endpoint.
      example: POST
      validValues:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        - OPTIONS
      status: canonical
      profile: code-api
    - name: path
      type: string
      inPlainWords: 'The endpoint is at {value}.'
      authoring: authored
      requiredIn: [code-api]
      definition: API endpoint path.
      example: /api/v1/orders
      status: canonical
      profile: code-api
    - name: auth
      type: string
      authoring: authored
      optionalIn: [code-api]
      definition: Authentication requirement for API endpoint.
      example: bearer
      validValues:
        - none
        - basic
        - bearer
        - api-key
        - oauth2
        - session
      status: canonical
      profile: code-api
    - name: rateLimit
      type: string
      authoring: authored
      optionalIn: [code-api]
      definition: Rate limiting configuration.
      example: 100/minute
      status: canonical
      profile: code-api
    - name: cache.enabled
      type: boolean
      authoring: authored
      optionalIn: [code-api]
      definition: Whether API response is cacheable.
      example: true
      status: canonical
      profile: code-api
    - name: cache.ttl
      type: number
      authoring: authored
      optionalIn: [code-api]
      definition: Cache time-to-live in seconds.
      example: 300
      status: canonical
      profile: code-api
    - name: modHooks
      type: array
      authoring: authored
      inPlainWords: 'As a mod it hooks these host events: {value}.'
      requiredIn: [code-mod]
      optionalIn: [action]
      definition: Each host event a mod hooks, with its matcher and the move it makes on that event (observe, rewrite or answer).
      example:
        - tool.call{tool=Bash}:answer
        - ui.render{component=AbovePrompt}:observe
      status: canonical
      profile: code-mod
      notes: >-
        Entry form is event{key=value,...}:move, with the matcher list omitted when the hook takes every event. Observe
        passes the event on unchanged; rewrite passes on a changed event; answer returns without passing it on. The
        grammar is ABNF (Appendix M 13.10): no whitespace, case-sensitive names, values of RFC 3986 unreserved or
        pct-encoded characters. Canonical form sorts matchers by key with no duplicate keys and percent-encodes every
        octet outside unreserved in uppercase hex; a checker canonicalises the declared and the host-derived hooks and
        compares them byte for byte, failing any entry outside the grammar. Checked against the host's own static
        analysis where one exists (claude plugin validate for Claude Code mods).
    - name: modCapabilities
      type: array
      authoring: authored
      inPlainWords: 'As a mod its code uses these host surfaces: {value}.'
      requiredIn: [code-mod]
      optionalIn: [action]
      definition: The host API surfaces a mod's code uses, named as the host names them.
      example:
        - process
        - ui
        - session
      status: canonical
      profile: code-mod
      notes: >-
        A surface the source uses but the declaration omits is a failed check, never a warning; a declared surface the
        source no longer uses is reported as stale.
    - name: modGuarantee
      type: string
      authoring: authored
      inPlainWords: 'What this mod promises, and what it does not: {value}'
      optionalIn: [code-mod, action]
      definition: One sentence stating what a mod promises and what it explicitly does not.
      example: A safety net that reads the command text; not a permission system.
      status: canonical
      profile: code-mod
    - name: testedWith
      type: string
      authoring: authored
      inPlainWords: 'It was last tested with {value}.'
      optionalIn: [code-mod, action]
      definition: The host and version a mod was last tested against, written host@version.
      example: claude-code@2.1.287
      status: canonical
      profile: code-mod
    - name: ai.contextRequired
      type: array
      inPlainWords: 'An AI should read these files before editing it: {value}.'
      authoring: authored
      optionalIn: [code-file, code-class]
      definition: Files AI should read before editing this one.
      example:
        - src/types/user.ts
        - src/config/schema.ts
      notes: Prevents AI from making changes without understanding dependencies.
      status: canonical
      profile:
        - code-file
        - code-function
        - code-class
    - name: ai.contextProvides
      type: array
      inPlainWords: 'Other files depend on these concepts it defines: {value}.'
      authoring: authored
      optionalIn: [code-file]
      definition: Concepts this file defines that other files depend on.
      example:
        - User type definitions
        - Validation rules
      status: canonical
      profile: code-file
    - name: ai.generationNotes
      type: string
      inPlainWords: 'An AI generating similar code should note: {value}.'
      authoring: authored
      optionalIn: [code-file]
      definition: Guidance for AI generating similar code.
      example: Follow the repository's error handling pattern using Result types
      status: canonical
      profile:
        - code-file
        - code-function
    - name: ai.reason
      type: string
      inPlainWords: 'AI restrictions on it exist because {value}.'
      authoring: authored
      optionalIn: [code-file, code-function, code-class]
      definition: Explanation for AI restrictions on this resource.
      example: Handles authentication tokens — changes require security review
      notes: Used with ai.editable, ai.doNotModify, ai.sensitive to explain WHY.
      status: canonical
      profile:
        - code-file
        - code-function
        - code-class
    - name: ai.confidence
      type: number
      inPlainWords: 'Confidence in its correctness is {value}.'
      authoring: authored
      optionalIn: [code-function, code-class]
      definition: Confidence in implementation correctness (0-1).
      example: 0.9
      notes: 0.9 = high confidence, 0.5 = uncertain, below 0.5 = needs review.
      status: canonical
      profile:
        - code-function
        - code-class
    - name: ai.testCoverage
      type: boolean
      inPlainWords: 'It has test coverage: {value}.'
      authoring: authored
      optionalIn: [code-function]
      definition: Whether this function has test coverage.
      example: true
      status: canonical
      profile: code-function
    - name: ai.edgeCases
      type: array
      inPlainWords: 'Its known edge cases are {value}.'
      authoring: authored
      optionalIn: [code-function, code-test]
      definition: Known edge cases and expected behaviour.
      example:
        - Empty cart returns 0
        - Negative discounts are rejected
      status: canonical
      profile:
        - code-function
        - code-test
    - name: ai.refactorNotes
      type: string
      inPlainWords: 'Refactoring it should follow: {value}.'
      authoring: authored
      optionalIn: [code-function]
      definition: Guidance for refactoring this function.
      example: Extract discount logic to separate module when discount types exceed 5
      status: canonical
      profile: code-function
    - name: ai.doNotModify
      type: boolean
      inPlainWords: 'An AI must not change it: {value}.'
      authoring: authored
      optionalIn: [code-function, code-class]
      definition: AI should not change this function.
      example: true
      status: canonical
      profile:
        - code-function
        - code-class
    - name: ai.sensitive
      type: boolean
      inPlainWords: 'It handles sensitive data: {value}.'
      authoring: authored
      optionalIn: [code-class, code-api]
      definition: Whether this class or resource handles sensitive data.
      example: true
      status: canonical
      profile:
        - code-class
        - code-api
    - name: ai.modificationImpact
      type: string
      inPlainWords: 'Changing it may break {value}.'
      authoring: authored
      optionalIn: [code-class]
      definition: What might break if this class changes.
      example: All authentication flows depend on this class
      status: canonical
      profile: code-class
    - name: ai.replacementPermitted
      type: boolean
      inPlainWords: 'An AI may suggest replacing this dependency: {value}.'
      authoring: authored
      optionalIn: [code-dependency]
      definition: Whether AI may suggest replacing this dependency.
      example: false
      status: canonical
      profile: code-dependency
    - name: ai.upgradePermitted
      type: boolean
      inPlainWords: 'An AI may suggest upgrading this dependency: {value}.'
      authoring: authored
      optionalIn: [code-dependency]
      definition: Whether AI may suggest upgrading this dependency.
      example: true
      status: canonical
      profile: code-dependency
    - name: ai.generationPermitted
      type: boolean
      inPlainWords: 'An AI may generate tests for it: {value}.'
      authoring: authored
      optionalIn: [code-test]
      definition: Whether AI may generate tests for this module.
      example: true
      status: canonical
      profile: code-test
    - name: ai.mustCover
      type: array
      inPlainWords: 'Its tests must cover {value}.'
      authoring: authored
      optionalIn: [code-test]
      definition: Scenarios that tests must cover.
      example:
        - empty input
        - maximum values
        - concurrent access
      status: canonical
      profile: code-test
    - name: ai.doNotMock
      type: array
      inPlainWords: 'Its tests must not mock {value}.'
      authoring: authored
      optionalIn: [code-test]
      definition: Dependencies that should not be mocked in tests.
      example:
        - database
        - auth-service
      status: canonical
      profile: code-test
    - name: ai.safeToCall
      type: boolean
      inPlainWords: 'An AI agent may call this endpoint: {value}.'
      authoring: authored
      optionalIn: [code-api]
      definition: Whether AI agents may call this API endpoint.
      example: true
      notes: false means AI should never invoke this endpoint autonomously.
      status: canonical
      profile:
        - code-api
    - name: ai.testMode
      type: string
      inPlainWords: 'Its test mode is {value}.'
      authoring: authored
      optionalIn: [code-api]
      definition: Test mode availability for API endpoint.
      example: 'Use X-Test-Mode: true header'
      status: canonical
      profile: code-api
    - name: ai.sensitiveRequestFields
      type: array
      inPlainWords: 'Its sensitive request fields are {value}.'
      authoring: authored
      optionalIn: [code-api]
      definition: Request fields that contain sensitive data.
      example:
        - password
        - creditCard
      status: canonical
      profile: code-api
    - name: ai.sensitiveResponseFields
      type: array
      inPlainWords: 'Its sensitive response fields are {value}.'
      authoring: authored
      optionalIn: [code-api]
      definition: Response fields that contain sensitive data.
      example:
        - ssn
        - bankAccount
      status: canonical
      profile: code-api
    - name: ai.sideEffects
      type: array
      inPlainWords: 'Calling it has these side effects: {value}.'
      authoring: authored
      optionalIn: [code-api]
      definition: Side effects of calling this API endpoint.
      example:
        - Creates order record
        - Sends confirmation email
        - Charges payment method
      status: canonical
      profile:
        - code-api
  profiles:
    # `script` profile intentionally not declared here. fields-data.yaml carries
    # the evidence-grounded version. scripts/cog-field-rules.js (the engine
    # behind frontmatter-validator.js / cog-tools.js) reads ONLY fields-data.yaml
    # directly for profiles - it does not merge this file's `profiles:` block at
    # all - so fields-data.yaml is the sole load-bearing source.
    - name: code-repository
      description: Repository-level metadata. Lives in mx.yaml, .mx/config.yaml, or package.json[mx].
      header: |
        ---
        # Carrier: mx.yaml, .mx/config.yaml, or package.json[mx]
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-repository
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        project:
          name: mx-hub
          description: "MX standards hub and tooling."
        ---
      required:
        - project.name
        - project.description
      optional:
        - tags
        - type
        - resource
        - project.repository
        - project.documentation
        - context.domain
        - context.purpose
        - context.constraints
        - stack.language
        - stack.runtime
        - stack.version
        - stack.framework
        - conventions.style
        - conventions.testing
        - conventions.documentation
    - name: code-file
      description: File-level metadata. Appears in @mx comment blocks at the top of source files.
      header: |
        ---
        # Carrier: @mx comment block at the top of a source file
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-file
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        owner: platform-team
        ---
      optional:
        - tags
        - type
        - resource
        - reviewers
        - owner
        - ai.contextRequired
        - ai.contextProvides
        - ai.generationNotes
        - ai.reason
    - name: code-function
      description: Function-level metadata. Appears in @mx blocks within JSDoc or docstrings.
      header: |
        ---
        # Carrier: @mx block inside a JSDoc comment or docstring
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-function
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        pure: true
        ---
      optional:
        - tags
        - type
        - resource
        - pure
        - idempotent
        - complexity
        - throws
        - since
        - see
        - ai.reason
        - ai.confidence
        - ai.testCoverage
        - ai.edgeCases
        - ai.refactorNotes
        - ai.doNotModify
    - name: code-class
      description: Class-level metadata. Appears in @mx blocks within class JSDoc or docstrings.
      header: |
        ---
        # Carrier: @mx block inside a class JSDoc comment or docstring
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-class
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        pattern: singleton
        ---
      optional:
        - tags
        - type
        - resource
        - pattern
        - threadSafe
        - invariants
        - ai.contextRequired
        - ai.reason
        - ai.confidence
        - ai.doNotModify
        - ai.sensitive
        - ai.modificationImpact
    - name: code-inline
      description: Inline code annotations. @mx:begin/@mx:end for blocks, @mx:tag for lines.
      header: |
        ---
        # Carrier: inline @mx:begin / @mx:end markers and @mx:tag lines
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-inline
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        mx:begin: sensitive-block
        mx:end: sensitive-block
        ---
      fields:
        - mx:begin
        - mx:end
        - mx:sensitive
        - mx:intentional
        - mx:todo
        - mx:ai
      optional:
        - tags
        - type
        - resource
    - name: code-dependency
      description: Dependency metadata. Extends package.json or pyproject.toml with MX properties.
      header: |
        ---
        # Carrier: mx block in package.json or pyproject.toml
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-dependency
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        dependency:
          purpose: "YAML parsing"
          critical: true
        ---
      optional:
        - tags
        - type
        - resource
        - dependency.purpose
        - dependency.critical
        - dependency.upgradePolicy
        - dependency.alternativesConsidered
        - ai.replacementPermitted
        - ai.upgradePermitted
    - name: code-test
      description: Test file metadata.
      header: |
        ---
        # Carrier: @mx block at the top of a test file
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: code-test
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        testType: unit
        subject: parseFrontmatter
        ---
      required:
        - testType
        - subject
      optional:
        - tags
