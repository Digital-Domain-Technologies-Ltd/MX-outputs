title: MX Field Dictionary — Cog Layer
version: '1.11'
created: 2026-04-27
modified: '2026-10-05'
author: Tom Cranstoun
description: >-
  Cog-specific structural vocabulary. Cogs are an OPTIONAL layer on top of MX,
  not an extension of MX. A document does not need to be a cog to carry MX
  metadata; this file describes the additional fields a cog declares so that
  agents and runtimes can navigate, depend on, and execute it. The MX Cogs
  draft note is the human-readable companion. REGINALD (Digital Domain
  Technologies Ltd's proprietary signer/server) is one consumer of these
  fields; the format itself is open and free for anyone to implement.
category: standard
mx:
  status: active
  license: MIT
  partOf: mx-the-gathering
  tags:
    - fields
    - metadata
    - cogs
    - cog-layer
  audience:
    - machines
    - humans
  contentType: field-dictionary
  runbook: >-
    Companion file to fields-data.yaml. Holds fields that are specific to the
    .cog.md file format and the cog identification mechanism (cogHeader). Do
    not place document-identity fields here — those belong in fields-data.yaml.
    A document that does not declare any of these fields is a perfectly valid
    MX document; it is simply not also a cog.
  fields:
    - name: partOf
      type: array
      authoring: authored
      inPlainWords: 'It is part of {value}.'
      definition: Parent collection(s), suite(s), or initiative(s) the document belongs to.
      example:
        - mx-the-gathering
      notes: >-
        Required for cog files. Names the parent collection(s) or initiative(s).
        An array, so a document can belong to more than one set at once - a cog
        that is both an MX OS action-doc and a member of the audit suite declares
        `partOf: [mx-os, mx-audit]`, and a graph query on either set returns it.
        A bare string (`partOf: mx-os`) remains valid and is read as a
        single-element array; validators normalise it. Useful on non-cog
        documents too (a blog post may declare partOf to anchor itself in a
        series), but conformance is only required for cogs.
      status: canonical
      profile: cog
      description: Larger artefact(s) this document is part of. An array pointing to one or more books, series, collections, suites, or parent artefacts; a bare string is accepted as a single-element array.

    - name: buildsOn
      type: array
      authoring: authored
      inPlainWords: 'It builds on {value}.'
      definition: >-
        Context graph. Array of cog names this document builds upon. Soft
        dependency — provides context, not a hard requirement.
      example:
        - what-is-a-cog
        - cog-unified-spec
      notes: Soft dependency for context. Builds the cog knowledge graph.
      status: canonical
      profile: cog
      description: Documents or standards this one extends or relies upon. Intellectual dependency chain.

    - name: dependencies
      type: array
      authoring: authored
      inPlainWords: 'It depends on {value}.'
      optionalIn: [cog, skill, contact, action]
      definition: >-
        Array of objects describing what this cog depends upon. Each entry is an object with at minimum a `name`
        sub-key; optional sub-keys are `version` (a version constraint such as a SemVer range), `reason` (a
        one-sentence explanation of why the dependency is needed), and `kind` (one of cog | runtime | package |
        external; defaults to `cog`).
      example:
        - name: schema
          kind: cog
          reason: Validator depends on the schema cog's contract.
        - name: node
          kind: runtime
          version: '>=18'
      notes: >-
        The recommended `kind` is `cog`. Runtime, package, and external deps SHOULD usually live in their proper
        carrier (package.json, the cog's runbook, an external manifest); the non-cog kinds in this field are escape
        hatches for cases where inline declaration is genuinely the right home. Every cog MUST declare this field
        explicitly: either as a non-empty array (when relationships exist) or as `[]` (the visible standalone
        marker). Omitting the field is the older form and is being retired so the standalone case is machine-readable
        rather than implicit.
      status: canonical
      profile: cog
      alignsWith:
        - MX Cogs note §6
        - cog-spec v1 §4.3
      description: Structured dependency declaration for a cog. Object array; the `kind` sub-key discriminates between cog, runtime, package, and external. Tier A MUST; declare `[]` for standalone cogs.

    - name: refersTo
      type: array
      authoring: authored
      inPlainWords: 'It refers to {value}.'
      definition: Related cogs or external resources. Informational links, not dependencies.
      example:
        - field-dictionary
        - cog-unified-spec
      notes: Informational links, not dependencies.
      status: canonical
      profile: cog
      description: Related documents cited or cross-referenced. Lateral relationship; aligns with Schema.org isRelatedTo.

    - name: relatedDocs
      type: array
      authoring: authored
      definition: >-
        Prose citations to related documents - a title, a URL, or a free-text description of a source or companion
        reference. Not validated as a resolvable repo-root-relative path or a known cog slug (unlike refersTo).
      example:
        - "MX: The Handbook"
        - https://tg.community
      notes: >-
        Use refersTo when the target is a resolvable cog or repo path; use relatedDocs for a citation that is a
        title, external URL, or prose mention with no repo-path form.
      status: canonical
      profile: cog

    - name: triggers
      type: array
      authoring: authored
      inPlainWords: 'Ask for it with: {value}.'
      definition: >-
        Intent phrases that route a request to this cog. A router (a skill, the maxine dispatcher, the MX graph) matches
        a user's words against these to select the cog without the user knowing its name.
      example:
        - software
        - dependencies
        - what do i need
      notes: Top-level field on routing-capable cogs. Lowercase phrases; the graph indexes them for triggers queries.
      status: canonical
      profile: cog
      description: Intent-routing phrases a dispatcher matches to select this cog. Indexed by the MX graph.

    - name: routes
      type: array
      authoring: authored
      definition: >-
        The routing table for a routing-cog: an array of {intent, destination, description} objects mapping a user
        intent phrase to the destination cog it dispatches to.
      example:
        - intent: "what should I work on"
          destination: what-comes-next
          description: "Route here for session-priority questions."
      notes: Declared on routing-cog type files. The routing-cog template teaches this shape.
      status: canonical
      profile: cog
      description: The intent-to-destination dispatch table for a routing-cog.

    - name: cogHeader
      profile: cog
      description: >-
        Frontmatter equivalent of the cog magic-header line. Carries the spec
        version the document claims plus the URLs where the spec, runtime, and
        runtime documentation live. When both the magic-header line and this
        field are present they MUST agree on values. Validators consume this
        field for queryable conformance data; the magic-header line carries the
        same information as a YAML comment inside the frontmatter for
        consumers that scan raw bytes.
      type: object
      authoring: authored
      optionalIn: [cog, action]
      status: canonical
      alignsWith:
        - cog-spec v1 §2.5
        - MX Cogs note
      example:
        version: v1
        spec: https://mx.allabout.network/drafts/cog-spec.v1.md
        runtime: https://mx.allabout.network/drafts/cog-runtime.md
        runtimeDoc: https://mx.allabout.network/drafts/cog-runtime.md

    - name: targetsSpecVersion
      type: string
      authoring: authored
      optionalIn: [cog, action]
      definition: The cog-spec version a cog (or conformance test, or implementation document) claims to target.
      example: "1.0"
      notes: >-
        Distinct from cogHeader.version, which declares which spec a particular cog file conforms to. targetsSpecVersion is
        used by conformance test suites and reference documentation to declare which spec version they are written against.
      status: canonical
      profile: cog
      alignsWith:
        - cog-spec v1
      description: Spec version declaration for cog-format-related artefacts (tests, reference docs, validators).

    - name: readiness
      type: object
      authoring: authored
      optionalIn: [cog, action]
      definition: >-
        Maturity declaration for a cog or spec document. Object with two arrays: sufficientFor (use cases the document is
        ready to support) and notYetSufficientFor (use cases the document is explicitly not ready for).
      example:
        sufficientFor:
          - independent-implementation
          - alignment-testing
          - community-review
        notYetSufficientFor:
          - certified-conformance
          - production-deployment-without-second-impl
      notes: >-
        Useful on draft specs and emerging cogs to set reader expectations. The arrays carry case identifiers that are
        meaningful in context; the dictionary does not constrain their values.
      status: canonical
      profile: cog
      description: Maturity declaration. Says what the document is ready to be used for and what it is not yet ready for.

    - name: operatesOn
      type: object
      authoring: authored
      optionalIn: [cog, action]
      definition: >-
        Meta-declaration of the artefact a cog operates on. Object with sub-keys including artefactType (e.g. cog,
        document, dataset) and fileExtension (e.g. .cog.md, .md, .yaml).
      example:
        artefactType: cog
        fileExtension: .cog.md
      notes: >-
        Used on action cogs that process other artefacts (e.g. a review-procedure cog that operates on cog files). The
        sub-key shape is conventional, not strictly bound; implementations MAY add further sub-keys.
      status: canonical
      profile: cog
      description: What kind of artefact this cog operates on. Cog-meta information for runners and catalogs.

    - name: troubleshooting
      type: array
      authoring: authored
      optionalIn: [cog, action]
      definition: >-
        Array of condition / remedy entries describing common failure modes for an action cog and the remedy a runtime
        SHOULD invoke.
      example:
        - condition: required-field-missing
          remedy: cogs.remedies.request-supplier-resubmit
        - condition: validator-timeout
          remedy: cogs.remedies.retry-with-backoff
      notes: >-
        Each entry is an object with at least condition (the named failure mode) and remedy (a runtime-resolvable remedy
        identifier or prose). Implementations MAY add further sub-keys (e.g. severity, owner).
      status: canonical
      profile: cog
      description: Failure mode catalog for action cogs. Pairs each named condition with a runtime-resolvable remedy.

    - name: produces
      type: object
      authoring: authored
      optionalIn: [cog, action]
      definition: >-
        Output contract. Declares the typed shape a successful execution of this cog produces, so consumers can validate
        and reason about the output without first running the cog. Sub-keys include shape (pointer to a JSON or YAML
        schema, or a named profile), format (MIME type or named format identifier), and example (an illustrative output).
      example:
        shape: ./schemas/audit-report.v1.yaml
        format: application/json
        example:
          summary: 12 issues, 3 critical
          issues: []
      notes: >-
        Distinct from deliverable (semantic description of what the cog yields) and from the document-level schema field
        (input contract for the document itself). A cog with no execute block or procedure-declaring field SHOULD NOT
        declare produces. Runtimes MAY validate the produced output against produces.shape after execution; a shape
        mismatch is treated as an unmodelled failure and triggers defaultRemedy if declared.
      status: canonical
      profile: cog
      alignsWith:
        - MX Cogs note §6.7.1
      description: Output contract for an action cog. Names the typed shape of a successful execution result.

    - name: defaultRemedy
      type: string
      authoring: authored
      optionalIn: [cog, action]
      definition: >-
        Catch-all remedy. Names the runtime-resolvable remedy a runtime SHOULD invoke when a failure arises that does
        not match any entry in troubleshooting. Resolves through the same registry used for troubleshooting[].remedy
        and obeys the same dotted-name syntax (lowercase, two or more dot-separated segments).
      example: cogs.remedies.halt-and-escalate
      notes: >-
        Pairs with troubleshooting: troubleshooting catalogs named conditions, defaultRemedy catches everything
        else. A cog declaring defaultRemedy without troubleshooting is valid but unusual; it asserts a single fallback
        for every failure mode. Combines naturally with produces: an output that fails to match produces.shape is
        treated as an unmodelled failure and defaultRemedy applies.
      status: canonical
      profile: cog
      alignsWith:
        - MX Cogs note §6.7.2
      description: Catch-all remedy for unmodelled failure conditions. Pairs with troubleshooting.

    - name: actionType
      type: string
      authoring: derived
      derivation: actionPayloads
      inPlainWords: 'Its actions are {value}.'
      requiredIn: [action]
      optionalIn: [cog]
      definition: >-
        Discriminator for action-doc cogs that names the cognitive class of the action — whether the cog is
        deterministically scripted, an LLM-mediated SOP, or a hybrid. Derived from the payloadType each execute
        action declares: every action instructions is sop, no action instructions is scripted, a mix is hybrid.
      example: scripted
      validValues:
        - scripted
        - sop
        - hybrid
      notes: >-
        Pairs with contentType. Required iff contentType is action-doc; MUST NOT appear on info-doc, routing-doc,
        or cogs (community-owned governance standard, governed by https://tg.community)
        cogs. The three values are: scripted (cog body carries a fenced
        @embedded:<id> block; mx-exec extracts and runs it), sop (cog body has no @embedded block; the
        execute.actions[].usage prose is descriptive, intended for an LLM via a skill to read and perform), and
        hybrid (cog body carries both an @embedded script and descriptive usage prose). The validator gates each
        combination — scripted-no-embedded, sop-no-usage-prose, and hybrid-needs-both are all errors.
      status: canonical
      profile: cog
      alignsWith:
        - MX Cogs note §6.7.3
      description: Action-cog discriminator, derived from execute.actions[].payloadType as scripted, sop, or hybrid.

    - name: execute.actions[].payloadType
      type: string
      authoring: authored
      definition: >-
        What one execute action carries for a reader to run: script (an embedded or referenced script a runtime
        executes), instructions (usage prose an LLM reads and performs), skill (a skill installed into an agent
        host, loaded when its triggers match), or mod (code installed into an agent host that hooks its session
        events and can observe, rewrite or answer them).
      example: script
      validValues:
        - script
        - instructions
        - skill
        - mod
      notes: >-
        Declared per action, so one cog can hold a script action and a skill-install action. The cog-level
        actionType is derived from this set (rule actionPayloads). A script or instructions payload runs once and
        ends; a skill or mod payload stays in the host and changes what later sessions do, so the security a reader
        weighs for an install is that of what the payload can do once installed. check-action-payload.cjs holds
        every action of an action-doc to this vocabulary.
      status: canonical
      profile: cog
      description: What one execute action carries - script, instructions, skill, or mod.

    - name: execute.actions[].payloadRef
      type: string
      authoring: authored
      definition: >-
        Where a payload that is not embedded in the cog lives: a repository path (a skill folder, a plugin package,
        a script file) or a URL. A skill or mod payload names one.
      example: .claude/skills/step-catch-up
      status: canonical
      profile: cog
      description: Where an action's payload lives when it is not embedded.

    - name: execute.actions[].payloadDigest
      type: string
      authoring: authored
      definition: >-
        The digest of exactly the payload that was reviewed, as sha256-<base64> (the Subresource Integrity form).
        For a file it is the SHA-256 of its bytes; for a folder, of each file's repository-relative path and bytes
        in path order. check-action-payload.cjs recomputes it for a local payloadRef and refuses a mismatch, so a
        payload changed after review cannot be installed under the old declaration.
      example: sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=
      status: canonical
      profile: cog
      description: The SHA-256 digest of the payload as reviewed.

    - name: execute.actions[].security
      type: object
      authoring: authored
      definition: >-
        A partial security block for one execute action, overriding the cog-level block for that action alone. It
        takes the members of the open security block (riskLevel, reversibility, verifiability, guardrail and the
        rest). The cog-level block is the ceiling: the cog's riskLevel is at least every action's.
      example:
        riskLevel: high
        reversibility: irreversible
        guardrail: human-approval
      notes: >-
        Lets a cog whose actions differ in danger say so: a read-only listing beside a destructive reset, or a
        script action beside a mod-install action. A reader applies the action's block where it is declared and the
        cog's block elsewhere.
      status: canonical
      profile: cog
      description: Per-action security override; the cog-level block is the ceiling.

    - name: execute.route
      type: string
      authoring: authored
      definition: >-
        Execution route for scripted and hybrid action-doc cogs. Declares where the extracted script block is
        sent at runtime: bash runs the block directly as a subprocess (default, existing behaviour); ollama
        sends the block content as a system prompt to the local Ollama model via the shared llm-queue
        serialisation (at most one call in flight at any moment); agent POSTs the block to the JS agent
        endpoint declared in MX_AGENT_ENDPOINT env.
      example: ollama
      validValues:
        - bash
        - ollama
        - agent
      notes: >-
        Optional field on the execute action block (the open name; the vendor spelling x-mx-execute is
        deprecated, ADR 70). Defaults to bash when absent. Applies as the default route for
        all blocks in the cog; individual blocks may override with execute.actions[].route.
        The Ollama serialisation queue (scripts/lib/llm-queue.cjs) ensures calls do not race. The agent
        stub no-ops when MX_AGENT_ENDPOINT is unset. Cogs using non-bash routes conventionally carry the
        .sh.cog.md infix in their filename as a human-readable signal.
      status: canonical
      profile: cog
      alignsWith:
        - MX Cogs note §6.7.3
      description: Execution route for scripted cog blocks. bash (default), ollama, or agent.

  profiles:
    # `cog` profile intentionally not declared here. scripts/cog-field-rules.js
    # (the engine behind frontmatter-validator.js / cog-tools.js) reads ONLY
    # fields-data.yaml directly for profiles - it never merges this file's
    # `profiles:` block - so fields-data.yaml's `cog` profile entry is the sole
    # authoritative source of required/recommended cog fields. This file's
    # `fields:` array above remains the field-DEFINITION home for cog-layer
    # fields (partOf, buildsOn, dependencies, refersTo, cogHeader); the
    # requirement grouping lives with the engine that reads it.
