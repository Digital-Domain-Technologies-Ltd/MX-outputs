      type: string
      definition: 'Cog category for registry grouping (CogNovaMX taxonomy). Controlled vocabulary; see validValues. Synonym and variant spellings are normalised to one canonical value (for example mx-tools to mx-tool, contact to mx-contact, adr to decision-record).'
      example: mx-core
      validValues:
        - architecture
        - audit-suite
        - brand
        - business
        - cockpit
        - collaborate
        - contributor-profile
        - convention
        - crm
        - crm-material
