      status: canonical
      profile: x-mx-public
      context: 'Declared on a blog post source in datalake/draft-site/blog.'
    - name: x-mx-schemaType
      type: string
      inPlainWords: 'Its structured data calls it a {value}.'
      authoring: authored
      definition: >-
        The Schema.org type a page's JSON-LD declares, where it differs from the default the site.json profile table
        gives the page's type.
      example: AboutPage
      notes: >-
        Absent on most pages: the profile table maps each page type to a Schema.org type, and this field overrides one
        page (an about page as AboutPage, a question page as FAQPage). A Schema.org type name, never the free-form
        contentType label.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a draft-site page source whose JSON-LD type is not its type''s default.'
    - name: x-mx-domainTerms
      type: array
      authoring: authored
      definition: >-
        The document's central vocabulary: terms of art the prose-quality tooling exempts from distinctive-word-overuse
        detection. Each entry is a single content word, matched case-insensitively.
      example:
        - cog
        - attestation
        - provenance
      notes: >-
        A paper on cogs that repeats "cog" forty times is honest writing, not algorithmic drift, and this field is how a
        document says so. Read by the frequency-analysis scanners under scripts/lib/prose/.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a document whose subject forces heavy repetition of a few domain words.'
    - name: x-mx-runtimeProbe
      type: object
      authoring: authored
      definition: >-
        The environment signals that identify each known runtime, so an agent rules cog can recognise its host without
        naming a tool.
      example:
        claude-code:
          env: CLAUDE_PROJECT_DIR
      notes: >-
        The portability requirement is the whole point: any capable agent reading the block identifies itself, and the
        file never assumes which tool will arrive. A human authors the block, because the intent it states is not
        recoverable by inference.
      status: canonical
      profile: x-mx-public
      context: 'Declared on an agent rules cog that must serve more than one runtime.'
    - name: x-mx-priority
      type: string
      authoring: authored
      definition: 'Vendor workflow priority. Allowed values: high, medium, low.'
      example: high
      notes: >-
        A CogNovaMX workflow enum governed by CogNovaMX, not The Gathering. The bare `priority` name is a deprecated
        synonym.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a work item ranked within a CogNovaMX workflow.'
    - name: x-mx-prdState
      type: string
      authoring: authored
      definition: 'PRD delivery state. Allowed values: draft, inProgress, complete, superseded.'
      example: inProgress
      notes: >-
        Tracks a product requirements document through delivery. Distinct from status, which is the document lifecycle,
        and from x-mx-contentState, which routes blog publication.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a PRD whose delivery progress is tracked separately from its document status.'
    - name: x-mx-kanban
      type: object
      authoring: authored
      definition: >-
        A card's place on the chain kanban: rank, a whole number where 1 is the top of its column, and assignee,
        either operator or agent. The column itself is mx.status.
      example:
        rank: 1
        assignee: agent
      notes: >-
        Declared on every intent, spec, plan and unit card under mx-canon/mx-maxine-lives/management/intents/. Read and
        written only through scripts/lib/chain.cjs, which holds rank unique within a column; checked by
        scripts/check-chain.cjs. Acceptance is recorded in the core reviewedBy and statusNote fields, not here.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a chain card so the board and agents share one order of work.'
    - name: x-mx-thresholds
      type: object
      authoring: authored
      definition: The numeric limits a workflow contract enforces before an action may proceed.
      example:
        maxChangedFiles: 50
      notes: >-
        One of the Workflow Contract Extensions the MX Extensions note governs. Zone 1 top-level on workflow contract
        cogs.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a workflow contract cog that gates an action on measured limits.'
    - name: x-mx-approvers
      type: array
      authoring: authored
      definition: The roles or identities whose approval a workflow contract requires.
      example:
        - role:hic-admin
      notes: 'A Workflow Contract Extension. Names roles rather than people wherever a role exists, so the contract survives a change of staff.'
      status: canonical
      profile: x-mx-public
      context: 'Declared on a workflow contract cog whose action needs human sign-off.'
    - name: x-mx-approvalProcedure
      type: string
      authoring: authored
      definition: How approval is sought and recorded for this workflow contract.
      example: 'Operator confirms in chat; the approving message is quoted in the commit.'
      notes: 'A Workflow Contract Extension. States the mechanism, so an approval cannot be claimed without a record of it.'
      status: canonical
      profile: x-mx-public
      context: 'Declared alongside x-mx-approvers on a workflow contract cog.'
    - name: x-mx-reviewProcedure
      type: string
      authoring: authored
      definition: How the output of this workflow contract is reviewed after the action completes.
      example: 'Re-run the gate suite and read the served page before closing.'
      notes: 'A Workflow Contract Extension. The counterpart to x-mx-approvalProcedure: one governs going, this one governs having gone.'
      status: canonical
      profile: x-mx-public
      context: 'Declared on a workflow contract cog whose result needs checking rather than assuming.'
    - name: x-mx-targetEnvironment
      type: string
      authoring: authored
      definition: The environment a workflow contract's action applies to.
      example: production
      notes: 'A Workflow Contract Extension. Makes the blast radius explicit, so a contract written for staging cannot be read as covering production.'
      status: canonical
      profile: x-mx-public
      context: 'Declared on a workflow contract cog whose action reaches a named environment.'
    - name: x-mx-probeVersions
      type: string
      authoring: authored
      inPlainWords: 'It was measured with these probe versions: {value}.'
      definition: >-
        The version of each cached origin probe the audit ran, as comma-separated name=version pairs sorted by probe
        name.
      example: 'agent-nav.json=1,platform.json=4,wellknown.json=10'
      notes: >-
        Read from the audit pipeline's probe cache versions. A probe's detection logic can change without a pipeline
        version bump, so a cross-run comparison credits a score movement to the site only when both runs record the
        same probe versions.
      status: canonical
      profile:
        - audit
        - report
    - name: x-mx-pageSetSha256
      type: string
      authoring: authored
      inPlainWords: 'The audited page set hashes to {value}.'
      definition: >-
        SHA-256 of the de-duplicated, sorted list of URLs the audit examined, joined one per line, as 64 lowercase
        hex characters.
      example: '0b9f1e7217be6fca16bb151653143116cc06a270e3244b2bda582db9d98f4092'
      notes: >-
        Two runs can examine the same number of pages and still examine different pages, so a cross-run comparison
        reports a changed page set rather than crediting a score movement to the site.
      status: canonical
      profile:
        - audit
        - report
    - name: x-mx-lastUpdated
      type: string
      authoring: authored
      inPlainWords: 'Its content last changed on {value}.'
      definition: >-
        Last substantive update timestamp (ISO 8601 date). Companion to `modified` — `modified` reflects file mtime,
        `lastUpdated` reflects when the content materially changed.
      example: '2026-04-15'
      status: canonical
      profile:
        - any
  profiles:
    # book/blog/contact/report/audit/event profiles intentionally not declared
    # here. fields-data.yaml carries the evidence-grounded versions.
    # scripts/cog-field-rules.js (the engine behind frontmatter-validator.js /
    # cog-tools.js) reads ONLY fields-data.yaml directly for profiles - it does
    # not merge this file's `profiles:` block at all - so fields-data.yaml is
    # the sole load-bearing source; a same-named profile here would only
    # mislead a reader, never actually apply.
    - name: js
      description: 'Fields for .cog.js files. Convention: @mx:field in JSDoc blocks.'
      header: |
        ---
        # Carrier: .cog.js file; native form is @mx:field in the JSDoc block
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: cog-js
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        mx:name: mx-badge
        mx:version: "1.0"
        mx:purpose: "Render the MX Compatible badge."
        ---
      required:
        - mx:name
      recommended:
        - mx:version
        - mx:purpose
      optional:
        - tags
        - type
        - resource
        - mx:audience
        - mx:stability
        - mx:category
        - mx:tags
        - mx:buildsOn
        - mx:documentedIn
        - mx:contextProvides
    - name: css
      description: 'Fields for .cog.css files. Convention: @mx:field in comment blocks.'
      header: |
        ---
        # Carrier: .cog.css file; native form is @mx:field in the leading comment block
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: cog-css
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Carrier fields (native comment or manifest form maps key for key) ---
        mx:name: mx-badge
        mx:version: "1.0"
        mx:purpose: "Render the MX Compatible badge."
        ---
      required:
        - mx:name
      recommended:
        - mx:version
        - mx:purpose
      optional:
        - tags
        - type
        - resource
        - mx:audience
        - mx:stability
        - mx:category
        - mx:tags
    - name: pitch
      description: >-
        Fields for pitch decks, proposals, and investor materials authored as markdown. A CogNovaMX vendor profile,
        not part of the open standard; the fields describe the pitch document itself (its type, audience, ask, and
        the figures it states), never the business it pitches.
      header: |
        ---
        # Carrier: pitch deck or proposal source, markdown frontmatter
        # --- Zone 1a: Identity ---
        title: "CogNovaMX seed round"
        description: "Investor pitch for the REGINALD registry and the MX practice."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: pitch
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          x-mx-pitchType: investor
          x-mx-presentationFor: "Seed-stage investors"
          x-mx-pitchAsk: "Lead a seed round"
        ---
      required:
        - x-mx-pitchType
      recommended:
        - x-mx-presentationFor
        - x-mx-pitchAsk
      optional:
        - tags
        - type
        - resource
        - x-mx-valuation
        - x-mx-marketSize
        - x-mx-arrProjection
    - name: x-mx-public
      description: 'MX-public extension fields. Prefix: x-mx-. Visible in a cog''s source; stripped from every published artefact per ADR 63. CogNovaMX vendor extensions.'
      header: |
        ---
        # Carrier: x-mx- fields sit inside the mx: block of any document
        # --- Zone 1a: Identity ---
        title: "Hub mount table"
        description: "How the hub mounts each submodule and what may be swapped."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: info-doc
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          x-mx-mountType: standard
          x-mx-mountSwappable: fork
          x-mx-mountUpstream: "The Gathering open standard"
        ---
      fields:
        - x-mx-mountType
        - x-mx-mountSwappable
        - x-mx-mountUpstream
        - x-mx-frictionLog
        - x-mx-resolver
        - x-mx-metaTitle
        - x-mx-metaDescription
        - x-mx-templateType
        - x-mx-phase
        - x-mx-ctaUrl
        - x-mx-wordCountApprox
        - x-mx-productionUrl
        - x-mx-sourceFile
        - x-mx-contentState
        - x-mx-adr
        - x-mx-ndr
        - x-mx-bdr
        - x-mx-reviewedOn
        - x-mx-managedBy
        - x-mx-productionCanonical
        - x-mx-domainTerms
        - x-mx-runtimeProbe
        - x-mx-priority
        - x-mx-prdState
        - x-mx-thresholds
        - x-mx-approvers
        - x-mx-approvalProcedure
        - x-mx-reviewProcedure
        - x-mx-targetEnvironment
      optional:
        - tags
        - type
        - resource
    - name: x-mx-private
      description: 'MX-private extension fields. Obfuscated. Prefix: x-mx-p-. Field names are not listed publicly.'
      header: |
        ---
        # Carrier: x-mx-p- fields sit inside the mx: block; values are tokenised
        # --- Zone 1a: Identity ---
        title: "Pipeline stage record"
        description: "Operational record with obfuscated private fields."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: info-doc
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          x-mx-p-stage: "tok_9f3a1c"
        ---
      fields: []
      optional:
        - tags
        - type
        - resource
