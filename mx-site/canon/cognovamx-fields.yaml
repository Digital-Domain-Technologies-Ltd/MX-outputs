title: CogNovaMX Field Extensions
version: '2.4'
created: '2026-04-15'
modified: '2026-10-19'
author: Tom Cranstoun
description: >-
  CogNovaMX vendor extensions to the MX open standard, published as a reference pack for other vendors authoring their
  own x-vendor- extensions. This dictionary documents the vocabulary; documents never carry it into publication, because
  the vendor layer is stripped from every published artefact. Per the namespace policy, the prefix is the policy: no
  additional visibility markers needed.
category: vendor-extensions
mx:
  status: active
  license: proprietary
  partOf: mx-cognovamx
  tags:
    - fields
    - metadata
    - extensions
    - cognovamx
    - vendor
  audience:
    - machines
    - humans
  contentType: field-dictionary
  runbook: >-
    CogNovaMX-owned field extensions. This dictionary is published so another vendor can see how an extension pack is
    built; the fields it documents are internal, and stripInternalFields removes them from every published artefact
    (ADR 63, enforced by Gate 107). So a name here is a vocabulary entry, never a licence to publish the field on a
    page. Private extensions (x-mx-p-) are operational and their values may be obfuscated. Do not move entries between
    tiers without ADR approval.
  vendor: CogNovaMX
  namespace:
    - x-mx-
    - x-mx-p-
  fields:
    - name: x-mx-mountType
      type: string
      inPlainWords: 'It is a {value} mount.'
      authoring: authored
      definition: 'Mount type for submodule repositories. Values: personal, team, product, standard.'
      example: personal
      validValues:
        - personal
        - team
        - product
        - standard
      notes: Categorises submodules in the hub mount table.
      status: canonical
      profile: x-mx-public
      context: Used in .mx.yaml.md folder metadata for git submodules to categorise them in the hub mount table.
    - name: x-mx-componentKind
      type: string
      authoring: authored
      definition: 'The MX Component Standard kind an Intent CMS chunk renders, mirrored from the chunk registry into the chunk directory descriptor.'
      example: component:objectCard
      validValues:
        - component:provenanceBadge
        - component:objectCard
        - component:relationshipLine
        - component:verificationPanel
        - component:narrativeLayer
        - component:gridMount
        - component:signalBar
        - component:objectInspector
      notes: >-
        A library fact about the chunk directory, so it stays in the vendor tier and never reaches a published page.
        The component family the rendered chunk carries to a reader (displayMode, actions, cue and siblings) is core MX,
        never this field. The registry (intent-cms/lib/chunks/registry.cjs) is the authority; the descriptor mirrors it.
      status: canonical
      profile: x-mx-public
      context: Used in intent-cms/chunks/<name>/.mx.yaml.md folder metadata.
    - name: x-mx-mountSwappable
      type: string-or-boolean
      inPlainWords: 'Whether the mount can be swapped: {value}.'
      authoring: authored
      definition: 'Whether this mount can be swapped for a different repository. Values: true, false, fork.'
      example: true
      validValues:
        - true
        - false
        - fork
      notes: Personal = swappable, product = not, standard = forkable.
      status: canonical
      profile: x-mx-public
      context: >-
        Personal mounts are swappable (each business mounts their own). Product mounts are not. Standard mounts are
        forkable.
    - name: x-mx-mountUpstream
      type: string
      inPlainWords: 'Its upstream source is {value}.'
      authoring: authored
      definition: Upstream source for standard-type mounts. URL or description of where to pull updates from.
      example: https://github.com/Digital-Domain-Technologies-Ltd/MX-Gathering
      notes: Only for standard mount type.
      status: canonical
      profile: x-mx-public
      context: Only used for standard mount type. Points to The Gathering open standard or equivalent upstream.
    - name: x-mx-generatedBy
      type: string
      authoring: authored
      definition: >-
        Identifier of the generator when isGenerated is true or provenanceOrigin is ai-generated. For scripts: a relative path or script
        name (e.g. 'scripts/generate-index.sh'). For AI agents: a model or agent identifier (e.g. 'claude-opus-4-6',
        'claude-code'). Free text — tooling treats the value as an opaque label for now.
      example: scripts/generate-index.sh
      notes: Optional companion to isGenerated and provenanceOrigin. Empty or absent when the content is human-authored.
      status: canonical
      profile:
        - folder
        - cog
        - any
    - name: x-mx-contentFilename
      type: string
      authoring: authored
      definition: >-
        Canonical filename of the content artefact, distinct from the path the document is stored at. Used by content
        cogs that may move.
      example: content.md
      status: canonical
      profile:
        - cog
        - any
    - name: x-mx-theme
      type: string
      authoring: authored
      inPlainWords: 'Its page theme is {value}.'
      definition: The Intent CMS page theme a page source renders with. Picks visual styling at render time.
      example: mx-site
      status: canonical
      profile:
        - any
    - name: x-mx-deckTheme
      type: object
      authoring: authored
      inPlainWords: 'Its slides use the {value} colour scheme.'
      definition: >-
        The colour scheme a slide-deck source renders with: a named theme and its background, header, text and
        highlight colours. Read by .claude/skills/create-slides/generate-pptx.mjs.
      example: '{name: business, background: "#1C1C1C", header: "#0046B5", text: "#FFFFFF", highlight: "#FF3300"}'
      notes: >-
        A different item from x-mx-theme (a page theme name). Kept at the top level of a deck source, last in the
        frontmatter, because the deck generator's reader is line-based.
      status: canonical
      profile: x-mx-public
    - name: slides
      type: array
      authoring: authored
      definition: Ordered list of slide titles or paths in a presentation document.
      example:
        - intro
        - field-catalogue
        - drift-prevention
        - next-steps
      status: canonical
      profile:
        - any
    - name: x-mx-agentAction
      type: string
      authoring: authored
      definition: Single-sentence instruction for an AI agent reading this document. What the agent should do or check.
      example: Sync mx-reginald registry before publishing.
      notes: Distinct from runbook (which is for humans + agents). Agent-only directive.
      status: canonical
      profile:
        - cog
        - any
    - name: whenToRead
      type: string
      authoring: authored
      definition: >-
        Short prose hint telling the reader (human or agent) the situation in which this document is the right one to
        consult.
      example: Read at session start, before touching any .cog.md file.
      status: canonical
      profile:
        - cog
        - any
    - name: x-mx-clientUrl
      type: string
      authoring: authored
      definition: URL of the client property being audited or reported on.
      example: https://example.com
      status: canonical
      profile:
        - audit
        - contact
        - any
    - name: x-mx-clientSlug
      type: string
      authoring: authored
      definition: Short identifier for the client (kebab-case slug used in file paths and report IDs).
      example: arrivefirst
      status: canonical
      profile:
        - audit
        - contact
        - any
    - name: x-mx-auditTool
      type: string
      authoring: authored
      definition: Name of the tool that produced the audit report.
      example: mx-audit
      status: canonical
      profile: audit
    - name: x-mx-auditDate
      type: string
      authoring: authored
      definition: Date of the audit run (ISO 8601 date).
      example: '2026-04-15'
      status: canonical
      profile: audit
    - name: x-mx-accessibilityScore
      type: number
      authoring: authored
      definition: Pa11y or equivalent accessibility score (0-100).
      example: 92
      status: canonical
      profile: audit
    - name: totalIssues
      type: number
      authoring: authored
      definition: Total count of issues found in an audit report.
      example: 47
      status: canonical
      profile: audit
    - name: x-mx-nextAction
      type: string
      authoring: authored
      definition: Next concrete action this contact / opportunity / report needs.
      example: Schedule follow-up call after their MX audit lands.
      notes: Free-form text describing the next step. Pairs with nextActionDate, which carries the deadline.
      status: canonical
      profile:
        - contact
        - audit
        - any
    - name: registry
      type: string
      authoring: authored
      definition: Registry identifier this document belongs to (e.g. mx-reginald, content-registry).
      example: mx-reginald
      status: canonical
      profile:
        - cog
        - any
    - name: signature
      type: string
      authoring: authored
      definition: Cryptographic signature attesting the cog's authorship and integrity.
      example: ed25519:0xabc123...
      status: canonical
      profile: cog
    - name: x-mx-provenance
      type: object-or-string
      authoring: authored
      definition: >-
        Origin and lineage block. May be the string of a single provenance source, or an object with origin,
        derivedFrom, method, and date fields. See Appendix M for the provenance block fields.
      example:
        origin: https://example.com/source
        method: Imported
      status: canonical
      profile:
        - cog
        - any
    - name: definition
      type: string
      authoring: authored
      definition: >-
        Concise definition of the term or concept this document is about. Used in glossary entries and concept
        documents.
      example: A self-contained unit of MX content with metadata, prose, and optional executable blocks.
      status: canonical
      profile:
        - cog
        - any
    - name: affects
      type: array
      authoring: authored
      definition: List of file paths, modules, or systems this change or document affects.
      example:
        - scripts/mx-audit.js
        - mx-canon/ssot/fields-data.yaml
      status: canonical
      profile:
        - cog
        - any
    - name: action
      type: string
      authoring: authored
      definition: >-
        Single-line description of the action this document performs or recommends. Companion to agentAction (for AI)
        and runbook (for humans + AI).
      example: Regenerate the registry.
      status: canonical
      profile:
        - cog
        - any
    - name: note
      type: string
      authoring: authored
      definition: Free-text note attached to the document. Used for short editorial annotations.
      example: Scheduled for review next week.
      status: canonical
      profile:
        - any
    - name: x-mx-thread
      type: string
      authoring: authored
      definition: Conversation or message thread identifier (e.g. Slack thread URL, email subject).
      example: slack://team/C123/p456
      status: canonical
      profile:
        - contact
        - any
    - name: x-mx-recipient
      type: string-or-array
      authoring: authored
      definition: Target audience or addressee of a message, report, or proposal.
      example: Tom Cranstoun
      status: canonical
      profile:
        - contact
        - any
    - name: recordedFrom
      type: string
      authoring: authored
      definition: Who this meeting-note or call-recap account was recorded from, and the context of the recording.
      example: "Tom Cranstoun (meeting recap, 2026-07-14 call)"
      notes: Free-text attribution + recording context. Distinct from source (input files a document was derived from).
      status: canonical
      profile: contact
    - name: contentScope
      type: string
      authoring: authored
      definition: Prose statement of what this document covers and, where useful, what it deliberately does not cover.
      example: "Covers the design specification and PRD; does not cover the implementation timeline."
      status: canonical
      profile: cog
    - name: x-mx-finishing
      type: object
      authoring: authored
      definition: >-
        The finisher contract on a transfer-manifest cog (ADR: export-batch finishing block) - what may publish
        (items), the inventory proving the batch is intact, and the trust anchor.
      notes: >-
        Consumed by scripts/lib/export-to-medium.cjs (mx.x-mx-finishing.inventory). Generated by the export-batch
        pipeline; hand-editing is not the normal path. A medium exported earlier carries the bare finishing key,
        which the reader still accepts.
      status: canonical
      profile: cog
    - name: members
      type: array
      authoring: authored
      definition: The member filenames this folder-metadata (.mx.yaml.md) record indexes.
      example:
        - web-audit-management-summary-template.md
        - web-audit-technical-report-template.md
      status: canonical
      profile: folder
    - name: x-mx-sentAt
      type: string
      authoring: authored
      definition: The date a message was actually sent, distinct from created (when it was authored/drafted).
      example: '2026-05-27'
      status: canonical
      profile: contact
    - name: hold
      type: boolean
      authoring: authored
      definition: Whether outreach to this contact is currently paused.
      example: false
      notes: Pairs with holdReason.
      status: canonical
      profile: contact
    - name: holdReason
      type: string
      authoring: authored
      definition: Why outreach to this contact is on hold, when hold is true.
      example: "Awaiting a scheduling window from their side."
      status: canonical
      profile: contact
    - name: x-mx-channel
      type: string
      authoring: authored
      definition: The communication channel used for this outreach record.
      example: email
      status: canonical
      profile: contact
    - name: x-mx-wordCount
      type: number
      authoring: derived
      derivation: bodyWordCount
      inPlainWords: 'Its body runs to {value} words.'
      optionalIn: [book]
      definition: Word count of the document content.
      example: 3500
      notes: >-
        Used for publication planning and progress tracking. The bare name is a deprecated synonym; a vendor entry
        carries its prefix in the dictionary as in the document. x-mx-wordCountApprox is the page programme's
        estimate before a draft exists, a different signal.
      status: canonical
      profile: book
    - name: x-mx-createdHash
      type: string
      authoring: derived
      derivation: gitCreation
      inPlainWords: 'It was created in the commit that begins {value}.'
      optionalIn: [book, contact, report, audit]
      definition: >-
        The first eight characters of the commit that first added this file, shared by every file added in that commit,
        so the files created together can be found together.
      example: 734140ed
      notes: >-
        Written by scripts/fix-co-creation-cohorts.cjs from the repository history, never by hand. A copied value
        names the wrong cohort; leave the field absent and let the fixer assign it.
      status: canonical
      profile: x-mx-public
    - name: x-mx-neededFor
      type: array
      authoring: authored
      inPlainWords: 'It is needed for {value}.'
      optionalIn: [blog]
      definition: The miniMax tasks this object is needed for, each a task id in mx-canon/ssot/registries/minimax-tasks.json.
      example: [publish]
      notes: Gate 54 (scripts/check-needed-for.cjs) refuses a value that is not a task in the registry.
      status: canonical
      profile: any
    - name: x-mx-scope
      type: string
      authoring: authored
      inPlainWords: 'It covers {value}.'
      definition: The subject a cog or its sidecar covers, as a short slug the registry lists it under.
      example: who-maxine-is
      notes: >-
        Distinct from the action-cog runtime scope object, which constrains what an executing cog may touch; this is a
        subject label for a registry listing.
      status: canonical
      profile: any
    - name: x-mx-voice
      type: string
      authoring: authored
      inPlainWords: 'It is written in {value}.'
      definition: Who speaks in a document and where, when it has more than one narrative voice.
      example: dual - the author introduces, the partner speaks in designated sections
      status: canonical
      profile: any
    - name: x-mx-disclosureLevel
      type: string
      authoring: authored
      inPlainWords: 'It discloses {value}.'
      definition: How much of the underlying system a document reveals, in the author's words.
      example: philosophy and outcomes only, no implementation details
      notes: >-
        An editorial boundary for a published document, not a personal-cog disclosureTier: it constrains what the
        author writes, not what a reader app may share.
      status: canonical
      profile: any
    - name: x-mx-regeneration
      type: object
      authoring: authored
      inPlainWords: 'It is regenerated from {value}.'
      definition: The prompt and source documents that regenerate a document, so the next writer can rebuild it.
      example:
        prompt: Regenerate the identity cog from the source documents.
        sources:
          - SOUL.md
      notes: The prompt is an instruction to the next machine; the sources are paths it must read first.
      status: canonical
      profile: any
    - name: x-mx-clientId
      type: string
      authoring: authored
      inPlainWords: 'It belongs to the client {value}.'
      definition: The lowercase, hyphenated identifier of the publisher a registry directory holds cogs for.
      example: mx-reginald
      status: canonical
      profile: folder
    - name: x-mx-block
      type: object
      authoring: authored
      inPlainWords: 'It describes the block {value}.'
      definition: >-
        The content model of an Edge Delivery Services block: its version and the rows and columns an author fills in.
      example:
        version: '1.0'
        contentModel:
          rows:
            - purpose: Site logo and home link
      status: canonical
      profile: cog
    - name: x-mx-contactKind
      type: string
      authoring: authored
      inPlainWords: 'This contact is a {value}.'
      optionalIn: [contact]
      definition: A CRM contact's primary business relationship, declared on the contact's primary cog.
      example: peer
      notes: >-
        camelCase values (NDR-02). Values in use include peer, prospect, businessSponsor, contact, advisor,
        coDirector, contractor, editor, principalPartner and self. Operator status is not a kind: it is membership of
        the operator registry. Seeded by scripts/backfill-contact-kind.cjs.
      status: canonical
      profile: contact
    - name: x-mx-pdfDoctype
      type: string
      authoring: authored
      inPlainWords: 'It renders as a {value} PDF.'
      optionalIn: [contact]
      definition: The doctype the unified PDF pipeline renders this file as, which selects its template.
      example: letter
      validValues:
        - letter
        - report
        - blog-post
        - agreement
        - info-doc
        - chapter
        - book
        - free-book
        - briefing-2col
        - document
      notes: Read by scripts/lib/pdf/read-frontmatter.cjs for scripts/bin/mx.pdf.sh; templates under scripts/templates/pdf/.
      status: canonical
      profile: any
    - name: blogState
      type: string
      authoring: authored
      definition: 'Blog lifecycle state. Values: draft, review, published.'
      example: published
      validValues:
        - draft
        - review
        - published
      notes: Blog-specific lifecycle. Distinct from status (generic).
      status: canonical
      profile: blog
    - name: relationship
      type: string
      authoring: authored
      definition: Relationship type.
      example: advisory-board
      validValues:
        - advisory-board
        - investor
        - partner
        - prospect
        - team
        - advisor
        - mentor
        - family
        - collaborator
        - client
        - contact
        - professional
        - business-partner
        - peer
        - personal-friend
        - professional-friend
        - personal-acquaintance
      status: canonical
      profile: contact
    - name: x-mx-email
      type: string
      authoring: authored
      definition: Contact email address.
      example: info@cognovamx.com
      status: canonical
      profile: contact
    - name: x-mx-lastContact
      type: string
      authoring: authored
      definition: Date of last contact. ISO 8601 format (YYYY-MM-DD).
      example: 2026-02-28T00:00:00.000Z
      notes: ISO 8601. Updated after each interaction.
      status: canonical
      profile: contact
    - name: x-mx-dealStage
      type: string
      authoring: authored
      definition: This contact's current position in the sales/relationship pipeline.
      example: warm
      notes: 'Free-form values in practice: committed, warm, pending. Pairs with nextAction and nextActionDate.'
      status: canonical
      profile: contact
    - name: x-mx-offering
      type: string
      authoring: authored
      definition: The product or service offering under discussion with this contact.
      example: audit
      notes: Free-form; names the specific CogNovaMX/Gathering offering, not a general classification.
      status: canonical
      profile: contact
    - name: x-mx-nextActionDate
      type: string
      authoring: authored
      definition: The date the next action (declared in nextAction) is due. ISO 8601 (YYYY-MM-DD).
      example: '2026-07-14'
      notes: Pairs with the free-text nextAction field; this is the deadline, nextAction is the description.
      status: canonical
      profile: contact
    - name: x-mx-location
      type: string
      authoring: authored
      definition: Physical location, city, or venue. Used for contacts (city/address) and events (venue name or details).
      example: London, UK
      notes: Physical location for contacts or events.
      status: canonical
      profile:
        - contact
        - event
    - name: x-mx-reportType
      type: string
      authoring: authored
      definition: >-
        Type of report. Values: session, completion, audit, directors, build, executive-sales-report,
        technical-audit-report.
      example: directors
      validValues:
        - session
        - completion
        - audit
        - directors
        - build
        - executive-sales-report
        - technical-audit-report
        - partnership-capabilities-report
        - web-audit
        - internal-qa-audit
      notes: Determines report template and output format.
      status: canonical
      profile: report
    - name: x-mx-reportId
      type: string
      authoring: authored
      definition: Unique report identifier.
      example: RPT-2026-03-001
      notes: Unique identifier for cross-referencing.
      status: canonical
      profile: report
    - name: x-mx-client
      type: string
      authoring: authored
      definition: Client name for audit or deliverable reports.
      example: Acme Corp
      notes: Client name for audit or deliverable reports.
      status: canonical
      profile: report
    - name: sessionStart
      type: string
      authoring: authored
      definition: Session start timestamp. ISO 8601 format.
      example: '2026-03-01T09:00:00Z'
      notes: ISO 8601 datetime with timezone.
      status: canonical
      profile: report
    - name: sessionEnd
      type: string
      authoring: authored
      definition: Session end timestamp. ISO 8601 format.
      example: '2026-03-01T17:00:00Z'
      notes: ISO 8601 datetime with timezone.
      status: canonical
      profile: report
    - name: x-mx-pagesAudited
      type: number
      authoring: authored
      definition: Number of pages audited in an audit.
      example: 42
      notes: 'Spelling-neutral (NDR #3).'
      status: canonical
      profile: audit
    - name: x-mx-performanceScore
      type: number
      authoring: authored
      definition: Performance score (0-100).
      example: 85
      notes: Score 0-100. Typically from Lighthouse.
      status: canonical
      profile: audit
    - name: x-mx-llmSuitabilityScore
      type: number
      authoring: authored
      definition: LLM suitability score (0-100).
      example: 72
      notes: Score 0-100. MX-specific metric for AI agent compatibility.
      status: canonical
      profile: audit
    - name: x-mx-seoScore
      type: number
      authoring: authored
      definition: SEO score (0-100).
      example: 91
      notes: Score 0-100.
      status: canonical
      profile: audit
    - name: x-mx-event
      type: string-or-object
      authoring: authored
      definition: Event name or event details object.
      example: CMS Summit Frankfurt 2026
      notes: Can be a string or structured object with event details.
      status: canonical
      profile: event
    - name: documentType
      type: string
      authoring: authored
      definition: >-
        Document classification within MX. Distinct from contentType (which is the cog/folder format). Values describe
        the document role: proposal, specification, manual, report, pitch, letter, interview, etc.
      status: canonical
      profile: any
    - name: structure
      type: string
      authoring: authored
      definition: Structural description of this cog. Enumerates the major sections or blocks the reader should expect.
      status: canonical
      profile: cog
    - name: file
      type: string
      authoring: authored
      definition: Source file path reference. Points at the primary file this metadata describes.
      status: canonical
      profile: cog
    - name: governance
      type: string
      authoring: authored
      definition: 'Cog operational metadata: governance.'
      status: canonical
      profile: cog
    - name: changes
      type: string
      authoring: authored
      definition: 'Event/presentation metadata: changes.'
      status: canonical
      profile: event
    - name: focus
      type: string
      authoring: authored
      definition: 'Event/presentation metadata: focus.'
      status: canonical
      profile: event
    - name: contentUrl
      type: string
      authoring: authored
      definition: 'Cog operational metadata: content url.'
      status: canonical
      profile: cog
    - name: mxAgentAction
      type: string
      authoring: authored
      definition: 'Extended metadata field: mx agent action.'
      status: canonical
      profile: any
    - name: mxContext
      type: string
      authoring: authored
      definition: 'Extended metadata field: mx context.'
      status: canonical
      profile: any
    - name: mxPriority
      type: string
      authoring: authored
      definition: 'Extended metadata field: mx priority.'
      status: canonical
      profile: any
    - name: mxWhenToRead
      type: string
      authoring: authored
      definition: 'Extended metadata field: mx when to read.'
      status: canonical
      profile: any
    - name: mxKeySections
      type: string-or-array
      authoring: authored
      definition: mx key sections. String or array of values.
      status: canonical
      profile: any
    - name: watchRegistry
      type: string
      authoring: authored
      definition: 'Extended metadata field: watch registry.'
      status: canonical
      profile: any
    - name: keySections
      type: string-or-array
      authoring: authored
      definition: key sections. String or array of values.
      status: canonical
      profile: any
    - name: watchesFiles
      type: string-or-array
      authoring: authored
      definition: watches files. String or array of values.
      status: canonical
      profile: any
    - name: trigger
      type: string
      authoring: authored
      definition: 'Extended metadata field: trigger.'
      status: canonical
      profile: any
    - name: mxWatchRegistry
      type: string
      authoring: authored
