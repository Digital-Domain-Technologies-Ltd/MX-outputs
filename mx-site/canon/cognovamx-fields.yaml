      notes: >-
        CogNovaMX editorial-pipeline concept, not a Gathering open-standard field. The enum matches the routing
        generator, its single consumer. The bare `contentState` name is a deprecated synonym; see fields-data.yaml's
        deprecations table.
      status: canonical
      profile: x-mx-public
      required: false
      context: 'Declared on blog posts and other Intent-CMS-managed content to drive draft-vs-published routing.'
