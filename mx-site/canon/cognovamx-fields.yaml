    - name: x-mx-frictionLog
      type: array
      authoring: authored
      definition: >-
        The friction classes an action cog knows it can produce when run. Each entry declares id, when (trigger),
        signal (how it is detected), and severity (error, warn, info). Design-time declaration; runtime friction is
        logged to the system-friction-log store.
      example: '[{ id: submodules-absent, when: run in a thin clone, signal: target submodule directory absent, severity: warn }]'
      notes: >-
        Required on every type action-doc cog. Paired one-to-one with x-mx-resolver by frictionId. Schema at
        mx-canon/ssot/schemas/friction-resolver.v1.schema.json; gated by scripts/check-friction-resolver.cjs.
      status: canonical
      profile: x-mx-public
      context: 'Declared under the mx block on action cogs so every executable cog states its failure modes machine-readably.'
    - name: x-mx-resolver
      type: array
      authoring: authored
      definition: >-
        One owner-routed disposition per declared friction. Each entry declares frictionId, owner (ours, site-owner,
        operator, environment, upstream), action (auto-fix, manual-fix, propose, update-detector, report, skip), and
        target (cog, pipeline-script, pipeline-template, report, remediation, memory, detector).
      example: '[{ frictionId: submodules-absent, owner: environment, action: skip, target: memory }]'
      notes: >-
        Required on every type action-doc cog. Encodes the routing doctrine: owner ours is fixed at source; owner
        site-owner becomes a detector plus a report, never a fix on their behalf. Reuses audit-findings.v1 vocabulary.
      status: canonical
      profile: x-mx-public
      context: 'Declared under the mx block on action cogs so every friction has a machine-readable, owner-routed resolution.'
    - name: x-mx-contentState
      type: string
      authoring: defaulted
      inPlainWords: 'Its publishing state is {value}.'
      requiredIn: [blog]
      definition: >-
        Content workflow position. Distinct from status - x-mx-contentState tracks where content is in the editorial
        pipeline and drives publish routing (draft routes to the noindex draft tree, published to the live tree).
        Values: draft, in-review, published, archived, shared, expired. shared and expired are the private states of a
        page sent to named recipients: it is never routed under mx-site/, never listed on a lander and never put in a
        public corpus.
      example: draft
      validValues:
        - draft
        - in-review
        - published
        - archived
        - shared
        - expired
      notes: >-
        CogNovaMX editorial-pipeline concept, not a Gathering open-standard field. The enum matches the routing
        generator, its single consumer. The bare `contentState` name is a deprecated synonym; see fields-data.yaml's
        deprecations table. Required in the blog profile, so it is published metadata: the ADR 63 strip keeps a
        prefixed key an open profile requires, and a generated draft or live page carries its state (draft or
        published) for the reader that inspects it. Written by the heal from the page-path rules (draft, or
        published when the live page exists), so it is not on the author's checklist.
      status: canonical
      profile: x-mx-public
      context: 'Declared on blog posts and other Intent-CMS-managed content to drive draft-vs-published routing.'
    - name: x-mx-shareRecipients
      type: array
      authoring: authored
      inPlainWords: 'It is shared with {value}.'
      definition: >-
        Who may sign in to read a shared page: email addresses, or @domain entries that admit every address at that
        domain. Required when x-mx-contentState is shared.
      example: ['client@example.com', '@example.org']
      notes: >-
        Read by the share tool, which creates the sign-in gate for these recipients before anything is uploaded, and
        adds the operator's own address at share time without writing it into the source. Never published: a shared
        page has no public URL.
      status: canonical
      profile: x-mx-private
      context: 'Declared on an Intent CMS page sent to named recipients (design: mx-canon/mx-os/intent-cms-shared-expired-states.cog.md).'
    - name: x-mx-shareExpires
      type: string
      authoring: authored
      inPlainWords: 'The share ends at {value}.'
      definition: >-
        The ISO 8601 date-time after which a shared page answers 410 Gone. Required when x-mx-contentState is shared or
        expired; every share expires, and there is no permanent private link.
      example: '2026-11-01T00:00:00Z'
      notes: >-
        Expiry is decided at serve time from this date, so the served answer never waits for the stored state to catch
        up. Expiry stops serving; it does not delete the stored copy (revoke does).
      status: canonical
      profile: x-mx-private
      context: 'Declared on an Intent CMS page sent to named recipients.'
    - name: x-mx-shareId
      type: string
      authoring: defaulted
      inPlainWords: 'Its share link is named {value}.'
      definition: >-
        The random 24-character lower-case hex name a shared page's link uses. Required when x-mx-contentState is shared
        or expired. Written by the share tool, never chosen by hand.
      example: 0123456789abcdef01234567
      notes: >-
        Republishing keeps the same id, so a recipient's link always opens the newest version.
      status: canonical
      profile: x-mx-private
      context: 'Written by the share tool on an Intent CMS page sent to named recipients.'
    - name: x-mx-sessionState
      type: string
      authoring: authored
      definition: >-
        Lifecycle position of a worktree session record. open means a session holds the worktree now; paused means the
        worktree still exists with no session in it; closed means the work is finished and the worktree may be removed.
        Distinct from status, which describes the record as a document rather than the session it tracks.
      example: open
      validValues:
        - open
        - paused
        - closed
      notes: >-
        Read by the worktree-remove guard, which refuses to remove a worktree whose record still says open. The fleet
        hooks own the value; a human sets closed through npm run fleet:session:close.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record (handover/sessions/<name>.cog.md) so any machine can tell a live worktree from a spent one.'
    - name: x-mx-sessionId
      type: string
      authoring: authored
      definition: The assistant session identifier that last wrote this session record, so a record can be traced to the conversation that produced it.
      example: 1100e8d9
      notes: Written by the fleet session hooks from the harness payload; unknown when the harness supplies none.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record to bind it to one session rather than one machine.'
    - name: x-mx-operator
      type: string
      authoring: authored
      definition: The operator slug that opened a worktree session, resolved from the git email through the operator register.
      example: tom
      notes: >-
        The slug, never a display name or an email address. Resolved by scripts/lib/operator-config.cjs; unknown when
        no register entry matches, which is a gap to fix rather than a value to invent.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so a collision names who holds the worktree.'
    - name: x-mx-machineId
      type: string
      authoring: authored
      definition: The pinned machine slug that opened a worktree session, the same enduring identity the machine identity cogs key on.
      example: host-ad4c56ff-6136-52f3-986d-7093105c90c9
      notes: >-
        Pinned in the machine's own device store and read thereafter, never recomputed, so it survives a hostname
        change and an adapter swap. Treat the value as an opaque identifier: the host-<hex> shape is historical, from
        when the slug was derived from a MAC. A machine identified today proposes host-<platform uuid> (macOS
        IOPlatformUUID, Linux /etc/machine-id) and pins that. Distinct from the x-mx-machine block on a machine
        identity cog, which holds that machine's observed facts rather than a reference to it.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so the fleet index can group worktrees by machine.'
    - name: x-mx-worktree
      type: string
      authoring: authored
      definition: Absolute path of the worktree a session record belongs to, as git reports it on the machine that wrote the record.
      example: /Users/tom/GitHub/MX-hub/.claude/worktrees/fleet-sessions
      notes: Machine-specific by nature; a reader on another machine treats it as a label, never a path to open.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so an index entry and its record can be matched without re-deriving the path.'
    - name: x-mx-branch
      type: string
      authoring: authored
      definition: The git branch checked out in the worktree a session record belongs to.
      example: worktree-fleet-sessions
      notes: Recorded at creation; the fleet index carries the live value, which the branch may outgrow if the worktree switches.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so the fleet index reads as branches rather than paths.'
    - name: x-mx-artefact
      type: string
      authoring: authored
      definition: >-
        What the worktree exists to produce, in the operator's own words - a pull request, a report, a feature.
      example: PR 482
      notes: Defaults to the worktree name; an operator replaces it with the real artefact so the fleet index reads as work rather than slugs.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so another machine can tell what a worktree is for without opening it.'
    - name: x-mx-lastActive
      type: string
      authoring: authored
      definition: ISO 8601 instant when a worktree session was last active, refreshed on every save and close.
      example: '2026-09-05T20:00:00Z'
      notes: >-
        A machine-set field: the fleet hooks write it from the clock, never a human by hand. Staleness is judged against
        it, so a hand-typed value would launder an abandoned worktree into a live one.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a worktree session record so the fleet index can sort and age its entries.'
    - name: x-mx-sessionRef
      type: string
      authoring: authored
      inPlainWords: 'It is the working memory of the session recorded at {value}.'
      definition: Repository-relative path of the worktree session record a session memory cog belongs to.
      example: handover/sessions/fleet-sessions.cog.md
      notes: Set when the memory cog is created by scripts/lib/session-memory.cjs; the memory cog sits beside that record and closes with it.
      status: canonical
      profile: x-mx-public
      context: 'Declared on a session memory cog (handover/sessions/<name>.memory.cog.md) so the memory and its session record can be matched without re-deriving the path.'
    - name: x-mx-memoryState
      type: string
      authoring: authored
      inPlainWords: 'Its memory is {value}.'
      definition: >-
        Lifecycle position of a session memory cog. open means the session is still adding and curating entries; folded
        means the session closed and the memory's hashes and statuses were written into the session's AI provenance
        sidecar.
      example: open
      validValues:
