title: CogNovaMX Field Extensions
version: '1.14'
created: '2026-04-15'
modified: '2026-09-05'
author: Tom Cranstoun
description: >-
  CogNovaMX vendor extensions to the MX open standard, published as a reference pack for other vendors authoring their
  own x-vendor- extensions. This dictionary documents the vocabulary; documents never carry it into publication, because
  the vendor layer is stripped from every published artefact. Per the namespace policy, the prefix is the policy: no
  additional visibility markers needed.
mx:
  status: active
  license: proprietary
  x-mx-category: vendor-extensions
  partOf: mx-cognovamx
  tags:
    - fields
    - metadata
    - extensions
    - cognovamx
    - vendor
  audience:
    - machines
    - humans
  contentType: field-dictionary
  runbook: >-
    CogNovaMX-owned field extensions. This dictionary is published so another vendor can see how an extension pack is
    built; the fields it documents are internal, and stripInternalFields removes them from every published artefact
    (ADR 63, enforced by Gate 107). So a name here is a vocabulary entry, never a licence to publish the field on a
    page. Private extensions (x-mx-p-) are operational and their values may be obfuscated. Do not move entries between
    tiers without ADR approval.
  vendor: CogNovaMX
  namespace:
    - x-mx-
    - x-mx-p-
  fields:
    - name: x-mx-mount-type
      type: string
      definition: 'Mount type for submodule repositories. Values: personal, team, product, standard.'
      example: personal
      validValues:
        - personal
        - team
        - product
        - standard
      notes: Categorises submodules in the hub mount table.
      status: canonical
      profile: x-mx-public
      required: true
      context: Used in .mx.yaml.md folder metadata for git submodules to categorise them in the hub mount table.
    - name: x-mx-mount-swappable
      type: string-or-boolean
      definition: 'Whether this mount can be swapped for a different repository. Values: true, false, fork.'
      example: true
      validValues:
        - true
        - false
        - fork
      notes: Personal = swappable, product = not, standard = forkable.
      status: canonical
      profile: x-mx-public
      required: true
      context: >-
        Personal mounts are swappable (each business mounts their own). Product mounts are not. Standard mounts are
        forkable.
    - name: x-mx-mount-upstream
      type: string
      definition: Upstream source for standard-type mounts. URL or description of where to pull updates from.
      example: https://github.com/Digital-Domain-Technologies-Ltd/MX-Gathering
      notes: Only for standard mount type.
      status: canonical
      profile: x-mx-public
      required: false
      context: Only used for standard mount type. Points to The Gathering open standard or equivalent upstream.
    - name: x-mx-automationConsent
      type: string
      definition: >-
        Structured automation consent for AI agents encountering this content. Declares what a machine may do with
        the file the field travels on: act on it autonomously (allowed), read and recommend while a human decides
        (advisory-only), or not act at all (forbidden). A declaration honest agents honour, not an enforcement;
        REGINALD attestation is what makes the declaration attributable and dated.
      example: advisory-only
      validValues:
        - allowed
        - advisory-only
        - forbidden
      notes: >-
        Vendor-tier stand-in while the open standard's structured consent vocabulary awaits W3C/NIST/IEEE
        convergence (the parked ai.* family; see mx-canon/ssot/field-cull-log.md). Complements the plain-language
        contentPolicy string rather than replacing it: contentPolicy explains for humans, this field instructs
        machines. There is deliberately no per-action requiresHuman companion; advisory-only carries the
        human-decides meaning under Human-in-Command.
      status: canonical
      profile: x-mx-public
      required: false
      context: 'Declared per artefact in the mx: block. Read by agents and the audit suite to decide whether acting on the content is sanctioned.'
    - name: x-mx-capabilities
      type: array
      definition: >-
        The declared capability tokens an executable artefact holds, drawn from the MX capability vocabulary
        (processSpawn, credentialRead, networkEgress, filesystemWrite, telemetryEmit, terminalControl, destructive). A
        machine-readable statement of what the artefact touches, a capability manifest that travels with the file.
        Subject to Declare, Verify, Enforce: the tokens are verified against the artefact's own code, and a governed
        runtime holds the artefact to the declared set. Capability is read as risk against publisher trust, not off the
        resource.
      example: '[networkEgress, credentialRead]'
      validValues:
        - processSpawn
        - credentialRead
        - networkEgress
        - filesystemWrite
        - telemetryEmit
        - terminalControl
        - destructive
      notes: >-
        The standardized, closed vocabulary is modelled on the Android permission taxonomy so declarations are
        comparable across artefacts (an editor extension, a package, an action cog). Distinct from an unverified store
        label because the declaration is checked against behaviour rather than asserted by the author. Editor-extension
        descriptors are generated by scripts/lib/extension-capabilities.cjs; a cog's embedded-script scope is verified
        by scripts/check-cog-capabilities.cjs against its security.scope. See Chapter 26 (Protocols) and the Declare,
        Verify, Enforce principle.
      status: canonical
      profile: x-mx-public
      required: false
      context: 'Declared per capability-bearing artefact. Read by an agent, a marketplace, or a governed runtime before trusting or running the artefact.'
    - name: publishedTo
      type: string
      definition: >-
        Downstream provenance — where this content is published. Can be a relative path within the repository or an
        external URL. Used by the MX graph to build lineage edges tracing content from source to published destination.
      example: https://allabout.network/blogs/mx/
      notes: >-
        Declared in the mx: block. Never inherited — always per-folder or per-cog. Value can be a path (internal) or URL
        (external). The MX graph resolves these into publishedTo edges.
      status: canonical
      profile:
        - folder
        - cog
      required: optional
    - name: servedAt
      type: string
      definition: >-
        The public URL where the generated page for this source is served. Declared only when the page lives at a
        non-default path; the Intent CMS generator defaults blog posts to https://mx.allabout.network/blog/<slug>.html.
      example: https://mx.allabout.network/blog/governance/example-post.html
      notes: >-
        Declared in the mx: block of draft-site sources. Optional at the default path; required for series subfolders
        and other non-default paths.
      status: canonical
      profile: cog
      required: optional
    - name: contentPolicy
      type: string
      definition: >-
        Plain-language statement of how the file may be reused - whether agents may cite, summarise, quote, or link
        to it. Aligns with W3C ODRL (Open Digital Rights Language) rather than the x-mx- vendor namespace, per the
        2026-06-20 namespace policy ruling (see scripts/cogs/field-merge.cog.md).
      example: "AI agents may cite, summarize, link to, and quote."
      notes: >-
        The asset decorator writes it into an asset's own carrier so the reuse policy travels with the binary. Two
        legacy x-mx-contentPolicy occurrences are a pending migration to this canonical bare form, tracked separately.
      status: canonical
      profile: cog
      required: optional
    - name: blogUrl
      type: string
      definition: The canonical public URL of the published blog post generated from this source.
      example: https://mx.allabout.network/blog/example-post.html
      notes: >-
        Declared in the mx: block of blog-post sources in datalake/draft-site/blog/. Matches the slug filename.
      status: canonical
      profile: cog
      required: optional
    - name: blogFilename
      type: string
      definition: The slug of the blog post — the filename shared by the markdown source and the generated HTML.
      example: example-post
      notes: >-
        Declared in the mx: block of blog-post sources. Lowercase, hyphen-separated; matches canonicalUri, servedAt,
        and blogUrl.
      status: canonical
      profile: cog
      required: optional
    - name: isGenerated
      type: boolean
      definition: >-
        True if this content was produced by a deterministic script (not handwritten by a human and not produced by an
        AI agent). Use when a build step, code generator, or index-generator wrote the file. Distinct from
        isAiGenerated, which marks AI-agent output.
      example: true
      notes: >-
        Declared in the mx: block. Default: false (human-authored). Generated files should also carry generatedBy (the
        script path or name) when possible so readers can locate the generator. If both isGenerated and isAiGenerated
        are true, the AI agent ran via a scripted wrapper.
      status: canonical
      profile:
        - folder
        - cog
        - all
      required: optional
      default: false
    - name: isAiGenerated
      type: boolean
      definition: >-
        True if this content was produced by an AI agent (LLM or autonomous tool). Use when the file was written by
        Claude, ChatGPT, or any automated reasoning system, whether under human review or not. Distinct from
        isGenerated, which marks deterministic-script output.
      example: true
      notes: >-
        Declared in the mx: block. Default: false (human-authored). AI-generated content should also carry generatedBy
        (the agent or model identifier) and, when applicable, reviewedBy so readers can see whether a human vetted the
        output. Never inherited — AI-generation status belongs to individual files.
      status: canonical
      profile:
        - folder
        - cog
        - all
      required: optional
      default: false
    - name: generatedBy
      type: string
      definition: >-
        Identifier of the generator when isGenerated or isAiGenerated is true. For scripts: a relative path or script
        name (e.g. 'scripts/generate-index.sh'). For AI agents: a model or agent identifier (e.g. 'claude-opus-4-6',
        'claude-code'). Free text — tooling treats the value as an opaque label for now.
      example: scripts/generate-index.sh
      notes: Optional companion to isGenerated/isAiGenerated. Empty or absent when the content is human-authored.
      status: canonical
      profile:
        - folder
        - cog
        - all
      required: optional
    - name: image
      type: string
      definition: >-
        Primary illustrative image — relative repository path or external URL. Used as the social-share preview and the
        lead visual.
      example: /images/og-default.png
      status: canonical
      profile:
        - book
        - blog
        - all
      required: optional
    - name: contentFilename
      type: string
      definition: >-
        Canonical filename of the content artefact, distinct from the path the document is stored at. Used by content
        cogs that may move.
      example: content.md
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: lastUpdated
      type: string
      definition: >-
        Last substantive update timestamp (ISO 8601 date). Companion to `modified` — `modified` reflects file mtime,
        `lastUpdated` reflects when the content materially changed.
      example: '2026-04-15'
      status: canonical
      profile:
        - all
      required: optional
    - name: fullName
      type: string
      definition: Full personal or organisational name. Used in profile and contact documents.
      example: Tom Cranstoun
      status: canonical
      profile:
        - contact
        - all
      required: optional
    - name: organisation
      type: string
      definition: Organisation name. British spelling preferred for prose; the field is spelling-neutral for matching.
      example: CogNovaMX
      notes: 'See also: company. organisation is for the entity, company for a contact''s employer.'
      status: canonical
      profile:
        - contact
        - all
      required: optional
    - name: website
      type: string
      definition: Primary website URL for the document subject (a person, organisation, or product).
      example: https://allabout.network
      status: canonical
      profile:
        - contact
        - all
      required: optional
    - name: theme
      type: string
      definition: Presentation or page theme identifier. Picks visual styling at render time.
      example: mx-light
      status: canonical
      profile:
        - all
      required: optional
    - name: slides
      type: array
      definition: Ordered list of slide titles or paths in a presentation document.
      example:
        - intro
        - field-catalogue
        - drift-prevention
        - next-steps
      status: canonical
      profile:
        - all
      required: optional
    - name: agentAction
      type: string
      definition: Single-sentence instruction for an AI agent reading this document. What the agent should do or check.
      example: Sync mx-reginald registry before publishing.
      notes: Distinct from runbook (which is for humans + agents). Agent-only directive.
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: whenToRead
      type: string
      definition: >-
        Short prose hint telling the reader (human or agent) the situation in which this document is the right one to
        consult.
      example: Read at session start, before touching any .cog.md file.
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: updateInstructions
      type: string
      definition: Runbook for keeping the document content fresh. When and how to update it.
      example: Regenerate via npm run cog:sync after any cog frontmatter change.
      status: canonical
      profile:
        - all
      required: optional
    - name: clientUrl
      type: string
      definition: URL of the client property being audited or reported on.
      example: https://example.com
      status: canonical
      profile:
        - audit
        - contact
        - all
      required: optional
    - name: clientSlug
      type: string
      definition: Short identifier for the client (kebab-case slug used in file paths and report IDs).
      example: arrivefirst
      status: canonical
      profile:
        - audit
        - contact
        - all
      required: optional
    - name: auditTool
      type: string
      definition: Name of the tool that produced the audit report.
      example: mx-audit
      status: canonical
      profile: audit
      required: optional
    - name: auditDate
      type: string
      definition: Date of the audit run (ISO 8601 date).
      example: '2026-04-15'
      status: canonical
      profile: audit
      required: optional
    - name: accessibilityScore
      type: number
      definition: Pa11y or equivalent accessibility score (0-100).
      example: 92
      status: canonical
      profile: audit
      required: optional
    - name: totalIssues
      type: number
      definition: Total count of issues found in an audit report.
      example: 47
      status: canonical
      profile: audit
      required: optional
    - name: imagesAnalyzed
      type: number
      definition: Number of images analysed during an audit run.
      example: 128
      status: canonical
      profile: audit
      required: optional
    - name: bestPracticesScore
      type: number
      definition: Lighthouse or equivalent best-practices score (0-100).
      example: 88
      status: canonical
      profile: audit
      required: optional
    - name: htmlValidation
      type: string
      definition: HTML validation result summary (passed, warnings, errors with counts).
      example: passed
      status: canonical
      profile: audit
      required: optional
    - name: totalOpportunities
      type: number
      definition: Count of improvement opportunities surfaced by an audit run.
      example: 12
      status: canonical
      profile: audit
      required: optional
    - name: nextAction
      type: string
      definition: Next concrete action this contact / opportunity / report needs.
      example: Schedule follow-up call after their MX audit lands.
      status: canonical
      profile:
        - contact
        - audit
        - all
      required: optional
    - name: engagementOptions
      type: array
      definition: List of possible engagement modes available with a contact (e.g. consulting, training, content, advisory).
      example:
        - consulting
        - training
        - advisory
      status: canonical
      profile: contact
      required: optional
    - name: registry
      type: string
      definition: Registry identifier this document belongs to (e.g. mx-reginald, content-registry).
      example: mx-reginald
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: security
      type: object-or-string
      definition: >-
        Security declaration for an action document. May be the string name of a security profile or an object with
        attestation, execution, trustLevel, and policy fields.
      example:
        attestation: required
        execution: sandboxed
      notes: >-
        When a string, references a named security profile. When an object, declares the security block inline. See
        Appendix M for the security block fields.
      status: canonical
      profile: cog
      required: optional
    - name: signature
      type: string
      definition: Cryptographic signature attesting the cog's authorship and integrity.
      example: ed25519:0xabc123...
      status: canonical
      profile: cog
      required: optional
    - name: provenance
      type: object-or-string
      definition: >-
        Origin and lineage block. May be the string of a single provenance source, or an object with origin,
        derivedFrom, method, and date fields. See Appendix M for the provenance block fields.
      example:
        origin: https://example.com/source
        method: Imported
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: definition
      type: string
      definition: >-
        Concise definition of the term or concept this document is about. Used in glossary entries and concept
        documents.
      example: A self-contained unit of MX content with metadata, prose, and optional executable blocks.
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: affects
      type: array
      definition: List of file paths, modules, or systems this change or document affects.
      example:
        - scripts/mx-audit.js
        - mx-canon/ssot/fields-data.yaml
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: action
      type: string
      definition: >-
        Single-line description of the action this document performs or recommends. Companion to agentAction (for AI)
        and runbook (for humans + AI).
      example: Regenerate the registry.
      status: canonical
      profile:
        - cog
        - all
      required: optional
    - name: note
      type: string
      definition: Free-text note attached to the document. Used for short editorial annotations.
      example: Scheduled for review next week.
      status: canonical
      profile:
        - all
      required: optional
    - name: thread
      type: string
      definition: Conversation or message thread identifier (e.g. Slack thread URL, email subject).
      example: slack://team/C123/p456
      status: canonical
      profile:
        - contact
        - all
      required: optional
    - name: related
      type: array
      definition: List of related documents, contacts, or topics. Free-form references.
      example:
        - ./parent.md
        - https://example.com
      notes: When the relationship is structural (parent/child, builds-on), use the dedicated field instead.
      status: canonical
      profile:
        - all
      required: optional
    - name: recipient
      type: string-or-array
      definition: Target audience or addressee of a message, report, or proposal.
      example: Tom Cranstoun
      status: canonical
      profile:
        - contact
        - all
      required: optional
    - name: links
      type: array
      definition: List of URLs or paths the document links to.
      example:
        - https://allabout.network
        - ./related.md
      status: canonical
      profile:
        - all
      required: optional
    - name: includes
      type: array
      definition: >-
        Cog composition — content reuse without duplication. Array of include declarations, each specifying a source cog
        (relative path or reginald:<name>), optional block filter, and resolution mode (build or read). Included content
        is merged into the cog; the including cog's own content overrides included content of the same type.
      example:
        - source: shared/validation-policy.cog.md
          blocks:
            - sop
          resolution: build
      notes: >-
        Structural composition. Distinct from builds-on (soft recommendation) and requires (hard dependency). See
        cog-unified-spec Section 3 for full specification including inline @include markers.
      status: canonical
      profile: cog
      required: optional
    - name: deliverable
      type: string-or-array
      definition: >-
        What this cog produces or delivers. Declares the tangible output — a report, a validated artefact, a trained
        team, a published page. Particularly useful for action-docs where the deliverable is the reason the cog exists.
      example: validated cog registered in REGINALD
      notes: >-
        Declares the output of a cog. For action-docs, describes what running the actions produces. For info-docs,
        describes the knowledge or artefact the cog represents. Array form for cogs with multiple deliverables.
      status: canonical
      profile: cog
      required: optional
    - name: recordedFrom
      type: string
      definition: Who this meeting-note or call-recap account was recorded from, and the context of the recording.
      example: "Tom Cranstoun (meeting recap, 2026-07-14 call)"
      notes: Free-text attribution + recording context. Distinct from source (input files a document was derived from).
      status: canonical
      profile: contact
      required: optional
    - name: contentScope
      type: string
      definition: Prose statement of what this document covers and, where useful, what it deliberately does not cover.
      example: "Covers the design specification and PRD; does not cover the implementation timeline."
      status: canonical
      profile: cog
      required: optional
    - name: finishing
      type: object
      definition: >-
        The finisher contract on a transfer-manifest cog (ADR: export-batch finishing block) - what may publish
        (items), the inventory proving the batch is intact, and the trust anchor.
      notes: >-
        Consumed by scripts/lib/export-to-medium.cjs (mx.finishing.inventory). Generated by the export-batch
        pipeline; hand-editing is not the normal path.
      status: canonical
      profile: cog
      required: optional
    - name: members
      type: array
      definition: The member filenames this folder-metadata (.mx.yaml.md) record indexes.
      example:
        - web-audit-management-summary-template.md
        - web-audit-technical-report-template.md
      status: canonical
      profile: folder
      required: optional
    - name: sentAt
      type: string
      definition: The date a message was actually sent, distinct from created (when it was authored/drafted).
      example: '2026-05-27'
      status: canonical
      profile: contact
      required: optional
    - name: hold
      type: boolean
      definition: Whether outreach to this contact is currently paused.
      example: false
      notes: Pairs with holdReason.
      status: canonical
      profile: contact
      required: optional
    - name: holdReason
      type: string
      definition: Why outreach to this contact is on hold, when hold is true.
      example: "Awaiting a scheduling window from their side."
      status: canonical
      profile: contact
      required: optional
    - name: channel
      type: string
      definition: The communication channel used for this outreach record.
      example: email
      status: canonical
      profile: contact
      required: optional
    - name: project
      type: object
      definition: Project metadata object. Contains name, description, repository, documentation.
      example:
        name: MX Hub
        repository: https://github.com/...
      notes: Container for project-level metadata in root folder files.
      status: canonical
      profile: folder
      required: optional
    - name: context
      type: object
      definition: Domain context object. Contains domain, purpose, constraints.
      example:
        domain: machine-experience
        purpose: specification
      notes: Container for domain context in folder metadata.
      status: canonical
      profile: folder
      required: optional
    - name: stack
      type: object
      definition: Technical stack object. Contains language, runtime, version.
      example:
        language: javascript
        runtime: node
      notes: Container for technical stack information.
      status: canonical
      profile: folder
      required: optional
    - name: wordCount
      type: number
      definition: Word count of the document content.
      example: 3500
      notes: Used for publication planning and progress tracking.
      status: canonical
      profile: book
    - name: blogState
      type: string
      definition: 'Blog lifecycle state. Values: draft, review, published.'
      example: published
      validValues:
        - draft
        - review
        - published
      notes: Blog-specific lifecycle. Distinct from status (generic).
      status: canonical
      profile: blog
    - name: agentType
      type: string
      definition: >-
        Classification of the subject's agentic nature. Distinct from `contentType` (which describes the document) and
        `role` (which describes functional hat-wearing).
      example: ai-agent
      validValues:
        - ai-agent
        - human
        - organisation
        - system
      notes: >-
        Use when the record describes an actor that can produce actions, send messages, or be the subject of
        attribution.
      status: canonical
      profile:
        - identity
        - contact
    - name: relationship
      type: string
      definition: Relationship type.
      example: advisory-board
      validValues:
        - advisory-board
        - investor
        - partner
        - prospect
        - team
        - advisor
        - mentor
        - family
        - collaborator
        - client
        - contact
        - professional
        - business-partner
        - peer
        - personal-friend
        - professional-friend
        - personal-acquaintance
      status: canonical
      profile: contact
    - name: role
      type: string
      definition: Job title or role.
      example: CTO
      status: canonical
      profile: contact
    - name: company
      type: string
      definition: Organisation name.
      example: CogNovaMX Ltd
      status: canonical
      profile: contact
    - name: nextAction
      type: string
      definition: Next action for this contact.
      example: Follow up after Frankfurt CMS Summit
      notes: Free-form text describing the next step.
      status: canonical
      profile: contact
    - name: relatedFolders
      type: array
      definition: Related folders with path, relationship type, and description.
      example:
        - path: ../mx-audit
          relationship: sibling
      notes: Array of objects with path, relationship, and description.
      status: canonical
      profile: folder
    - name: email
      type: string
      definition: Contact email address.
      example: info@cognovamx.com
      status: canonical
      profile: contact
    - name: phone
      type: string
      definition: Contact phone number.
      example: +44 7700 900000
      notes: Include international dialling code. Quote to prevent YAML number parsing.
      status: canonical
      profile: contact
    - name: whatsapp
      type: string
      definition: WhatsApp contact number.
      example: +44 7700 900000
      notes: May differ from phone. Quote the value.
      status: canonical
      profile: contact
    - name: linkedin
      type: string
      definition: LinkedIn profile URL.
      example: https://linkedin.com/in/tomcranstoun
      notes: Full URL to LinkedIn profile.
      status: canonical
      profile: contact
    - name: nickname
      type: string
      definition: Informal name or abbreviation.
      example: Max
      notes: Informal name. Helps agents recognise conversational references.
      status: canonical
      profile: contact
    - name: lastContact
      type: string
      definition: Date of last contact. ISO 8601 format (YYYY-MM-DD).
      example: 2026-02-28T00:00:00.000Z
      notes: ISO 8601. Updated after each interaction.
      status: canonical
      profile: contact
    - name: pipelineStage
      type: string
