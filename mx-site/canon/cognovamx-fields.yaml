    - name: x-mx-frictionLog
      type: array
      definition: >-
        The friction classes an action cog knows it can produce when run. Each entry declares id, when (trigger),
        signal (how it is detected), and severity (error, warn, info). Design-time declaration; runtime friction is
        logged to the system-friction-log store.
      example: '[{ id: submodules-absent, when: run in a thin clone, signal: target submodule directory absent, severity: warn }]'
      notes: >-
        Required on every type action-doc cog. Paired one-to-one with x-mx-resolver by frictionId. Schema at
        mx-canon/ssot/schemas/friction-resolver.v1.schema.json; gated by scripts/check-friction-resolver.cjs.
      status: canonical
      profile: x-mx-public
      required: true
      context: 'Declared under the mx block on action cogs so every executable cog states its failure modes machine-readably.'
    - name: x-mx-resolver
      type: array
      definition: >-
        One owner-routed disposition per declared friction. Each entry declares frictionId, owner (ours, site-owner,
        operator, environment, upstream), action (auto-fix, manual-fix, propose, update-detector, report, skip), and
        target (cog, pipeline-script, pipeline-template, report, remediation, memory, detector).
      example: '[{ frictionId: submodules-absent, owner: environment, action: skip, target: memory }]'
      notes: >-
        Required on every type action-doc cog. Encodes the routing doctrine: owner ours is fixed at source; owner
        site-owner becomes a detector plus a report, never a fix on their behalf. Reuses audit-findings.v1 vocabulary.
      status: canonical
      profile: x-mx-public
      required: true
      context: 'Declared under the mx block on action cogs so every friction has a machine-readable, owner-routed resolution.'
