        - mx-dev
        - mx-maxine-core
        - mx-ops
        - mx-os
        - mx-research
        - mx-sales
        - mx-the-gathering
        - mx-tool
        - naming
        - onboarding
        - outreach
        - output-scripts
        - partner-profile
        - pipeline
        - plan
        - prd
        - principle
        - product
        - prospect
        - provenance
        - reference
        - reference-implementation
        - reginald
        - registry
        - reminders
        - restaurant
        - risk
        - security
        - specification
        - standard
        - strategy
        - system
        - technical-notes
        - template
        - understand
        - validation
        - vendor-extensions
        - venue
        - vision
        - workflow
      notes: >-
        Vendor-tier cog taxonomy, distinct from the standard contentType field (which types the document
        universally). The controlled vocabulary is broadened to the categories the estate actually uses, with
        synonym spellings collapsed to one canonical value. The bare `category` name is a deprecated synonym; see
        fields-data.yaml's deprecations table and mx-canon/ssot/field-cull-log.md.
      status: canonical
      profile: x-mx-public
      required: true
      context: 'Required on cog files (.cog.md) to group them for registry purposes.'
    - name: x-mx-riskLevel
      type: string
      definition: >-
        Execution danger classification for action-doc cogs declaring runnable behaviour. low = read-only, no side
        effects. medium = writes files or calls APIs. high = modifies system state, handles credentials. critical =
        destructive operations, financial transactions - SHOULD have a guardrail gate.
      example: low
      validValues:
        - low
        - medium
        - high
        - critical
      notes: >-
        CogNovaMX governance concept, not a Gathering open-standard field. Distinct from trustLevel (provenance
        quality, standard tier). Top-level convenience for the value also accepted inside a security block; when both
        forms are present the security block wins. The bare `riskLevel` name is a deprecated synonym; see
        fields-data.yaml's deprecations table.
      status: canonical
      profile: x-mx-public
      required: false
      context: 'Declared on action-doc cogs that execute code or call external systems, to signal the blast radius of a failure.'
