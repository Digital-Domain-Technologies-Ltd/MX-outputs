  profiles:
    - name: book
      description: Fields for book manuscript chapters.
      required:
        - book
        - chapter
        - wordCount
        - copyright
    - name: blog
      description: Fields for blog posts.
      required:
        - publicationDate
        - blogState
      optional:
        - movedFrom
        - movedDate
    - name: contact
      description: Fields for contact/person records.
      required:
        - relationship
        - role
        - company
      optional:
        - nextAction
        - confidential
        - messages
        - email
        - phone
        - whatsapp
        - linkedin
        - nickname
        - priority
        - lastContact
        - twinOf
        - location
        - platform
        - name
    - name: report
      description: Fields for session reports, audit reports, and completion reports.
      required:
        - reportType
      optional:
        - reportId
        - client
        - sessionStart
        - sessionEnd
        - segment
    - name: audit
      description: Fields for MX web audit scoring and metrics.
      optional:
        - pagesAudited
        - performanceScore
        - llmSuitabilityScore
        - seoScore
    - name: event
      description: Fields for events, locations, and presentations.
      optional:
        - event
        - location
        - organiser
        - hours
    - name: js
      description: 'Fields for .cog.js files. Convention: @mx:field in JSDoc blocks.'
      required:
        - mx:name
      recommended:
        - mx:version
        - mx:purpose
      optional:
        - mx:audience
        - mx:stability
        - mx:category
        - mx:tags
        - mx:buildsOn
        - mx:documentedIn
        - mx:contextProvides
    - name: css
      description: 'Fields for .cog.css files. Convention: @mx:field in comment blocks.'
      required:
        - mx:name
      recommended:
        - mx:version
        - mx:purpose
      optional:
        - mx:audience
        - mx:stability
        - mx:category
        - mx:tags
    - name: x-mx-public
      description: 'MX-public extension fields. Prefix: x-mx-. Visible in published cogs. CogNovaMX vendor extensions.'
      fields:
        - x-mx-mount-type
        - x-mx-mount-swappable
        - x-mx-mount-upstream
    - name: x-mx-private
      description: 'MX-private extension fields. Obfuscated. Prefix: x-mx-p-. Field names are not listed publicly.'
      fields: []
