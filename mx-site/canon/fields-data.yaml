    - name: portable
      description: >-
        A conformance level, not a document type: the fields a document must carry to remain interpretable by a
        machine that meets it away from its source, with no access to the originating site. It is the Documents Are
        Self-Sufficient test made checkable. A document opts in by listing this profile's address in conformsTo
        (https://mx.allabout.network/canon/fields-data.yaml#portable), and scripts/check-portable-conformance.cjs
        then holds it to the set below. Identity says what it is and who wrote it; canonicalUri says where the
        master lives, which with version is the currency signal; license says what a reader may do with it; and
        one of integritySignature or provenanceUri gives the reader a trust check it can run without the source.
        The profile is additive: a document that does not claim it is unaffected.
      header: |
        ---
        # Carrier: any document that claims the profile through conformsTo
        # --- Zone 1a: Identity ---
        title: "Provenance and the regulator"
        description: "Position paper on evidence a regulator can verify without the publisher's site."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        version: "1.2"
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: paper
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          canonicalUri: https://example.com/papers/provenance-and-the-regulator.md
          license: CC-BY-4.0
          conformsTo: [https://mx.allabout.network/canon/fields-data.yaml#portable]
          provenanceUri: https://example.com/papers/provenance-and-the-regulator.provenance.json
          inLanguage: en
        ---
      required:
        - title
        - description
        - author
        - created
        - modified
        - version
        - canonicalUri
        - license
      requiredAnyOf:
        - integritySignature
        - provenanceUri
      recommended:
        - conformsTo
        - proofOfAuthorship
        - provenancePedigree
        - expires
        - inLanguage
      optional:
        - type
        - tags
        - resource
    - name: component
      description: >-
        The fields a rendered component carries to its human reader and its machine reader, as the MX Component
        Standard defines them. A component is the unit in which an MX-described object reaches a reader (a card, a
        badge, a panel, an inspector view), and it carries the same metadata for both audiences: the root fields for
        identity, provenance, relationships and signals, plus the component family for how the component presents
        them. The component kind is a value of the OKF type field (component:provenanceBadge, component:objectCard,
        component:relationshipLine, component:verificationPanel, component:narrativeLayer, component:gridMount,
        component:signalBar, component:objectInspector), and every field in the family is optional. Trust signals are
        reported separately and never combined into one score; a state is conveyed in text before any styling or
        motion. The Gathering approved the family on 2026-09-17.
      header: |
        ---
        # Carrier: a rendered component, described in the frontmatter of the document it stands for
        # --- Zone 1a: Identity ---
        title: "Provenance and the regulator"
        description: "Position paper on evidence a regulator can verify without the publisher's site."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-17
        version: "1.2"
        # --- Zone 1b: OKF reserved surface ---
        type: component:objectCard
        tags: [example, component]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          canonicalUri: https://example.com/papers/provenance-and-the-regulator.md
          status: active
          authorship: solo
          relatedTo: [https://example.com/papers/regime-registry.md]
          attestation: https://reginald.example.com/records/provenance-and-the-regulator
          displayMode: compact
          preview: https://example.com/previews/provenance-and-the-regulator.png
          actions:
            - name: open
              target: https://example.com/papers/provenance-and-the-regulator.html
              verifiability: deterministic
          verificationSummary: "Attested by the publisher, current version, publisher active."
          finalConfidence: 0.92
          confidenceMethod: weighted-step-outcomes
        ---
      required:
        - title
        - description
        - author
        - created
        - modified
        - canonicalUri
        - authorship
      recommended:
        - version
        - status
        - relatedTo
        - attestationRecord
      optional:
        - type
        - tags
        - resource
        - displayMode
        - icon
        - verificationChanged
        - preview
        - actions
