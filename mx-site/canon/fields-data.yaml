        - data
        - cogs
        - testing
        - services
        - middleware
        - eds
        - components
        - api
        - plugins
        - configuration
      status: canonical
      profile: folder
    - name: stability
      type: string-or-array
      definition: 'Content stability. Values: stable, evolving, experimental, deprecated, archived, draft, final, friable. friable means the file is regenerated from a source and must never be hand-edited; any given rendering is transient and is remade when its source changes. Use it for generated indexes and for generated outputs (such as published blog HTML) regenerated from source. A file may carry one value or several: the values combine, so an item that is both an unfinished draft and regenerated from source declares [draft, friable].'
      example: stable
      validValues:
        - stable
        - evolving
        - experimental
        - deprecated
        - archived
        - draft
        - final
        - friable
      notes: 'Content stability. Helps agents assess information reliability. friable marks a machine-owned, regenerated-from-source file (generated indexes, generated blog HTML): never hand-edit it, and treat the current rendering as transient because it is remade whenever its source changes.'
      status: canonical
      profile: folder
    - name: lifecycle
      type: string
      definition: 'Folder lifecycle stage. Values: production, development, prototype, legacy, deprecated.'
      example: production
      validValues:
        - production
        - development
        - prototype
        - legacy
        - deprecated
      notes: Development phase. Distinct from stability (content reliability).
      status: canonical
      profile: folder
    - name: hasSubfolders
      type: boolean
      definition: Whether the folder contains subfolders.
      example: true
      notes: Helps tools decide whether to recurse into subdirectories.
      status: canonical
      profile: folder
    - name: inherits
      type: string
      definition: >-
        Path to the file this document extends. The inheriting file adds MX metadata on top of the target's content. The
        target can be any file type — .md, .cog.md, .html, .json, .yaml, or any other. Any MX-aware file (one carrying
        MX metadata in its carrier format) can declare inherits. Path can be relative or absolute.
      example:
        - README.md
        - ../shared/base-policy.cog.md
        - /Users/tom/assets/config.yaml
      notes: >-
        File-type agnostic. The inheriting file extends the target — it does not replace it. For folder-level field
        inheritance, use inheritable on the parent folder instead.
      status: canonical
      profile: any
    - name: primaryLanguages
      type: array
      definition: Primary programming or content languages in the folder.
      example:
        - javascript
        - markdown
      notes: Helps agents select appropriate tools for the folder.
      status: canonical
      profile: folder
    - name: cogId
      type: string
      definition: Unique cog identifier within the registry.
      example: field-dictionary
      notes: Typically derived from filename without .cog.md extension.
      status: canonical
      profile: cog
    - name: cogType
      type: string
      definition: 'Cog type classification. Values: info, action, routing, certificate-of-genuineness.'
      example: info
      validValues:
        - info
        - action
        - routing
        - certificate-of-genuineness
      notes: >-
        Info = reference, action = has execute block, routing = agent navigation, certificate-of-genuineness =
        publisher-provenanced credential with publisher block.
      status: canonical
      profile: cog
    - name: maintainedDate
      type: string
      definition: Date the cog was last confirmed accurate by its maintainer. ISO 8601 format (YYYY-MM-DD).
      example: 2026-03-01T00:00:00.000Z
      notes: ISO 8601. Helps agents assess content freshness.
      status: canonical
      profile: cog
    - name: maintainedBy
      type: string
      definition: Person or team who last confirmed the cog content is accurate.
      example: Tom Cranstoun
      notes: Names the maintainer responsible for ongoing accuracy.
      status: canonical
      profile: cog
    - name: provenanceOrigin
      type: string
      definition: How the content was created.
      example: human-directed
      validValues:
        - human-directed
        - ai-assisted
        - ai-generated
        - ai-manipulated
        - automated-fact-check
      notes: >-
        Declares creation method. Part of the provenance group. ai-generated and ai-manipulated carry the
        EU AI Act Article 50 distinction between machine-created content and human-origin content a machine
        materially altered; MXS-03 defines all five values normatively.
      status: canonical
      profile: core
    - name: provenanceUri
      type: string
      definition: >-
        Canonical URL of the file's AI-governance provenance cog, the hosted record that stands beside the file and
        holds the parties, frameworks, and every recorded action. Lets a machine reach the live, authoritative
        provenance chain without the chain embedded in the file itself.
      example: https://mx.allabout.network/blog/governance-when-ai-acts.mxprov.json
      notes: >-
        Points to a hosted provenance cog (the .mxprov.json carrier). Complements an embedded chain rather than
        replacing it: when both are present the embedded copy travels offline and this URL names the current canonical
        record. Part of the provenance group.
      status: canonical
      profile: core
    - name: workflowId
      type: string
      definition: >-
        Stable identifier of the workflow record that declares the boundary a document or a provenance chain was
        produced under: the tasks and authority given to the agent, the points where a human decides, and the
        residual risk accepted. Conventionally a slug naming the team and the process.
      example: survey-team-adaptive-interviewing
      notes: >-
        One record per workflow; a redesign updates the same record, a different workflow gets a different
        identifier. The workflow-record profile carries it as the record's own handle; any document or provenance
        record produced under that workflow carries the same value as a pointer back to it. Part of the provenance
        group.
      status: canonical
      profile: core
    - name: workflowRecord
      type: string
      definition: >-
        Where the workflow record named by workflowId lives: a repo-root-relative path or a URL, so a reader walks
        from a document or a provenance chain to the declared boundary in one step.
      example: workflows/survey-team-adaptive-interviewing.md
      notes: >-
        The pointer, not the record. Follows the refersTo convention for a path and the refersToExternal convention
        for a URL. Absent or null is an honest "no declared boundary", never a default. Part of the provenance
        group.
      status: canonical
      profile: core
    - name: residualRisk
      type: object
      definition: >-
        The risk the operator judges to remain after the controls a document or a provenance chain records: a level
        drawn from the security.riskLevel vocabulary, the reason that level remains, the role that accepted it, and
        when it was reviewed.
      example:
        level: low
        basis: Every model output is reviewed by the editor before it is filed; a misfiled draft is recoverable.
        acceptedBy: deployer
        reviewedAt: 2026-09-17
      notes: >-
        A declaration, never a computation, and never defaulted: absent means no residual-risk statement was made,
        not that the risk is low. Answers the question a reader of the boundary pointer asks next, after what the
        agent was allowed to do and what it did: what remains. A regime's own classification lives in its extension
        room (x-eu-ai-act.riskClassification); this is the regime-neutral statement. Part of the provenance group.
      status: canonical
      profile: core
      required: optional
    - name: residualRisk.level
      type: string
      definition: The residual-risk level, in the same vocabulary as security.riskLevel so one risk scale serves the action-cog, the workflow record and the chain.
      example: low
      validValues:
        - low
        - medium
        - high
        - critical
      notes: Required inside residualRisk; a block without a level is not a statement and a reader treats it as absent.
      status: canonical
      profile: core
      required: optional
    - name: residualRisk.basis
      type: string
      definition: One sentence stating why that level remains after the controls.
      example: Every model output is reviewed by the editor before it is filed; a misfiled draft is recoverable.
      notes: The reasoning a regulator reads first; without it the level is a number nobody can check.
      status: canonical
      profile: core
      required: optional
    - name: residualRisk.acceptedBy
      type: string
      definition: The role that accepted the residual risk, drawn from the provenance parties roles.
      example: deployer
      notes: A role, not a name; the named person behind the role is in parties[] or responsiblePerson.
      status: canonical
      profile: core
      required: optional
    - name: residualRisk.reviewedAt
      type: string
      definition: The date the residual-risk statement was last reviewed. ISO 8601 (YYYY-MM-DD).
      example: 2026-09-17
      notes: A statement with no review date is read as unreviewed; a periodic review updates it.
      status: canonical
      profile: core
      required: optional
    - name: aiUsageDeclarationUri
      type: string
      definition: >-
        The URL of the publisher's AI Usage Declaration that covers this document - the signed, scope-bounded record
        of what machines did and did not do in producing the work, per the Gathering's MX AI Usage Declaration note.
        The HTML carrier form is <link rel="ai-usage" href="..." type="application/json">.
      example: https://mx.allabout.network/AI-USAGE.json
      notes: >-
        The pointer, not the record: aiUsageDeclaration is the object a declaration page itself carries, and this
        field is how any other document names the declaration that governs it. A document-specific declaration takes
        precedence over the host-level one, so a page that has its own points here to the narrower record. Sibling of
        provenanceUri, which names the per-file provenance chain rather than the publisher-level disclosure.
      status: canonical
      profile: core
      required: optional
    - name: proofOfAuthorship
      type: object
      definition: >-
        A verifiable link between the named author and the artefact: a cryptographic signature, a trust-chain
        identifier such as a DID, or a published-by-known-entity assertion. Answers "I made this, and I can prove it."
      example:
        method: did
        identifier: did:web:allabout.network
        signature: z3FXQ...
      notes: >-
        Genuineness family (proofOfAuthorship, integritySignature, provenancePedigree). Any subset may be claimed;
        all three give the strongest trust signal. Aligns with W3C Verifiable Credentials and Signed Exchanges rather
        than inventing a proof format; the object's sub-keys follow the method named. Anchors the attestation signal
        in the artefact itself so it survives detachment from the registry.
      status: canonical
      profile: core
      required: optional
    - name: integritySignature
      type: object
      definition: >-
        A hash or cryptographic signature over the artefact's content that lets a reader detect tampering since
        publication. Answers "what you read is what was written."
      example:
        algorithm: sha-256
        covers: body
        value: 3b7e1f0c9a2d4e6f8b1c3d5e7f9a0b2c4d6e8f0a1b3c5d7e9f1a3b5c7d9e1f3a
      notes: >-
        Genuineness family. covers names what the digest was taken over: body (the prose body only, so metadata
        churn never invalidates it), file (the whole carrier), or a named range. A reader recomputes the digest and
        compares; a mismatch is evidence the copy was altered after publication. Aligns with RFC 9421 HTTP Message
        Signatures and Subresource Integrity for the algorithm and encoding vocabulary.
      status: canonical
      profile: core
      required: optional
    - name: attestationRecord
      type: string
      definition: >-
        The registry attestation record for this artefact, or a pointer to it, naming who published the artefact and
        when. Answers "who vouched for this, and where can I check?"
      example: https://reginald.example.com/records/provenance-and-the-regulator
      notes: >-
        Genuineness family, and the first of the four trust signals a reader meets: attestation (who published this),
        currency (is this the current version), freshness (is the publisher still standing behind it), corroboration
        (does an authoritative outside source say the same). Each is reported separately and none is collapsed into a
        single trust score. The value points AT an attestation record rather than embedding one, because the record is
        itself a data file conforming to a cog schema and carries its own signature, digest and inclusion proof. Named
        attestationRecord rather than attestation because that shorter name already carries a different meaning inside
        the security block, where it declares whether execution requires cryptographic attestation; one name meaning
        two things is the ambiguity MX exists to remove.
      status: canonical
      profile: core
      required: optional
    - name: attestationStatus
      type: string
      definition: >-
        Whether this artefact has been attested by a registry yet. Answers "has anyone vouched for this, and was that
        decision made deliberately?"
      example: unattested
      validValues:
        - unattested
        - pending
        - attested
        - withdrawn
      notes: >-
        Genuineness family, and deliberately distinct from attestationRecord: the record says WHERE the attestation is,
        this says WHETHER there is one. Both can be absent, and that is a third state - nobody has considered it. An
        explicit unattested is a considered position rather than an oversight, which is why the value exists instead of
        being inferred from a missing record. withdrawn is the state that matters most to a reader, because an
        attestation that once existed and was retracted is not the same as one that never existed.
      status: canonical
      profile: core
      required: optional
    - name: provenancePedigree
      type: object
      definition: >-
        The traceable chain from this artefact back to its source, including every transformation along the way,
        with the authority at each step. Answers "where did this come from, and through whom?"
      example:
        derivedFrom: https://mx.allabout.network/blog/source-post
        steps:
          - agent: human
            action: authored
            by: Tom Cranstoun
          - agent: ai-assisted
            action: edited
            by: Maxine
      notes: >-
        Genuineness family. The embedded, travelling form of the chain; provenanceUri names the hosted canonical
        record and the two complement each other. Aligns with W3C PROV-O for the agent-activity-entity shape and with
        C2PA Content Credentials for media carriers rather than defining a new derivation vocabulary.
      status: canonical
      profile: core
      required: optional
    - name: movedFrom
      type: string
      definition: Previous file path before content was relocated.
      example: datalake/knowledge/reference/field-definitions.md
      notes: Previous path. Used for redirect generation and link maintenance.
      status: canonical
      profile: migration
    - name: ld
      type: object
      definition: Inline JSON-LD structured data (Schema.org). Embeds structured data directly in YAML frontmatter.
      example:
        '@type': TechArticle
        name: MX Field Dictionary
      notes: Inline JSON-LD (Schema.org) in YAML frontmatter.
      status: canonical
      profile: core
    - name: readingLevel
      type: string
      definition: 'Content reading level. Values: beginner, intermediate, advanced, expert.'
      example: intermediate
      validValues:
        - beginner
        - intermediate
        - advanced
        - expert
        - general
        - technical
      notes: Helps agents recommend content based on user expertise.
      status: canonical
      profile: core
    - name: mx:name
      type: string
      definition: Cog name. Equivalent to name in YAML frontmatter.
      example: <meta name="mx:name" content="field-dictionary">
      notes: HTML equivalent of YAML title/name.
      status: canonical
      profile:
        - html
        - js
        - css
    - name: mx:version
      type: string
      definition: Version. Equivalent to version in YAML frontmatter.
      example: <meta name="mx:version" content="2.0">
      notes: HTML equivalent of YAML version.
      status: canonical
      profile:
        - html
        - js
        - css
    - name: mx:type
      type: string
      definition: Domain type classification.
      example: <meta name="mx:type" content="specification">
      status: canonical
      profile: html
    - name: mx:purpose
      type: string
      definition: Why this file exists.
      example: '@mx:purpose utility'
      notes: JSDoc and CSS comment contexts.
      status: canonical
      profile:
        - js
        - css
    - name: mx:audience
      type: string
      definition: Intended readership.
      example: '@mx:audience developer'
      notes: JSDoc and CSS comment contexts.
      status: canonical
      profile:
        - js
        - css
    - name: mx:stability
      type: string
      definition: 'Stability level. Values: stable, evolving, experimental, deprecated, archived, friable. friable means the file is regenerated from a source and must never be hand-edited; any given rendering is transient and is remade when its source changes.'
      example: '@mx:stability stable'
      validValues:
        - stable
        - evolving
        - experimental
        - deprecated
        - archived
        - friable
      status: canonical
      profile:
        - js
        - css
    - name: mx:category
      type: string
      definition: Cog category.
      example: <meta name="mx:category" content="standard">
      status: canonical
      profile:
        - html
        - js
        - css
    - name: mx:tags
      type: string
      definition: Discovery keywords as comma-separated string.
      example: <meta name="mx:tags" content="metadata, yaml, frontmatter">
      notes: Comma-separated string in non-YAML contexts.
      status: canonical
      profile:
        - html
        - js
        - css
    - name: mx:buildsOn
      type: string
      definition: Context dependencies as comma-separated cog names.
      example: '@mx:buildsOn cog-unified-spec, field-dictionary'
      status: canonical
      profile:
        - js
        - css
    - name: mx:documentedIn
      type: string
      definition: Path to companion documentation.
      example: '@mx:documentedIn ../docs/field-dictionary.cog.md'
      notes: Links code to its companion documentation.
      status: canonical
      profile:
        - js
        - css
    - name: mx:contextProvides
      type: string
      definition: What context this file provides to agents.
      example: '@mx:contextProvides "Validation utilities for frontmatter"'
      status: canonical
      profile:
        - js
        - css
    - name: reviewers
      type: array
      definition: Required reviewers for changes to this file.
      example:
        - '@senior-dev'
        - '@security-team'
      status: canonical
      profile: code-file
      required: false
    - name: mx:begin
      type: string
      definition: >-
        Opens an annotated code block. Value is the block tag (security-critical, performance-critical, compatibility,
        workaround, generated, legacy).
      example: // @mx:begin security-critical
      validValues:
        - security-critical
        - performance-critical
        - compatibility
        - workaround
        - generated
        - legacy
      status: canonical
      profile: code-inline
    - name: mx:end
      type: string
      definition: Closes an annotated code block. Value matches the opening tag.
      example: // @mx:end security-critical
      status: canonical
      profile: code-inline
    - name: mx:sensitive
      type: string
      definition: 'Line annotation marking sensitive data. Flags: no-log, no-expose.'
      example: const API_KEY = process.env.API_KEY; // @mx:sensitive no-log no-expose
      status: canonical
      profile: code-inline
    - name: mx:intentional
      type: string
      definition: Line annotation marking deliberate unusual code.
      example: await sleep(100); // @mx:intentional rate-limiting
      status: canonical
      profile: code-inline
    - name: mx:todo
      type: string
      definition: Line annotation for tasks to complete.
      example: // @mx:todo refactor Extract to separate function
      status: canonical
      profile: code-inline
    - name: mx:ai
      type: string
      definition: >-
        Line annotation with AI-specific instructions. Values: do-not-remove, do-not-modify, preserve-logic,
        explain-before-changing, generated, reviewed.
      example: '// @mx:ai do-not-remove This null check prevents crash in edge case #1234'
      status: canonical
      profile: code-inline
    - name: pages
      type: number
      definition: Number of pages in a document, book, or PDF.
      example: 42
      status: canonical
      profile: core
      required: false
    - name: cogs
      type: string
      definition: 'Canonical field: cogs.'
      status: canonical
      profile: cog
    - name: replaces
      type: string
      definition: 'Canonical field: replaces.'
      status: canonical
      profile: cog
    - name: machineOnly
      type: boolean
      definition: 'Canonical field: machineOnly.'
      status: canonical
      profile: any
    - name: supersededBy
      type: string
      definition: 'Canonical field: supersededBy.'
      status: canonical
      profile: cog
    - name: date
      type: string
      definition: Publication or event date. ISO 8601. Aligns with Dublin Core dc:date and Schema.org Date.
      alignsWith:
        - dc:date
        - schema:Date
      status: canonical
      profile: core
    - name: duration
      type: string
      definition: Time length in ISO 8601 duration format (PT1H30M). Aligns with Schema.org duration.
      alignsWith:
        - schema:duration
      status: canonical
      profile: core
    - name: format
      type: string
      definition: >-
        Media type or file format. Aligns with Dublin Core dc:format and Schema.org encodingFormat. Prefer IANA media
        types.
      alignsWith:
        - dc:format
        - schema:encodingFormat
      status: canonical
      profile: core
    - name: rights
      type: string
      definition: >-
        Rights statement or licence reference. Aligns with Dublin Core dc:rights and Schema.org license. Prefer SPDX
        identifiers.
      alignsWith:
        - dc:rights
        - schema:license
      status: canonical
      profile: core
    - name: conformsTo
      type: array
      definition: >-
        The specification(s) this document claims structural or format conformance against - a Schema.org type, a
        Dublin Core term set, an MX spec level. Aligns with Dublin Core dcterms:conformsTo.
      example:
        - https://schema.org/PresentationDigitalDocument
        - https://mx.allabout.network/specs/mx-core-level-1
      alignsWith:
        - dcterms:conformsTo
      status: canonical
      profile: core
      required: optional
    - name: trainingDataPolicy
      type: string
      definition: >-
        Whether and how this document's content may be used in AI training corpora - permitted, restricted, or
        conditional on attribution. Trust lens: states the terms under which the content may be reused for training.
      example: permitted-with-attribution
      notes: The narrative document-level form of the reuse-for-training policy. For the enumerated allowed/prohibited/conditional form and the folder-level and path-glob controls, see aiTraining, aiTrainingConditions, aiSensitivePaths, aiPermittedAreas, and aiProhibitedAreas.
      status: canonical
      profile: core
      required: optional
    - name: inLanguage
      type: string
      definition: >-
        Primary language of the document content, as a BCP 47 language tag (en, es, en-GB). Aligns with Schema.org
        inLanguage and Dublin Core dc:language.
      example: es
      alignsWith:
        - schema:inLanguage
        - dc:language
      status: canonical
      profile: core
    - name: currency
      type: string
      definition: >-
        The document's default currency for monetary references, as an ISO 4217 three-letter code (EUR, USD, GBP). The
        same code Schema.org priceCurrency uses.
      example: EUR
      alignsWith:
        - schema:priceCurrency
      status: canonical
      profile: any
    - name: dateFormat
      type: string
      definition: >-
        Human display convention for dates in the document body. Machine-read dates in frontmatter are always ISO 8601
        (YYYY-MM-DD); this field only declares how dates are shown to a reader.
      example: iso-8601
      validValues:
        - iso-8601
        - dmy
        - mdy
        - ymd
      default: iso-8601
      status: canonical
      profile: any
    - name: translationOfWork
      type: string
      definition: >-
        On a translated document, the canonicalUri of the source work it was translated from. Aligns with Schema.org
        translationOfWork.
      example: https://mx.allabout.network/letters/apology.md
      alignsWith:
        - schema:translationOfWork
      status: canonical
      profile: any
    - name: workTranslation
      type: array
      definition: >-
        On a source document, the canonicalUris of works that are translations of it (the inverse of
        translationOfWork). Aligns with Schema.org workTranslation.
      example:
        - https://mx.allabout.network/letters/apology-es.md
      alignsWith:
        - schema:workTranslation
      status: canonical
      profile: any
    - name: translator
      type: string
      definition: >-
        Who or what performed a translation: a person's name or a model identifier. Aligns with Schema.org translator.
      example: Maxine (claude-opus-4-8)
      alignsWith:
        - schema:translator
      status: canonical
      profile: any
    - name: displayName
      type: string
      definition: Human-friendly name. Aligns with FOAF displayName and Schema.org alternateName.
      alignsWith:
        - foaf:displayName
        - schema:alternateName
      status: canonical
      profile: core
    - name: schema
      type: string
      definition: 'Schema reference identifier. Context-dependent: Schema.org type URL, JSON Schema $id, database schema name.'
      status: canonical
      profile: core
    - name: validatesAgainst
      type: array
      definition: >-
        The schema(s) or spec(s) this document claims conformance against. Describes the document's claimed
        conformance (trust lens).
      example:
        - cog.meta.v1
        - mx.spec.v1
      notes: >-
        Imported from cog-spec v1.0; canon adopts camelCase per NDR-2026-02-16 (see field-triage-rubric.cog.md Section
        5 worked examples). Universal, not cog-specific - ruled IN - standard on the rubric's own table.
      status: canonical
      profile: core
      required: optional
    - name: contractFields
      type: array
      definition: >-
        The frontmatter fields that are contract-bearing - covered by this document's signature or attestation. A
        change to any listed field invalidates the signature; a change elsewhere does not.
      example:
        - title
        - description
        - version
      notes: >-
        Imported from cog-spec v1.0 (there as x-mx-contract-fields); promoted to first-class per field-triage-rubric.cog.md
        Section 5 - signing is a universal concern, not vendor-specific. Sibling of metadataFields.
      status: canonical
      profile: core
      required: optional
    - name: metadataFields
      type: array
      definition: >-
        The frontmatter fields that are mutable without invalidating the document's signature or attestation -
        editorial metadata such as created/modified dates, not normative content.
      example:
        - created
        - modified
      notes: >-
        Imported from cog-spec v1.0 (there as x-mx-metadata-fields); promoted to first-class per field-triage-rubric.cog.md
        Section 5. Sibling of contractFields.
      status: canonical
      profile: core
      required: optional
    - name: usage
      type: string
      definition: Usage classification. Free-form; prefer existing vocabularies (Schema.org usageInfo, Dublin Core audience).
      alignsWith:
        - schema:usageInfo
      status: canonical
      profile: core
    - name: classification
      type: string
      definition: Content classification identifier. Context-dependent; prefer existing taxonomies over local values.
      status: canonical
      profile: core
    - name: topic
      type: array
      definition: >-
        The specific subject-area classification of this document, distinct from the general-discovery tags array.
        Aligns with Schema.org about.
      example:
        - cog-format
        - mx-specification
      alignsWith:
        - schema:about
      status: canonical
      profile: core
      required: optional
    - name: speakable
      type: string
      definition: >-
        A voice-assistant-readable summary of this document, matching Schema.org's SpeakableSpecification intent -
        the passage a text-to-speech agent should read aloud.
      alignsWith:
        - schema:speakable
      status: canonical
      profile: core
      required: optional
    - name: entities
      type: array
      definition: >-
        The named things this document is about - people, organisations, products, places - each given as a stable
        identifier a machine can resolve (a Wikidata QID, an ORCID iD, an organisation's domain name) rather than a
        bare name. Aligns with Schema.org mentions; the HTML carrier form is the JSON-LD mentions property or an
        itemprop="mentions" microdata annotation.
      example:
        - https://www.wikidata.org/wiki/Q95
        - https://orcid.org/0000-0002-1825-0097
      alignsWith:
        - schema:mentions
      notes: >-
        Distinct from topic (subject areas) and tags (discovery keywords): entities are the specific named things, and
        the identifier is what makes the declaration checkable. A bare name is accepted but resolves to nothing.
        Defined in the Gathering's MX Core Metadata note section 7a.4 and read by the MX graph builder.
      status: canonical
      profile: core
      required: optional
    - name: doNotIndex
      type: boolean
      definition: Whether this document should be excluded from search-engine and agent indexing. A robots-noindex-style directive.
      example: false
      status: canonical
      profile: core
      required: optional
    - name: contentPolicy
      type: string
      definition: >-
        What a machine may do with this document's content at the point of reading it: a recognised token
        (summaries-allowed, full-extraction-allowed, extract-with-attribution, no-extraction, restricted) or a
        plain-language statement when no token fits. The inference-time half of the consumption policy;
        trainingDataPolicy and aiTraining govern the training half.
      example: extract-with-attribution
      notes: >-
        Carried in HTML as <meta name="mx:contentPolicy">, the per-page form of what the robots nosnippet and
        max-snippet directives express for search engines. A plain-language value is legitimate on an asset whose
        terms do not reduce to a token; the asset decorator writes the field into the binary's own carrier so the
        policy travels with it. Pairs with attribution, which states whether reuse must credit the source. Aligns
        with W3C ODRL in intent; no ODRL prefix is declared because the value is a token or prose, not an ODRL policy
        document.
      status: canonical
      profile: core
      required: optional
    - name: attribution
      type: string
      definition: >-
        Whether reuse of this document's content must credit its source. required means a citation or credit is a
        condition of reuse; requested means the publisher asks for one without making it a condition; not-required
        means none is expected.
      example: required
      validValues:
        - required
        - requested
        - not-required
      notes: >-
        Carried in HTML as <meta name="mx:attribution">. The credit itself comes from author and citeAs (or
        canonicalUri when no citeAs is declared); this field only states whether the credit is owed. Distinct from
        ai.attribution, which records the attribution of AI involvement in producing the content.
      status: canonical
      profile: core
      required: optional
    - name: contentRating
      type: string
      definition: >-
        The audience-suitability rating of this document's content, as a rating-scheme value a machine can act on
        before surfacing the content (general, mature, adult, or a named scheme's value such as PEGI 12). Aligns with
        Schema.org contentRating; the HTML carrier form is the native <meta name="rating"> tag.
      example: general
      alignsWith:
        - schema:contentRating
      notes: >-
        Absent means no rating is claimed, not that the content is suitable for everyone. Distinct from readingLevel
        (how hard the prose is to read) and audience (who the document is written for): a rating says whether the
        content may be shown to a given reader at all.
      status: canonical
      profile: core
      required: optional
    - name: reviewBy
      type: string
      definition: >-
        The date by which this document's content must next be reviewed for accuracy. Distinct from reviewCycle
        (the review cadence) - reviewBy is the specific next deadline.
      example: 2026-11-07
      status: canonical
      profile: core
      required: optional
    - name: supportContact
      type: string
      definition: Contact address (email, URL) for questions about this document's content. Operational-governance lens.
      example: info@cognovamx.com
      status: canonical
      profile: core
      required: optional
    - name: aiUsageDeclaration
      type: object
      definition: >-
        A structured AI-usage declaration conforming to the draft-cranstoun-mx-ai-usage-declaration Gathering draft
        spec - conformance level, review schedule, subject, and publisher. Trust lens.
      example:
        conformance:
          draft: draft-cranstoun-mx-ai-usage-declaration
          draftVersion: "1.0"
          level: 1
        reviewSchedule: P1Y
      notes: >-
        Top-level object; sub-keys follow the draft spec, not separately registered here. Used on AI-USAGE.md pages.
      status: canonical
      profile: core
      required: optional
    - name: accuracyCommitment
      type: string
      definition: Publisher's commitment to content accuracy.
      example: All factual claims verified against source documentation
      notes: >-
        Publisher-facing field. Part of the trust metadata group: mxCompliance, publisher, accuracyCommitment,
        correctionSla, reviewCycle.
      status: canonical
      profile: cog
      required: optional
    - name: correctionSla
      type: string
      definition: SLA for correcting errors in the cog content.
      example: 24 hours
      notes: Sets expectations for error correction urgency.
      status: canonical
      profile: cog
    - name: expires
      type: string
      definition: Expiry date for time-sensitive cogs. ISO 8601 format (YYYY-MM-DD).
      example: 2026-12-31T00:00:00.000Z
      notes: ISO 8601. For time-sensitive content. Review or archive after this date.
      status: canonical
      profile: cog
    - name: generate
      type: object
      definition: Generation instructions for AI agents. Describes how to regenerate this content if lost or outdated.
      example:
        prompt: Regenerate from source data
        source: quarterly-report.csv
      notes: Part of MX OS metadata. Enables content regeneration from metadata alone.
      status: canonical
      profile: cog
      required: optional
    - name: movedDate
      type: string
      definition: Date content was relocated. ISO 8601 format (YYYY-MM-DD).
      example: 2026-02-28T00:00:00.000Z
      notes: ISO 8601. When the content was relocated.
      status: canonical
      profile: migration
    - name: mxCompliance
      type: string-or-object
      definition: MX compliance level or detailed compliance metadata for a published cog.
      example: level-3
      notes: Declares MX compliance tier. Used with publisher, accuracyCommitment, and reviewCycle.
      status: canonical
      profile: cog
      required: optional
    - name: reviewCycle
      type: string
      definition: How often this cog's content is reviewed for accuracy.
      example: quarterly
      notes: Part of the trust metadata group. Helps agents assess content freshness expectations.
      status: canonical
      profile: cog
      required: optional
    - name: semantic
      type: string-or-object
      definition: >-
        Semantic quality level or detailed semantic metadata. Declares how well the cog uses semantic HTML and
        structured data.
      example: Schema.org JSON-LD
      notes: 'Part of the quality triad: accessibility, semantic, convergence.'
      status: canonical
      profile: cog
      required: optional
    - name: source
      type: string-or-array
      definition: Origin source material or input files. References where the content was derived from.
      example: brainstorm.md
      notes: Content provenance. Distinct from provenance block type (which tracks lineage chain).
      status: canonical
      profile:
        - cog
        - report
      required: optional
    - name: updateTriggers
      type: array
      definition: Conditions that trigger a cog update. Array of trigger descriptions.
      example:
        - specification-change
        - new-field-added
      notes: Events that should prompt a cog update.
      status: canonical
      profile: cog
  profiles:
    - name: core
      description: Fields that apply to all MX documents.
      header: |
        ---
        # --- Zone 1a: Identity ---
        title: "MX field dictionary"
        description: "Every canonical MX field with its definition, status, and profile."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        version: "1.0"
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: info-doc
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          status: active
        ---
      required:
        - title
        - description
        - author
        - created
        - modified
      recommended:
        - version
        - status
      optional:
        - tags
        - audience
        - purpose
        - license
        - maintainer
        - confidential
        - ownership
        - domain
        - segment
        - ai
        - contextProvides
        - aiAssistance
        - aiEditable
        - ld
        - readingLevel
        - runbook
        - contentType
        - name
        - type
        - resource
    - name: cog
      description: >-
        Fields specific to .cog.md files. Cogs are an optional layer on top of MX; the machine identifier is derived
        from the filename. This is the sole `cog` profile: scripts/cog-field-rules.js (the engine behind
        frontmatter-validator.js and cog-tools.js) reads ONLY this file directly for profiles, bypassing
        load-canon.js's multi-file merge - fields-data-cogs.yaml carries the cog-layer field DEFINITIONS
        (partOf, buildsOn, dependencies, refersTo, cogHeader) but declares no profile of its own.
      header: |
        ---
        # Carrier: .cog.md file
        # --- Zone 1a: Identity ---
