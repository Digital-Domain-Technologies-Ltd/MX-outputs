title: MX Field Dictionary — Open Standard (Core)
version: '6.25'
created: 2026-02-13T00:00:00.000Z
modified: '2026-09-19'
author: The Gathering
description: >-
  Open standard canonical MX metadata fields. The Gathering-owned core dictionary covering identity, classification,
  relationships, machine-readability infrastructure, folder metadata, cog contract, and non-YAML markup carriers. For
  carrier-format schemas (code/database/media) see fields-data-carriers.yaml. For CogNovaMX vendor extensions see
  cognovamx-fields.yaml.
mx:
  status: active
  license: MIT
  x-mx-category: standard
  partOf: mx-the-gathering
  tags:
    - fields
    - metadata
    - yaml
    - frontmatter
    - dictionary
    - vocabulary
    - standard
    - open
  audience:
    - machines
    - humans
  contentType: field-dictionary
  runbook: >-
    This is the universal metadata registry. Parse the fields array for every canonical field with name, type,
    definition, status, and profile. The blockTypes array defines block types and their fields. The carrierFormats array
    maps metadata to file types. The overlap-resolution section declares which field wins when two seem similar. The
    namespace-policy section defines three levels: standard (no prefix), MX-public (x-mx-), and MX-private (x-mx-p-).
    The prefix IS the policy.
  namespacePolicy:
    description: >-
      Three-level attribute namespace. Standard fields belong to The Gathering open standard. Extensions are namespaced
      to prevent pollution.
    adr: mx-canon/mx-maxine-lives/thinking/decisions/2026-02-14-attribute-namespace-policy.cog.md
    levels:
      - level: standard
        prefix: ''
        owner: The Gathering
        visibility: Universal — all implementations use these fields
        example: title, author, created, version, tags
        rule: No prefix. Defined by the open standard. All implementations honour them.
      - level: mx-public
        prefix: x-mx-
        owner: CogNovaMX
        visibility: Visible in published cogs. Implementation extension, not the open standard.
        example: x-mx-audienceSegment, x-mx-pipelineStage
        rule: x- signals extension. mx- signals whose. Visible to anyone reading the cog.
      - level: mx-private
        prefix: x-mx-p-
        owner: CogNovaMX
        visibility: Obfuscated. Only $MX_HOME registry holders can decode the value.
        example: x-mx-p-*
        rule: >-
          p- signals private. Values are hashed, encoded, or tokenised. The decode registry lives in $MX_HOME. Field
          names and their meanings are not documented publicly.
    convention: >-
      x- follows HTTP extension header convention. mx- identifies CogNovaMX. p- identifies private/obfuscated. The
      prefix is the policy — no additional visibility markers needed.
    namingConvention:
      rule: All field names use camelCase. Aligns with Schema.org and Dublin Core vocabulary conventions.
      ndr: mx-canon/mx-maxine-lives/registers/NDR/2026-02-16-camelcase-naming.cog.md
      date: 2026-02-16T00:00:00.000Z
      examples:
        correct:
          - readingLevel
          - buildsOn
          - blogState
          - contentType
          - partOf
        banned-snake:
          - reading_level
          - builds_on
          - blog_state
        banned-kebab:
          - reading-level
          - builds-on
          - blog-state
        unchanged:
          - title
          - author
          - created
          - version
          - tags
          - name
      enforcement:
        audit: npm run audit:metadata — reports violations in Section 9
        validator: node scripts/mx-validator.js — warns on new violations
      rationale: >-
        MX metadata is a vocabulary (like Schema.org), not markup (like HTML attributes). Vocabularies use camelCase.
        YAML has no preference — the convention comes from the consuming ecosystem.
    spelling-neutrality:
      rule: >-
        Prefer spelling-neutral field names. Where US/UK spelling differs, use an abbreviation or synonym that avoids
        the conflict.
      ndr: mx-canon/mx-maxine-lives/registers/NDR/2026-02-16-spelling-neutrality.cog.md
      date: 2026-02-16T00:00:00.000Z
      strategy:
        - 'Abbreviate: org (not organisation/organization). W3C Organization Ontology precedent.'
        - 'Follow standards: license (SPDX universal). Not licence.'
        - 'Use neutral synonyms: imagesAudited (not imagesAnalysed/imagesAnalyzed).'
      exceptions:
        - license — SPDX standard spelling. Universal across npm, GitHub, every package manager.
      rationale: >-
        MX is a global standard. Spelling-neutral names prevent regional debates and follow the Schema.org principle:
        when a neutral term is available, use it.
    context-specific-naming:
      rule: >-
        The name is the field in every carrier. YAML frontmatter uses camelCase; HTML, JSDoc, and CSS carry the same
        camelCase name after the mx: or @mx: prefix. Same field, same spelling; only the container changes (NDR-14).
      alignment: mx-canon/mx-maxine-lives/deliverables/mx-standards-alignment.cog.md
      ndr: mx-canon/mx-the-gathering/naming-decisions/ndr-14-camelcase-in-every-carrier.cog.md
      contexts:
        yaml:
          syntax: camelCase
          example: 'buildsOn: [cog-unified-spec]'
          rationale: Schema.org precedent. YAML is a data format — use the vocabulary's native naming.
          enforcement: mandatory
        html:
          syntax: 'camelCase with mx: prefix'
          example: <meta name='mx:contentType' content='field-dictionary'>
          rationale: The meta tag carries the field's own name; a reader compares strings and converts nothing.
          enforcement: mandatory (Gate 117, scripts/check-mx-carrier-names.cjs)
        jsdoc:
          syntax: 'camelCase with @mx: tag'
          example: '@mx:contentType script'
          rationale: 'The tag carries the field name; @mx: is the namespace, not a reason to respell.'
          enforcement: mandatory (Gate 117)
        css:
          syntax: 'camelCase with @mx: comment'
          example: /* @mx:contentType theme */
          rationale: 'Same as JSDoc: the comment carries the field name after the namespace prefix.'
          enforcement: mandatory (Gate 117)
        shell:
          syntax: 'camelCase in # key: value lines'
          example: '# buildsOn: [script-helper]'
          rationale: 'Comment-block frontmatter strips # prefix to produce valid YAML. Same naming as YAML context.'
          enforcement: mandatory
        xmp:
          syntax: 'mx: namespace prefix'
          example: mx:contentType, mx:audience
          rationale: XMP custom namespace convention. Registered namespace URI for MX metadata.
          enforcement: mandatory
        sidecar:
          syntax: camelCase in YAML (same as yaml context)
          example: '{ mx: { contentType: image, aiTraining: prohibited } }'
          rationale: Sidecar files are standard YAML. Same naming rules as YAML frontmatter.
          enforcement: mandatory
        sql-comment:
          syntax: camelCase in -- @mx comment blocks
          example: |-
            -- @mx
            -- purpose: User account storage
            -- @mx:end
          rationale: SQL comment block stripped of -- prefix produces valid YAML.
          enforcement: mandatory
      namespace-equivalence:
        description: >-
          The mx: object in YAML is equivalent to mx:* prefix in HTML/JS/CSS. Both represent The Gathering's standard
          namespace.
        yaml-form: |
          mx:
            contentType: field-dictionary
            runbook: "Parse the fields array"
        html-form: |
          <meta name="mx:contentType" content="field-dictionary">
          <meta name="mx:runbook" content="Parse the fields array">
        note: >-
          The mx: namespace belongs to The Gathering (open standard), not CogNovaMX. See governance section in
          mx-standards-alignment.cog.md.
      precedents:
        - standard: Schema.org
          pattern: camelCase properties (datePublished, servesCuisine)
          mx-applies: YAML frontmatter fields
        - standard: Dublin Core
          pattern: 'dc: object in YAML, <meta name=''dc:title''> in HTML'
          mx-applies: 'mx: object in YAML, <meta name=''mx:name''> in HTML'
        - standard: Open Graph
          pattern: 'og: object in frontmatter, <meta property=''og:title''> in HTML'
          mx-applies: Same pattern — context determines syntax
        - standard: HTML dataset API
          pattern: data-user-name (HTML) → dataset.userName (JS)
          mx-applies: mx:contentType (HTML) is contentType (YAML under mx:) - the same name, no conversion
      enforcement-levels:
        mandatory:
          - 'YAML frontmatter: camelCase required'
          - 'HTML meta tags: camelCase required (Gate 117)'
          - 'JSDoc and CSS comments: camelCase required (Gate 117)'
        rationale: One spelling in every carrier, so the served page and the source agree by construction.
  sources:
    merged-from:
      - path: datalake/knowledge/reference/mx-metadata-standards.md
        contribution: Field definitions, validation rules, audience/purpose semantics
        status: absorbed — file removed 2026-03-03
      - path: datalake/knowledge/reference/frontmatter-field-audit.md
        contribution: Usage counts across 1,065 files, naming inconsistencies, profile groupings
        status: absorbed — file removed 2026-03-03
      - path: datalake/knowledge/specifications/index-of-yaml-attributes-used.md
        contribution: Auto-generated attribute index from .mx.yaml.md folder metadata files
      - path: mx-canon/mx-the-gathering/field-dictionary-guide.cog.md
        contribution: How to add new fields procedure, vendor extension guidance
        date: 2026-03-01T00:00:00.000Z
        status: absorbed — file removed 2026-03-03
      - path: mx-canon/ssot/writing-guides/mx-yaml-md-guide.md
        contribution: Folder metadata inheritance model, identity vs inheritable fields, allowed values
        date: 2026-03-01T00:00:00.000Z
      - path: explain.md
        contribution: Metadata architecture overview — two-zone model, inheritance, profiles, namespace policy
        date: 2026-03-03T00:00:00.000Z
        status: absorbed — file removed 2026-03-03
      - path: mx-canon/mx-the-gathering/specifications/mx-code-metadata-spec.md
        contribution: >-
          Code metadata — repository, file, function, class, inline annotations, dependency, environment, test, API
          fields and carrier formats
        date: 2026-03-03T00:00:00.000Z
      - path: mx-canon/mx-the-gathering/specifications/mx-media-metadata-spec.md
        contribution: >-
          Media metadata — sidecar files, embedded metadata alignment, image, video, audio, document, rights,
          collections fields and carrier formats
        date: 2026-03-03T00:00:00.000Z
      - path: mx-canon/mx-the-gathering/specifications/mx-database-metadata-spec.md
        contribution: >-
          Database metadata — database, schema, table, column, relationship, index, view, query, procedure, dictionary,
          classification fields
        date: 2026-03-03T00:00:00.000Z
  defaultsPolicy:
    description: >-
      Two-zone frontmatter model. Zone 1 (top-level): title, description, author, created, modified, version — always
      explicit, never inside mx: block. Zone 2 (mx: block): all other fields. Optional Zone 2 fields with defined
      defaults may be omitted; tools treat absent optional fields as their documented default value.
    rule: >-
      Only optional fields may have defaults. If an optional field's value matches its default, the field may be omitted
      to reduce frontmatter size. Tools must handle absent optional fields by applying the documented default.
    zones:
      top-level:
        fields:
          - title
          - description
          - author
          - created
          - modified
          - version
        rule: Always explicit. These are document identity fields and never move under mx:.
      mx:
        fields: >-
          All other MX-operational fields (status, contentType, x-mx-category, tags, audience, runbook, execute, ai* fields,
          etc.)
        rule: Optional fields with documented defaults may be omitted when matching their default value.
    always-explicit:
      - field: title
        requirement: required
        reason: Identity — every document needs a name
      - field: description
        requirement: required
        reason: Discovery — search engines and AI agents need this
      - field: author
        requirement: required
        reason: Attribution — immutable provenance
      - field: created
        requirement: required
        reason: Timestamp — immutable creation date
      - field: modified
        requirement: required
        reason: Timestamp — last modification date
      - field: version
        requirement: recommended
        reason: Version tracking — explicit is safer than assumed
      - field: status
        requirement: recommended
        reason: Lifecycle — always declare your document state
    fields-with-defaults:
      - field: confidential
        default: false
        absent-means: Document is public
      - field: aiAssistance
        default: welcome
        absent-means: AI agents are welcome to assist
      - field: aiEditable
        default: false
        absent-means: AI agents should not edit this content
      - field: aiGenerationAllowed
        default: true
        absent-means: AI generation is permitted
      - field: aiGenerationReviewRequired
        default: true
        absent-means: AI-generated content requires human review
  contentTypeToProfile:
    info-doc: core
    field-dictionary: core
    specification: core
    briefing-doc: core
    guide: core
    action-doc: cog
    cog: cog
    eds-block: cog
    certificate-of-genuineness: cog
    book-chapter: book
    book-appendix: book
    blog-post: blog
    blog: blog
    contact: contact
    direct-message: contact
    personal-message: contact
    folder-metadata: folder
    report: report
    session-report: report
    audit: audit
    event: event
    migration: migration
    script: script
    error-page: core
    component:provenanceBadge: component
    component:objectCard: component
    component:relationshipLine: component
    component:verificationPanel: component
    component:narrativeLayer: component
    component:gridMount: component
    component:signalBar: component
    component:objectInspector: component
  validationPolicy:
    keywords:
      - '@context'
    descriptionMaxLength: 160
    dateFields:
      - created
      - modified
      - publicationDate
      - lastContact
      - movedDate
      - expires
      - maintainedDate
    scoreFields:
      - performanceScore
      - llmSuitabilityScore
      - seoScore
    lenientEnums:
      - field: blocks
        reason: >-
          Many cogs use `blocks:` as free-text prose description. The spec reserves it for block-type declarations.
          Clean up cogs, then remove this lenient entry.
    excludeFromTopLevel:
      rule: 'Auto: any field whose name contains ''.'''
  deprecations:
    - old: attestation
      replacement: attestationRecord
      notes: >-
        Top-level attestation carried two incompatible meanings (a record pointer and a status) while the name was
        already taken inside the security block for an execution policy. Split into attestationRecord and
        attestationStatus; mx.security.attestation is unaffected.
    - old: provenanceAuthor
      replacement: author
      notes: MX defers to Schema.org; the Zone 1 author field already carries this meaning.
    - old: provenancePublisher
      replacement: publisher
      notes: MX defers to Schema.org; the publisher field already carries this meaning.
    - old: name
      replacement: title
      notes: Use `title` for document identity; `name` is reserved for nested field definitions.
    - old: confidentiality
      replacement: confidential
      notes: Noun form confused readers; boolean flag is clearer.
    - old: inherit
      replacement: inherits
      notes: Plural form matches the shape (a list of inheritance sources).
    - old: inheritFrom
      replacement: inherits
    - old: issued
      replacement: publicationDate
      notes: Explicit semantic name.
    - old: venue
      replacement: location
      notes: Generic term covers more cases.
    - old: prose-source
      replacement: inherits
    - old: proseSource
      replacement: inherits
    - old: lastVerified
      replacement: maintainedDate
    - old: verifiedBy
      replacement: maintainedBy
    - old: category
      replacement: x-mx-category
      notes: CogNovaMX cog-taxonomy classifier, not a Gathering open-standard field. Moved to cognovamx-fields.yaml under the x-mx-public profile.
    - old: wordCount
      replacement: x-mx-wordCount
      notes: >-
        A vendor entry carries its prefix in the dictionary as in the document; the estate wrote the prefixed name
        while the dictionary declared the bare one.
    - old: canonicalSource
      replacement: x-mx-canonicalSource
      notes: >-
        The generators write and the friable check reads the prefixed name; the bare entry was a stub with no
        definition.
    - old: x-mx-execute
      replacement: execute
      notes: >-
        The action block that makes a cog an action-doc is the open-standard field execute, as the Gathering's cog
        specification, the core-metadata draft and Appendix M name it. The vendor name entered the estate through a
        drift correction that recorded what the cogs carried. Every x-mx- field is stripped from a published page
        (ADR 63), so a cog published with the vendor name reaches its reader with no action block. ADR 70.
    - old: priority
      replacement: x-mx-priority
      notes: >-
        A rank on a work item inside a CogNovaMX workflow, not a property of the document: a vendor enum, declared in
        cognovamx-fields.yaml under the x-mx-public profile. The contact-profile entry that survived the 2026-04-17
        cull is retired with this rename.
    - old: riskLevel
      replacement: security.riskLevel
      notes: >-
        The execution-danger classification lives inside the open security block, where a reader deciding whether to
        execute already looks; the bare top-level convenience is retired.
    - old: x-mx-mount-type
      replacement: x-mx-mountType
      notes: >-
        NDR-14: the vendor prefix keeps its hyphens and the name after it is camelCase, in a frontmatter key, a
        script that reads it, and a carrier form alike. Same meaning, one spelling.
    - old: x-mx-mount-swappable
      replacement: x-mx-mountSwappable
      notes: Renamed with x-mx-mount-type under NDR-14.
    - old: x-mx-mount-upstream
      replacement: x-mx-mountUpstream
      notes: Renamed with x-mx-mount-type under NDR-14.
    - old: x-mx-riskLevel
      replacement: security.riskLevel
      notes: >-
        Promoted from the vendor layer into the open security block by Gathering decision, reversing the earlier
        vendor move: a machine that ingests a runnable cog needs the blast radius before it runs it, so the
        declaration travels with the artefact rather than staying internal. Narrative in field-cull-log.md.
    - old: x-mx-reversibility
      replacement: security.reversibility
      notes: >-
        Promoted with x-mx-riskLevel; the three task properties that place the human-agent boundary sit together in
        the open security block.
    - old: x-mx-verifiability
      replacement: security.verifiability
      notes: Promoted with x-mx-riskLevel; see security.reversibility.
    - old: x-mx-contextRequired
      replacement: contextRequired
      notes: >-
        Promoted into the open standard by Gathering decision as the inward half of the Context Declaration pair:
        what a machine must read before it can use this document. contextProvides is the outward half.
    - old: x-mx-contextProvides
      replacement: contextProvides
      notes: >-
        The open standard's own contextProvides is the field the Context Declaration principle names; the vendor form
        was the earlier cull's move of the same field out of the standard, reversed by Gathering decision. No
        Gathering profile requires a vendor name once this rename completes. Narrative in field-cull-log.md.
    - old: contentState
      replacement: x-mx-contentState
      notes: CogNovaMX editorial-workflow enum, distinct from the standard status field; vendor-specific.
    - old: x-mx-aiAssistance
      replacement: aiAssistance
      notes: >-
        aiAssistance is an open-standard field declared in this dictionary; the x-mx- form was a
        vendor prefix on a standard name, which the extensions standard forbids. ADR 63.
    - old: x-mx-aiEditable
      replacement: aiEditable
      notes: >-
        aiEditable is an open-standard field declared in this dictionary; the x-mx- form was a
        vendor prefix on a standard name, which the extensions standard forbids. ADR 63.
    - old: adr
      replacement: x-mx-adr
      notes: CogNovaMX Architecture Decision Record registry pointer; vendor-specific.
    - old: ndr
      replacement: x-mx-ndr
      notes: CogNovaMX Naming Decision Record registry pointer; vendor-specific.
    - old: bdr
      replacement: x-mx-bdr
      notes: CogNovaMX Business Decision Record registry pointer; vendor-specific.
  blockTypes:
    - name: prose
      implicit: true
      description: Human-readable narrative. The markdown body of every cog. Never declared in YAML — it is implicit.
    - name: essence
      implicit: false
      description: Binary content (images, PDFs, audio, video, compiled assets). Encoded as base64 or a pointer.
      sizeRule: 2kb or smaller = embedded base64. Over 2kb = pointer with checksum.
      fields:
        - name: type
          type: string
          required: true
          description: MIME type (e.g., image/png, application/pdf, audio/mpeg)
        - name: encoding
          type: string
          required: true
          validValues:
            - base64
            - pointer
          description: How binary content is stored
        - name: size
          type: number
          required: true
          description: Content size in bytes
        - name: content
          type: string
          required: false
          description: Base64-encoded content (when encoding is base64)
        - name: location
          type: string
          required: false
          description: File path to binary content (when encoding is pointer)
        - name: checksum
          type: string
          required: false
          description: SHA-256 checksum for verification (when encoding is pointer)
    - name: definition
      implicit: false
      description: Standards conformance declarations. The cog's backward-compatibility statement and contract with readers.
      hierarchical: true
      hierarchyNote: Document-level definition applies to all blocks. Per-block definition overrides for that block only.
      fields:
        - name: standards
          type: array
          required: true
          description: Array of conformance declarations
        - name: standards[].name
          type: string
          required: true
          description: Standard name (e.g., The Gathering, Schema.org, WebMCP)
        - name: standards[].version
          type: string
          required: true
          description: Standard version (semantic versioning)
        - name: standards[].scope
          type: string
          required: true
          description: What this standard applies to (e.g., cog metadata format, product metadata)
    - name: action
      implicit: false
      description: >-
        Executable instructions. Presence of an execute object makes a cog into an action-doc. See execute fields in the
        fields array.
      note: The action block IS the execute object in YAML frontmatter. Documented as execute.* fields in this dictionary.
    - name: code
      implicit: false
      description: >-
        Source code embedded in the cog. Machine-addressable — a reader can extract and execute it. Unlike fenced code
        blocks in prose (display only).
      fields:
        - name: language
          type: string
          required: true
          description: Programming language (e.g., javascript, python, bash)
        - name: content
          type: string
          required: true
          description: Source code content
        - name: purpose
          type: string
          required: false
          description: What this code does
    - name: html
      implicit: false
      description: >-
        HTML content. May reference WebMCP for embedded routines. Can carry interactive widgets, forms, or
        visualisations.
      interBlockAccess: >-
        An HTML block using WebMCP can access all other blocks in the cog — reading essence content, querying code
        blocks, rendering provenance. Governed by security block and SOP policy.
      fields:
        - name: content
          type: string
          required: true
          description: HTML markup
        - name: standards
          type: array
          required: false
          description: Conformance declarations (e.g., WebMCP)
    - name: security
      implicit: false
      description: >-
        Trust and execution policy. Readers consult the security block to determine whether to execute action blocks or
        render HTML blocks.
      fields:
        - name: attestation
          type: string
          required: false
          validValues:
            - required
            - optional
          description: Whether cryptographic attestation is required
        - name: execution
          type: string
          required: false
          validValues:
            - sandboxed
            - unrestricted
          description: Execution environment constraint
        - name: trustLevel
          type: number
          required: false
          description: Numeric trust tier (1-3)
        - name: policy
          type: string
          required: false
          description: Free text policy statement
        - name: riskLevel
          type: string
          required: false
          validValues:
            - low
            - medium
            - high
            - critical
          description: >-
            Execution danger classification. Distinct from trustLevel (provenance quality). low = read-only, no side
            effects. medium = writes files or calls APIs. high = modifies system state, handles credentials. critical =
            destructive operations, financial transactions — SHOULD have a guardrail gate. With reversibility and
            verifiability, one of the three task properties a reader weighs before deciding whether to execute; riskLevel
            carries the stakes.
        - name: reversibility
          type: string
          required: false
          validValues:
            - reversible
            - correctable
            - irreversible
          description: >-
            Whether an error in the action, or the action itself, can be undone before serious harm. reversible = undone
            by a deterministic step with no lasting effect (a dry run, a read, an edit under version control).
            correctable = corrected before harm at a cost, through a stated recovery procedure (a re-run, a manual
            re-code, a revert with side effects). irreversible = the effect stands (a send, a payment, a deletion outside
            version control, a publish to a cache). An irreversible action at riskLevel high or critical SHOULD sit
            behind a guardrail gate and name it in security.guardrail, the check the riskLevel definition asks for and
            cannot itself express.
        - name: verifiability
          type: string
          required: false
          validValues:
            - inspectable
            - sampled
            - opaque
          description: >-
            Whether a qualified person can inspect the action's output and identify failure. inspectable = the output
            can be read in full and a failure recognised by a competent reviewer. sampled = the output is too large or
            too numerous to read in full, so failure is found by sampling or by a test. opaque = the output cannot be
            judged by inspection; failure is found only from its consequences. Human approval offers weak protection
            when the reviewer cannot identify failure, so an opaque output is a reason to keep authority with the human
            rather than a reason to add a sign-off. Delegation can rise when outputs are inspectable, errors are
            recoverable, and stakes are bounded.
        - name: guardrail
          type: string
          required: false
          validValues:
            - human-approval
            - dry-run-first
            - allowed-roles
            - sandboxed
          description: >-
            The check that stands between a reader and execution of this action. human-approval = a named person
            gives an explicit go-ahead before the effect lands (the Human-in-Command gate). dry-run-first = the action
            is rehearsed with no effect and the rehearsal reviewed before the real run. allowed-roles = only the roles
            listed in allowedRoles may execute, and the executing surface verifies the role. sandboxed = the action
            runs under execution: sandboxed, so its effect is confined. An action declaring reversibility irreversible
            at riskLevel high or critical names its guardrail here; a reader that finds none declared treats the action
            as one it may not run unattended. The free text of policy carries any detail the enum cannot.
        - name: scope
          type: object
          required: false
          description: >-
            Runtime scope constraints. Declares what the cog is permitted to touch when it executes. Omission means
            unspecified (reader applies its own policy), not unrestricted.
          fields:
            - name: filesystem
              type: array
              required: false
              description: Glob patterns of allowed filesystem paths (e.g. [scripts/**, mx-outputs/pdf/**])
            - name: network
              type: string
              required: false
              validValues:
                - none
                - local
                - external
              description: Network access permitted during execution
            - name: dataBoundary
              type: string
              required: false
              validValues:
                - user
                - team
                - organisation
              description: Whose data the cog may access
            - name: maxRecords
              type: number
              required: false
              description: Maximum records per operation — prevents bulk extraction
            - name: allowedOperations
              type: array
              required: false
              validValues:
                - read
                - write
                - create
                - delete
                - execute
              description: Permitted filesystem operations
        - name: audit
          type: object
          required: false
          description: Audit trail requirements. Declares what should be logged when the cog executes.
          fields:
            - name: logLevel
              type: string
              required: false
              validValues:
                - full
                - standard
                - minimal
                - none
              description: Granularity of audit logging
            - name: retention
              type: string
              required: false
              description: How long to retain audit records (e.g. 30d, 90d, 1y, permanent)
            - name: includeInputs
              type: boolean
              required: false
              description: Whether to log input parameters
            - name: includeOutputs
              type: boolean
              required: false
              description: Whether to log output results
        - name: dataProtection
          type: object
          required: false
          description: Data protection policy for cog outputs. Declares sensitivity classification and redaction rules.
          fields:
            - name: outputClassification
              type: string
              required: false
              validValues:
                - public
                - internal
                - confidential
                - restricted
              description: Sensitivity classification of the cog's outputs
            - name: prohibitedFields
              type: array
              required: false
              description: Field names that must never appear in outputs (e.g. [ssn, creditCard, apiKey, password])
            - name: redaction
              type: string
              required: false
              validValues:
                - auto
                - manual
                - none
              description: Redaction mode for sensitive content in outputs
            - name: piiHandling
              type: string
              required: false
              validValues:
                - mask
                - hash
                - omit
                - pass-through
              description: How personally identifiable information is treated in outputs
        - name: rateLimit
          type: object
          required: false
          description: Rate limiting constraints. Prevents runaway execution and abuse.
          fields:
            - name: maxCalls
              type: number
              required: false
              description: Maximum number of invocations within the time window
            - name: window
              type: string
              required: false
              description: Time window for rate limiting (e.g. 1h, 1d, 1w)
            - name: cooldown
              type: string
              required: false
              description: Minimum gap between consecutive calls (e.g. 5m, 1h)
            - name: scope
              type: string
              required: false
              validValues:
                - perUser
                - perAgent
                - global
              description: Scope of rate limit tracking
        - name: allowedRoles
          type: array
          required: false
          description: >-
            Roles permitted to execute this cog. Bridges the guardrail pattern — declares which roles the gate should
            verify.
    - name: sop
      implicit: false
      virtual: true
      description: >-
        Standard Operating Procedures. Merged at read-time from the uber doc (UBER.cog.md). Does not exist in the cog
        file on disk.
      fields:
        - name: scope
          type: string
          required: true
          description: What this SOP applies to (all-cogs, html-blocks, domain-specific)
        - name: instructions
          type: string
          required: true
          description: Procedure instructions (multi-line text)
    - name: provenance
      implicit: false
      description: Origin and lineage — where the content came from, how it was derived, what transformations were applied.
      fields:
        - name: origin
          type: string
          required: false
          description: URL of original source
        - name: derivedFrom
          type: string
          required: false
          description: Source cog reference
        - name: method
          type: string
          required: false
          description: Transformation description
        - name: date
          type: string
          required: false
          description: Derivation date (ISO 8601)
    - name: version
      implicit: false
      description: Version history and changelog within the cog. Complements the top-level version field with detailed history.
      fields:
        - name: history
          type: array
          required: true
          description: Array of version entries
        - name: history[].version
          type: string
          required: true
          description: Version number (semver)
        - name: history[].date
          type: string
          required: true
          description: Release date (ISO 8601)
        - name: history[].changes
          type: string
          required: true
          description: Description of changes
  carrierFormats:
    - format: .cog.md
      metadataLocation: YAML frontmatter between --- delimiters
      mxIdentity: Standard cog fields in YAML
      nativeBlocks: Markdown body = prose block
      parsingRule: Standard YAML parser reads frontmatter
      backwardCompatible: true
      narrativeSection: 'Carrier: YAML Frontmatter'
    - format: .cog.html
      metadataLocation: <meta> tags in <head>
      mxIdentity: <meta name="mx:*"> tags, data-mx-* attributes on elements
      nativeBlocks: Schema.org JSON-LD = definition, <meta name='description'> = prose excerpt, <main> = essence
      parsingRule: 'Parse <meta> tags; strip the mx: prefix; the remainder is the camelCase field name (no conversion)'
      backwardCompatible: true
      note: Browsers ignore unknown <meta> names. Can embed <style> and <script> with their own native metadata.
      pointerPattern: <link rel="mx" href="page.cog.md">
      narrativeSection: 'Carrier: HTML'
    - format: .cog.js
      metadataLocation: JSDoc comment block (/** ... */)
      mxIdentity: '@mx: tags in JSDoc'
      nativeBlocks: '@description = prose, @param/@returns = definition, function bodies = code (implicit)'
      parsingRule: 'Parse JSDoc block; extract @mx: prefixed tags; value follows tag on same line'
      backwardCompatible: true
      note: JavaScript runtimes ignore JSDoc comments
      narrativeSection: 'Carrier: JavaScript/TypeScript'
    - format: .cog.css
      metadataLocation: /* */ comment block at file top
      mxIdentity: '@mx: tags in CSS comments'
      nativeBlocks: File description = prose, :root custom properties = definition
      parsingRule: 'Parse opening comment block; extract @mx: prefixed tags'
      backwardCompatible: true
      note: CSS processors ignore comment content
      narrativeSection: 'Carrier: CSS'
    - format: .cog.png/.cog.jpg
      metadataLocation: EXIF/XMP metadata
      mxIdentity: MX XMP fields in custom namespace
      nativeBlocks: Existing EXIF = provenance
      parsingRule: 'Read XMP; extract mx: namespace fields'
      backwardCompatible: true
      narrativeSection: 'Carrier: Images and Media'
    - format: shell scripts
      metadataLocation: '# --- comment block after shebang'
      mxIdentity: 'Standard fields in # key: value lines'
      nativeBlocks: Script body = code (implicit)
      parsingRule: 'Strip leading # and one space from each line between # --- delimiters. Result is valid YAML.'
      backwardCompatible: true
      applicability: 'Any #-comment language: bash, python, ruby, perl, dockerfiles, YAML configs'
      narrativeSection: 'Carrier: Shell Scripts'
    - format: .mx.yaml (media sidecar)
      metadataLocation: Standalone YAML sidecar file alongside media asset
      mxIdentity: 'Standard YAML with mx: block'
      nativeBlocks: Sidecar extends or overrides embedded metadata (EXIF/IPTC/XMP)
      parsingRule: 'Standard YAML parser. File naming: {assetname}.mx.yaml for individual assets, _mx.yaml for directory defaults.'
      backwardCompatible: true
      narrativeSection: 'Carrier: Media Sidecar'
    - format: mx.yaml (code repository)
      metadataLocation: mx.yaml or .mx/config.yaml at repository root
      mxIdentity: Standard YAML with project, context, stack, conventions, ai properties
      nativeBlocks: Repository-level metadata inherited by all files
      parsingRule: 'Standard YAML parser. Discovery order: mx.yaml, .mx/config.yaml, package.json[mx], pyproject.toml[tool.mx]'
      backwardCompatible: true
      narrativeSection: 'Carrier: Code Repository'
    - format: database sidecars
      metadataLocation: mx.database.yaml, {name}.schema.yaml, {name}.table.yaml, {name}.view.yaml, {name}.query.yaml
      mxIdentity: Standard YAML describing database objects
      nativeBlocks: Database hierarchy metadata
      parsingRule: 'Standard YAML parser. Also supports inline SQL comments: -- @mx ... -- @mx:end'
      backwardCompatible: true
      narrativeSection: 'Carrier: Database Sidecar'
  overlap-resolution:
    - fields:
        - tags
        - keywords
      winner: tags
      reason: tags is canonical. Discovery keywords for AI and search.
    - fields:
        - words
        - tags
      overlap: false
      reason: >-
        Different concerns. words is a spell-checker dictionary list in ROUTING.cog.md concepts — it tells aspell which
        terms are valid MX vocabulary. tags is for document discovery. A cog can have tags: [routing, agent] and the
        routing concept can have words: [routing] — different purposes.
    - fields:
        - keyFields
        - tags
      overlap: false
      reason: >-
        Different concerns. keyFields is a ROUTING.cog.md route hint — it tells agents which YAML fields matter most
        when reading files in that folder. tags is for discovery. keyFields says 'look at these fields', tags says 'find
        me by these terms'.
    - fields:
        - audience
        - audience.primary
      winner: audience
      reason: >-
        audience is the canonical top-level field. audience.primary is a legacy namespace variant from folder metadata.
        Use audience.
    - fields:
        - audience
        - applicability
      overlap: false
      reason: >-
        Different questions. audience says who the content is written for; applicability says under what conditions the
        content is in force. A document can be written for developers and apply only in the EU on releases 3 and above.
        A reader filtering a corpus for itself evaluates applicability; a reader choosing a register reads audience.
    - fields:
        - applicability.jurisdiction
        - inLanguage
      overlap: false
      reason: >-
        Different concerns. inLanguage declares the language of the prose body (BCP 47) and never a place.
        applicability.jurisdiction declares the legal or regulatory regime the content is in force in. German prose can
        be in force in Austria, and EU-wide content can be published in English.
    - fields:
        - applicability.jurisdiction
        - spatialCoverage
      overlap: false
      reason: >-
        Different questions, and MX defers on the second. Schema.org spatialCoverage says what place the content is
        about; applicability.jurisdiction says where the content is in force. A UK-authored guide about Japanese
        planning law has spatialCoverage Japan and jurisdiction GB. Use the Schema.org field for subject matter.
    - fields:
        - applicability.effectiveUntil
        - expires
      overlap: false
      reason: >-
        Different consequences. applicability.effectiveUntil is a hard boundary - past it the content does not apply.
        expires is a review-or-archive prompt and leaves the content applicable until someone acts on it. A document
        can carry both, and effectiveUntil is the one a reader enforces.
    - fields:
        - applicability.productVersion
        - version
      overlap: false
      reason: >-
        Different subjects. version is the revision of this document. applicability.productVersion is the range of
        releases of the thing the document describes. A version 4 document can describe product releases 2 and 3.
    - fields:
        - created
        - date
        - creation-date
      winner: created
      reason: created is canonical.
    - fields:
        - modified
        - lastUpdated
        - lastmod
        - last-updated
      winner: modified
      reason: modified is canonical.
    - fields:
        - author
        - createdBy
      winner: author
      reason: author is canonical.
    - fields:
        - refersTo
        - related_files
        - related-files
        - related-documents
        - relatedDocuments
        - related-documentation
      winner: refersTo
      reason: refersTo is canonical.
    - fields:
        - partOf
        - part-of
      winner: partOf
      reason: partOf is canonical (camelCase).
    - fields:
        - coOwnership
        - co-ownership
      winner: coOwnership
      reason: coOwnership is canonical (camelCase).
    - fields:
        - org
        - organisation
        - organization
      winner: org
      reason: 'Neutral abbreviation. Avoids US/UK spelling entirely. W3C Organization Ontology uses org: prefix. NDR #3.'
    - fields:
        - version
        - document-version
      winner: version
      reason: version is canonical.
    - fields:
        - mx:contextProvides
        - mx:contextProvides
        - mx-ai-contextProvides
      winner: mx:contextProvides
      reason: 'mx:contextProvides is canonical (camelCase, mx: prefix).'
    - fields:
        - status
        - blogState
      overlap: false
      reason: >-
        Different scopes. status is the generic lifecycle field (core profile, 18 values). blogState is blog-specific
        (draft, review, published). Use the profile-specific field when available.
    - fields:
        - inherits
        - inheritable
      winner: both
      reason: >-
        Different scopes. inherits (string, profile: any) declares which file this document extends. inheritable (array,
        profile: folder) declares which fields child folders may inherit. Both are canonical — they solve different
        problems.
    - fields:
        - contentType
        - cogType
      overlap: false
      reason: >-
        Different scopes. contentType classifies the document format (guide, specification, script). cogType classifies
        the cog behaviour (info, action, routing, certificate-of-genuineness).
    - fields:
        - description
        - purpose
      overlap: false
      reason: >-
        Different concerns. description is a one-line summary of what the document is (max 160 chars, for search and
        discovery). purpose is an enumerated classification of why it exists (specification, reference, guide, etc.).
    - fields:
        - author
        - maintainer
      overlap: false
      reason: >-
        Different roles. author is the original creator (immutable). maintainer is the person or team responsible for
        ongoing updates (mutable). A document's author never changes; its maintainer may.
    - fields:
        - narrativeContext
        - context
      overlap: false
      reason: >-
        Different concerns. context is the folder-metadata domain object (domain, purpose, constraints).
        narrativeContext is the component family's URI to fuller editorial context a narrative layer points a human
        reader to. Neither stands in for contextProvides or contextRequired, the Context Declaration pair.
    - fields:
        - inspectorSections
        - sections
      overlap: false
      reason: >-
        Different concerns. sections is an extended free-text field. inspectorSections is the component family's array
        of named groups an object inspector presents an object's fields in.
    - fields:
        - layoutConstraints
        - context.constraints
      overlap: false
      reason: >-
        Different concerns. context.constraints names the constraints a folder's domain works under. layoutConstraints
        is the component family's declared layout a grid mount places components by.
  fields:
    - name: title
      type: string
      definition: Human-readable document title. The canonical identity field for all documents including cog files.
      example: MX Field Dictionary
      alignsWith:
        - dc:title
      notes: Required on every document. If both title in frontmatter and an H1 heading exist, avoid duplication.
      status: canonical
      profile: core
      required: true
    - name: description
      type: string
      definition: One-line summary. Max 160 characters. Used by search engines, AI agents, and registry listings.
      example: Single source of truth for every YAML frontmatter field.
      alignsWith:
        - dc:description
        - schema:description
      notes: Max 160 characters. Used by search engines, AI agents, and the cog registry.
      status: canonical
      profile: core
      required: true
    - name: author
      type: string
      definition: Creator of the document. Person name or collaborative attribution.
      example: Tom Cranstoun and Maxine
      alignsWith:
        - dc:creator
        - schema:author
      notes: Immutable after creation. For collaborative work, list all contributors. Distinct from maintainer.
      status: canonical
      profile: core
      required: true
    - name: originator
      type: string
      definition: >-
        The identity that originated this document or specification. Zone 1 (immutable, alongside author), distinct
        from the mutable Zone 2 stewardship object (steward, accountableContact, legalEntity, brand).
      example: Tom Cranstoun
      notes: >-
        Authorship decision D6 (mx-canon/mx-the-gathering/architecture-decisions/2026-05-07-review-fix-design-rationale.cog.md):
        originator stays top-level because it is identity, not stewardship. Distinct from author, which remains the
        general-purpose creator-attribution field; a spec cog may declare both when it imports originator from an
        external spec's vocabulary.
      status: canonical
      profile: core
      required: optional
    - name: created
      type: string
      definition: Creation date. ISO 8601 format (YYYY-MM-DD).
      example: 2026-03-01T00:00:00.000Z
      alignsWith:
        - dcterms:created
        - schema:dateCreated
      notes: Immutable — set once, never updated. ISO 8601 (YYYY-MM-DD).
      status: canonical
      profile: core
      required: true
    - name: modified
      type: string
      definition: Last modification date. ISO 8601 format (YYYY-MM-DD).
      example: 2026-03-02T00:00:00.000Z
      alignsWith:
        - dcterms:modified
        - schema:dateModified
      notes: Update every time file content changes. ISO 8601 (YYYY-MM-DD).
      status: canonical
      profile: core
      required: true
    - name: reviewDate
      type: string
      definition: >-
        The date by which this document's content must next be reviewed for accuracy, declared at Zone 1 (top
        level). ISO 8601 (YYYY-MM-DD).
      example: '2026-09-01'
      notes: Zone 1 sibling of expires. Pairs with the mx.reviewBy field used on cog-profile documents; both express the same concept at different zones.
      status: canonical
      profile: core
      required: optional
    - name: contributors
      type: array
      definition: Additional collaborators beyond the primary author.
      example:
        - Tom Cranstoun
      notes: Distinct from author (the primary/immutable creator attribution).
      status: canonical
      profile: core
      required: optional
    - name: version
      type: string
      definition: Semantic version string. Lives in frontmatter, never in filenames.
      example: '2.0'
      alignsWith:
        - schema:version
      notes: Always quote in YAML (prevents 1.0 being parsed as number). Lives in frontmatter, never in filenames.
      status: canonical
      profile: core
      required: recommended
    - name: status
      type: string
      definition: >-
        Lifecycle state. Standard values: draft, active, published, deprecated, archived, unknown. Decision records:
        proposed, accepted, rejected, superseded. Workflow: pending, review, approved, planning, open, closed, sent.
        Special: canonical.
      example: active
      validValues:
        - draft
        - active
        - published
        - deprecated
        - archived
        - unknown
        - proposed
        - accepted
        - rejected
        - superseded
        - pending
        - review
        - approved
        - planning
        - open
        - closed
        - sent
        - canonical
        - completed
        - proposal
        - final
        - current
        - deferred
      notes: Core recommended — always include. Different contexts use different subsets.
      status: canonical
      profile: core
      required: recommended
    - name: tags
      type: array
      definition: Discovery keywords. Array of strings for search, filtering, and agent matching.
      example:
        - metadata
        - yaml
        - frontmatter
        - reference
      alignsWith:
        - dc:subject
        - schema:keywords
      notes: Array of lowercase strings for search, filtering, and agent matching.
      status: canonical
      profile: core
      required: optional
    - name: type
      type: string
      definition: >-
        Document kind. OKF reserved top-level field naming what the file is, so a machine selects the right handling
        before reading the body. Common values include info-doc, action, blog-post, report, guide, skill, hook,
        routing-doc, and cogs; the set is open because document kinds grow with the estate.
      example: info-doc
      alignsWith:
        - dc:type
      notes: >-
        OKF reserved field — lives at the top level, never under mx:. Not an enforced enum; each profile declares its
        own kinds (blog sources use blog-post, action cogs use action).
      status: canonical
      profile: core
      required: true
    - name: resource
      type: string
      definition: >-
        The URI of the one external asset this document describes. OKF reserved top-level field; absent on an
        abstract document (a playbook, a runbook, an info-doc) that describes no single asset.
      example: https://bigquery.googleapis.com/v2/projects/bigquery-public-data/datasets/ga4_obfuscated_sample_ecommerce
      notes: >-
        OKF reserved field - lives at the top level, never under mx:. Distinct from refersToExternal, the plural array
        of cited sources: the two are never merged, and a value equal to any refersToExternal entry is an error. Should
        be a valid URI; consumers are permissive.
      status: canonical
      profile: core
      required: optional
    - name: canonicalUri
      type: string
      definition: >-
        The permanent, globally unique URI where the authoritative copy of this document lives. A reader that meets a
        copy anywhere can walk back to the source.
      example: https://raw.githubusercontent.com/Digital-Domain-Technologies-Ltd/MX-hub/main/README.md
      alignsWith:
        - schema:url
      notes: >-
        Declared under mx: on MX documents; top-level on gathering drafts. Required on every in-scope markdown file —
        presence and exact match are enforced at the write boundary.
      status: canonical
      profile: core
      required: true
    - name: citeAs
      type: string
      definition: >-
        The persistent identifier a reader uses when citing this document - a DOI, an ARK, a URN, or a stable URL -
        as a URI. canonicalUri says where the current copy lives; citeAs says what to write in a reference list, and
        the two may differ.
      example: https://doi.org/10.5281/zenodo.1234567
      alignsWith:
        - schema:identifier
        - dcterms:identifier
      notes: >-
        Mirrors the cite-as link relation (RFC 8574); the HTML carrier form is <link rel="cite-as" href="...">. An
        agent that cites sources copies this value rather than the URL it fetched, so a citation survives a move of the
        served page. When absent, canonicalUri is the citation target.
      status: canonical
      profile: core
      required: optional
    - name: alternateFormats
      type: array
      definition: >-
        The other renderings of this same document a reader may fetch instead - the markdown behind an HTML page, the
        PDF beside a report, the JSON record beside a human-readable declaration - each an object naming the
        rendering's uri and its format as an IANA media type. Aligns with Schema.org encoding; the HTML carrier form
        is the native <link rel="alternate" type="..." href="..."> element.
      example:
        - uri: https://mx.allabout.network/blog/example.md
          format: text/markdown
        - uri: https://mx.allabout.network/blog/example.pdf
          format: application/pdf
      alignsWith:
        - schema:encoding
      notes: >-
        Same content, different encoding. A translation is not an alternate format: it is declared with
        workTranslation and carried in HTML as rel="alternate" with hreflang. A machine-readable API twin of a page
        (application/json) belongs here. Each entry's format uses the same IANA media-type convention as the format
        field.
      status: canonical
      profile: core
      required: optional
    - name: alternateFormats.uri
      type: string
      definition: The URI of one alternate rendering of this document.
      example: https://mx.allabout.network/blog/example.pdf
      status: canonical
      profile: core
      required: optional
    - name: alternateFormats.format
      type: string
      definition: The IANA media type of one alternate rendering of this document.
      example: application/pdf
      status: canonical
      profile: core
      required: optional
    - name: audience
      type: string-or-array
      definition: >-
        Intended readership. Broad enum category only. For specific named people, organisations, or roles, use
        `targetReaders` instead.
      example:
        - humans
        - machines
      alignsWith:
        - dcterms:audience
        - schema:audience
      validValues:
        - tech
        - business
        - humans
        - machines
        - agents
        - both
        - developers
        - contributors
        - community
        - stakeholders
        - investors
        - gestalt
      notes: >-
        Can be string or array. The list covers broad categories. For specific named readers (e.g. 'Janus Boye', 'CTOs
        and product managers'), put that in `targetReaders` and keep `audience` limited to this enum.
      status: canonical
      profile: core
      required: optional
    - name: targetReaders
      type: string-or-array
      definition: >-
        Specific named people, organisations, or roles this content addresses. Freetext companion to `audience` (which
        is enum-only). Use when you need to record 'Janus Boye, Founder, Boye & Company' or 'Business leaders, CTOs,
        product owners' — specificity that doesn't fit the audience enum.
      example: Janus Boye, Founder, Boye & Company
      notes: >-
        Freetext string or array of strings. Complements `audience`; does not replace it. A document can have both:
        `audience: [stakeholders]` and `targetReaders: 'Janus Boye'`.
      status: canonical
      profile: core
      required: optional
    - name: applicability
      type: object
      definition: >-
        The conditions under which this document's content is in force. A reader that does not match a declared
        condition treats the document as not applicable to it.
      example:
        jurisdiction:
          - EU
        product: mx-registry
        productVersion: '>=3.0 <5.0'
      notes: >-
        Zone 2 object. Every sub-field is optional, and an omitted sub-field means unconstrained on that axis rather
        than excluded, so a document with no applicability block applies everywhere. Conditions combine with AND across
        axes and OR within an axis, so jurisdiction [EU, GB] matches a reader in either. Applicability governs whether
        content applies; `audience` governs who it is written for. Where the concern is what place the content is about
        rather than where it is in force, defer to Schema.org spatialCoverage.
      status: canonical
      profile: core
      required: optional
    - name: applicability.jurisdiction
      type: array
      definition: The legal or regulatory regimes in which this document's content is in force.
      example:
        - EU
        - GB
        - US-CO
      notes: >-
        ISO 3166-1 alpha-2 country codes and ISO 3166-2 subdivision codes, or a named regime no ISO code expresses (EU,
        EEA). Distinct from `inLanguage`, which declares the language of the prose body and never a place. Distinct
        from Schema.org legislationJurisdiction, which states where a named law has effect; this field states where
        this document applies.
      status: canonical
      profile: core
      required: optional
    - name: applicability.product
      type: string-or-array
      definition: The product or products this document's content applies to.
      example: mx-registry
      notes: >-
        Publisher-defined product identifiers. Pairs with `applicability.productVersion`, which narrows the same
        declaration to a range of releases.
      status: canonical
      profile: core
      required: optional
    - name: applicability.productVersion
      type: string
      definition: >-
        The range of product releases this document's content applies to, written as a semantic-version range
        expression.
      example: '>=3.0 <5.0'
      notes: >-
        Semver range syntax. Distinct from the document's own `version`, which records the revision of this file rather
        than the releases of the thing it describes.
      status: canonical
      profile: core
      required: optional
    - name: applicability.role
      type: array
      definition: The reader roles this document's content applies to.
      example:
        - administrator
      notes: >-
        Freetext role names drawn from the publisher's own access model. Distinct from `audience`, which is a broad
        enum for who the content is written for; role narrows to whom it is operative for.
      status: canonical
      profile: core
      required: optional
    - name: applicability.platform
      type: array
      definition: The platforms or runtime environments this document's content applies to.
      example:
        - linux
        - macos
      status: canonical
      profile: core
      required: optional
    - name: applicability.effectiveFrom
      type: string
      definition: The date from which this document's content is in force. ISO 8601 date.
      example: '2026-09-01'
      notes: >-
        Distinct from `created` and `publicationDate`, which record when the document was written and published. A
        document can be published ahead of the date its content takes effect.
      status: canonical
      profile: core
      required: optional
    - name: applicability.effectiveUntil
      type: string
      definition: The date after which this document's content is no longer in force. ISO 8601 date.
      example: '2027-06-30'
      notes: >-
        A hard applicability boundary: past this date the content does not apply. Distinct from `expires`, which is a
        review-or-archive prompt and leaves the content applicable until someone acts on it.
      status: canonical
      profile: core
      required: optional
    - name: statusNote
      type: string
      definition: >-
        Freetext detail accompanying `status`. Use when status has meaningful context beyond the enum value — e.g.
        status: active with statusNote: 'Phase 1 Complete, Phase 2 in design'.
      example: Patent files in separate repo
      notes: Freetext. `status` stays constrained to its enum; nuance and workflow context go here.
      status: canonical
      profile: core
      required: optional
    - name: purpose
      type: string
      definition: Free-text statement of why this document exists. Single sentence.
      example: Reference for any contributor adding metadata to non-markdown files.
      alignsWith:
        - schema:abstract
      notes: >-
        Free-text. The previous enum constraint was retired in dictionary v4.4 because real usage was overwhelmingly
        prose. Distinct from contentType (which classifies what the content is).
      status: canonical
      profile: core
      required: optional
    - name: summary
      type: string
      definition: >-
        A longer prose overview of what this document does, in paragraph form. Distinct from description (short,
        SEO-scoped, top-level) and purpose (single-sentence why, and on cog-spec documents a structured
        {kind, subPurpose} taxonomy object rather than prose).
      example: >-
        Normative specification for the cog v1 magic-header HTML comment and its cogHeader frontmatter equivalent.
        Defines the grammar, the conventional keys, and the equivalence rule.
      status: canonical
      profile: core
      required: optional
    - name: license
      type: string
      definition: SPDX license identifier.
      example: proprietary
      alignsWith:
        - schema:license
      notes: 'SPDX identifier. Common values: proprietary, MIT, Apache-2.0, CC-BY-4.0.'
      status: canonical
      profile: core
      required: optional
    - name: maintainer
      type: string
      definition: >-
        Person or team responsible for maintaining this document. Distinct from author — maintainer handles ongoing
        updates.
      example: Maxine
      alignsWith:
        - schema:maintainer
      notes: Mutable. Distinct from author (immutable creator). The person handling ongoing updates.
      status: canonical
      profile: core
      required: optional
    - name: ownership
      type: string-or-object
      definition: Ownership details. Can be a string (owner name) or object with owner, delegate, and contact.
      example: Tom Cranstoun
      notes: Can be a string or object with owner, delegate, and contact fields.
      status: canonical
      profile: core
      required: optional
    - name: stewardship
      type: object
      definition: >-
        Zone 2 (mutable) authorship object grouping the four roles distinct from the immutable Zone 1 originator/author:
        steward, accountableContact, legalEntity, brand.
      example:
        steward: Tom Cranstoun
        accountableContact: info@cognovamx.com
        legalEntity: Digital Domain Technologies Ltd
        brand: CogNovaMX
      notes: >-
        Authorship decision D6 (mx-canon/mx-the-gathering/architecture-decisions/2026-05-07-review-fix-design-rationale.cog.md):
        a single nested object rather than four parallel top-level fields, because the four roles belong together.
        Sub-keys are free-form strings, not separately registered.
      status: canonical
      profile: core
      required: optional
    - name: domain
      type: string
      definition: >-
        Business domain or subject area. In folder metadata, lives under the mx: object and is an identity field (never
        inherited). Values are context-specific. In the folder profile, the established estate convention writes this
        as x-mx-domain (the .mx.yaml.md generator's own default); the accepted x-mx- form satisfies the requirement
        equally, so a folder metadata file need not carry both.
      example: machine-experience
      notes: Identity field in folder metadata — never inherited. Values are context-specific. In the folder profile, x-mx-domain is an accepted alias.
      status: canonical
      profile:
        - core
        - folder
      required: optional
    - name: segment
      type: string
      definition: >-
        Segment classifier. Used in two contexts: (1) audience segment — developer, author, agent, business; (2) time
        segment for session reports — morning, afternoon, evening.
      example: afternoon
      validValues:
        - developer
        - author
        - agent
        - business
        - morning
        - afternoon
        - evening
        - late-evening
        - night
        - full-day
      notes: Context-dependent. Report profile uses time segments; other profiles use audience segments.
      status: canonical
      profile:
        - core
        - report
      required: optional
    - name: partOf
      type: string
      definition: Parent collection, suite, or initiative.
      example: mx-the-gathering
      notes: Required for cog files. Names the parent collection or initiative.
      status: canonical
      profile: cog
      required: true
    - name: buildsOn
      type: array
      definition: >-
        Context graph. Array of cog names this document builds upon. Soft dependency — provides context, not a hard
        requirement.
      example:
        - what-is-a-cog
        - cog-unified-spec
      notes: Soft dependency for context. Builds the cog knowledge graph.
      status: canonical
      profile: cog
      required: optional
    - name: requires
      type: array
      definition: Hard dependencies. Array of cog names that must exist for this cog to function.
      example:
        - node-runtime
        - markdownlint-cli2
      notes: Hard dependency. The cog cannot function without these.
      status: canonical
      profile: cog
      required: optional
    - name: refersTo
      type: array
      definition: Related cogs or external resources. Informational links, not dependencies.
      example:
        - field-dictionary
        - cog-unified-spec
      notes: Informational links, not dependencies.
      status: canonical
      profile: cog
      required: optional
    - name: refersToExternal
      type: array
      definition: >-
        The external works this document draws on or cites, one entry per work, each a citation string a reader can
        resolve without the repository: author, title, venue or publisher, date, and an identifier such as an arXiv
        number or a URL. The outward counterpart of refersTo, which carries repository-relative paths. Aligns with
        Schema.org citation; the HTML carrier emits it as the JSON-LD citation property, the element form of
        <cite> and <blockquote cite>.
      example:
        - "Jiaying Wu, Caleb Ziems et al., \"When Does AI Augment Work?\" (arXiv:2609.12482, 11 September 2026)"
      alignsWith:
        - schema:citation
      notes: >-
        A citation is a claim of relevance, never corroboration: a source listed here says the document read it, not
        that it agrees. A source that independently states a load-bearing claim belongs in the corroboration field as
        well. Kept free-text so a reader outside the repository gets a complete reference rather than a bare URL.
        Distinct from resource, the one asset a document describes; a value equal to any resource is an error.
      status: canonical
      profile: core
      required: optional
      context: 'Declared on any document whose argument rests on named external works: papers, standards, essays, reports.'
    - name: relatedTo
      type: array
      definition: >-
        Sibling documents and resources this one relates to without depending on or describing them. The loosest of the
        relation fields: dependencies declares hard requirements, buildsOn declares conceptual ancestry, refersTo
        declares informational citations, relatedTo declares adjacency.
      example:
        - scripts/bin/check-deps.sh
        - scripts/cogs/mx-user-audit.cog.md
      notes: Repo-root-relative paths or cog slugs. The MX graph resolves these into relatedTo edges. Aligns with Schema.org isRelatedTo.
      status: canonical
      profile: cog
      required: optional
    - name: derivedFrom
      type: string
      definition: >-
        Upstream provenance — the source this content was derived from. A relative path within the repository pointing
        to the originating directory or file. Used by the MX graph to build lineage edges tracing content from source to
        destination.
      example: mx-canon/mx-maxine-lives/communications/blogs/md/
      notes: >-
        Declared in the mx: block. Never inherited — always per-folder or per-cog. The MX graph resolves these into
        derivedFrom edges for provenance tracing.
      status: canonical
      profile:
        - folder
        - cog
      required: optional
    # --- Component family: the fields a rendered component carries to its human and machine readers.
    # Defined by the MX Component Standard (mx-canon/ssot/papers/mx-component-standard.md). Every field is
    # optional and Zone 2; a component also carries the root fields (identity, provenance, relationships,
    # signals). The component kind is a value of the OKF type field (component:provenanceBadge and the
    # other kinds routed through contentTypeToProfile). Approved by The Gathering on 2026-09-17 (ADR 68).
    - name: displayMode
      type: string
      definition: How a provenance badge is rendered, collapsed to its origin and trust signals or expanded to the full record.
      example: compact
      validValues:
        - compact
        - expanded
      notes: >-
        A compact badge still exposes every trust signal one interaction away; the mode governs what is shown first,
        never what is carried.
      status: canonical
      profile: component
      required: optional
    - name: icon
      type: string
      definition: The icon a provenance badge renders, as a URI or a styling token name.
      example: token:mx-badge-verified
      status: canonical
      profile: component
      required: optional
    - name: verificationChanged
      type: string
      definition: The ISO 8601 timestamp of the last change in the object's verification state.
      example: '2026-09-17T08:51:12Z'
      notes: >-
        A renderer signals the change in text or a screen-reader equivalent, never through motion or styling
        alone; motion is optional on top.
      status: canonical
      profile: component
      required: optional
    - name: attestation
      type: string-or-object
      definition: The registry's attestation record for the object, or a pointer to it, the trust signal that answers who published this and when.
      example: https://reginald.example.com/records/provenance-and-the-regulator
      notes: >-
        A URI points at the record; an object carries it inline. A component reports attestation beside currency,
        freshness and corroboration and never folds them into one score. Distinct from security.attestation, the
        execution policy's flag for whether attestation is required before an action block runs.
      status: canonical
      profile: component
      required: optional
    - name: preview
      type: string
      definition: The URI of a preview rendering of the object an object card represents.
      example: https://mx.allabout.network/images/previews/provenance-regime-compatibility.png
      status: canonical
      profile: component
      required: optional
    - name: actions
      type: array
      definition: The actions an object card offers on its object, declared so a human and an agent see the same list.
      example:
        - name: open
          target: https://mx.allabout.network/papers/provenance-regime-compatibility.html
          verifiability: deterministic
        - name: export-provenance
          target: https://mx.allabout.network/papers/provenance-regime-compatibility.provenance.json
          verifiability: deterministic
          withheldFrom: [humans]
      notes: >-
        An action withheld from one audience is declared with withheldFrom rather than omitted, so the other audience
        can see the withholding.
      status: canonical
      profile: component
      required: optional
    - name: actions[].name
      type: string
      definition: The name of one action an object card offers.
      example: open
      status: canonical
      profile: component
      required: optional
    - name: actions[].target
      type: string
      definition: The URI the action resolves to.
      example: https://mx.allabout.network/papers/provenance-regime-compatibility.html
      status: canonical
      profile: component
      required: optional
    - name: actions[].verifiability
      type: string
      definition: How the action's result can be checked, in the action-cog vocabulary.
      example: deterministic
      validValues:
        - deterministic
        - inferential
        - external
      status: canonical
      profile: component
      required: optional
    - name: actions[].withheldFrom
      type: array
      definition: The audiences the action is not offered to.
      example:
        - humans
      validValues:
        - humans
        - machines
        - agents
      status: canonical
      profile: component
      required: optional
    - name: relationshipField
      type: string
      definition: The name of the relationship field a relationship line renders, which is also the line's direction.
      example: buildsOn
      validValues:
        - buildsOn
        - derivedFrom
        - partOf
        - supersedes
        - supersededBy
        - refersTo
        - relatedTo
      status: canonical
      profile: component
      required: optional
    - name: inferred
      type: boolean
      definition: Whether the relationship a line renders was inferred rather than declared by the publisher.
      example: false
      notes: >-
        A declared relationship carries no confidence value, because it is a statement by the publisher rather than
        an estimate; an inferred one carries finalConfidence and confidenceMethod.
      status: canonical
      profile: component
      required: optional
    - name: visualWeight
      type: string
      definition: The styling token that sets a relationship line's weight, derived from confidence for an inferred relationship and fixed for a declared one.
      example: token:mx-line-declared
      status: canonical
      profile: component
      required: optional
    - name: verificationSummary
      type: string
      definition: A one-line statement of the outcome of the verification trail a verification panel exposes.
      example: Attested by the publisher, current version, publisher active, one claim corroborated.
      status: canonical
      profile: component
      required: optional
    - name: verificationSteps
      type: array
      definition: The steps of the verification trail, each timestamped and attributed to the agent that performed it.
      example:
        - timestamp: '2026-09-17T08:51:12Z'
          agent: reginald.allabout.network
          method: ed25519-signature-check
          outcome: pass
        - timestamp: '2026-09-17T08:51:13Z'
          agent: check-blog-corroboration.cjs
          method: corroboration-source-resolves
          outcome: pass
      notes: >-
        The same step vocabulary as the provenance sidecar: timestamp, agent, method, outcome. Freshness is read from
        the registry, never asserted by the object about itself.
      status: canonical
      profile: component
      required: optional
    - name: verificationSteps[].timestamp
      type: string
      definition: The ISO 8601 timestamp of one verification step.
      example: '2026-09-17T08:51:12Z'
      status: canonical
      profile: component
      required: optional
    - name: verificationSteps[].agent
      type: string
      definition: The person, system, or rule that performed the step.
      example: reginald.allabout.network
      status: canonical
      profile: component
      required: optional
    - name: verificationSteps[].method
      type: string
      definition: The method the step applied.
      example: ed25519-signature-check
      status: canonical
      profile: component
      required: optional
    - name: verificationSteps[].outcome
      type: string
      definition: The outcome of the step.
      example: pass
      validValues:
        - pass
        - warn
        - fail
        - skipped
      status: canonical
      profile: component
      required: optional
    - name: finalConfidence
      type: number
      definition: The confidence a verification panel reports for its trail, from 0 to 1.
      example: 0.92
      notes: >-
        The same 0 to 1 range as ai.confidence. Never a combined trust score: the trust signals stay separate, and this
        value describes the trail, not the object.
      status: canonical
      profile: component
      required: optional
    - name: confidenceMethod
      type: string
      definition: How a confidence value was derived.
      example: weighted-step-outcomes
      status: canonical
      profile: component
      required: optional
    - name: cue
      type: string
      definition: A short human-facing note a narrative layer carries beside a component, never in place of its metadata.
      example: Read alongside the regime registry before quoting a date.
      status: canonical
      profile: component
      required: optional
    - name: narrativeContext
      type: string
      definition: The URI of fuller editorial context a narrative layer points a human reader to.
      example: https://mx.allabout.network/blog/provenance-is-an-evidence-vehicle.html
      notes: >-
        Distinct from context (a folder-metadata domain object) and from contextProvides and contextRequired (the
        Context Declaration pair). The narrative layer is optional and never obscures the structured fields.
      status: canonical
      profile: component
      required: optional
    - name: gridUnit
      type: string
      definition: The base layout unit a grid mount lays components out from.
      example: 8px
      status: canonical
      profile: component
      required: optional
    - name: layoutConstraints
      type: array
      definition: The declared layout constraints a grid mount places components by, so position carries no meaning the metadata does not also carry.
      example:
        - component: provenanceBadge
          adjacentTo: objectCard
        - component: verificationPanel
          span: 2
      notes: >-
        Named layoutConstraints rather than constraints to stay clear of context.constraints, the folder-metadata
        domain constraint. Adjacency follows a declared relationship; adjacency alone never implies one.
      status: canonical
      profile: component
      required: optional
    - name: snapPoints
      type: array
      definition: The positions a grid mount lets a component occupy.
      example:
        - 0
        - 8
        - 16
        - 24
      status: canonical
      profile: component
      required: optional
    - name: barState
      type: object
      definition: The state a signal bar displays, bound to a named field and its value rather than to a state that exists only in the rendering.
      example:
        field: validationStatus
        value: valid
      status: canonical
      profile: component
      required: optional
    - name: barState.field
      type: string
      definition: The name of the field the signal bar is bound to.
      example: validationStatus
      status: canonical
      profile: component
      required: optional
    - name: barState.value
      type: string
      definition: The bound field's value the signal bar displays.
      example: valid
      status: canonical
      profile: component
      required: optional
    - name: pulse
      type: boolean
      definition: Whether a signal bar or badge animates a state change in addition to conveying it in text.
      example: false
      notes: Motion is always optional; the state is conveyed in text or a screen-reader equivalent first.
      status: canonical
      profile: component
      required: optional
    - name: styleToken
      type: string
      definition: The declared styling token for a signal bar's state, so one state looks the same everywhere it appears.
      example: token:mx-state-valid
      status: canonical
      profile: component
      required: optional
    - name: inspectorSections
      type: array
      definition: The sections an object inspector groups the object's fields into, each naming its fields.
      example:
        - name: identity
          fields: [title, canonicalUri, version, created, modified]
        - name: provenance
          fields: [authorship, generatedBy, provenanceUri]
        - name: trust
          fields: [attestation, integritySignature, trustLevel, x-mx-corroboratedBy, x-mx-contestedBy]
      notes: >-
        Named inspectorSections rather than sections, an existing extended field. The inspector shows every field
        under the name the dictionary gives it and presents the same order every time it opens on the same object.
      status: canonical
      profile: component
      required: optional
    - name: inspectorSections[].name
      type: string
      definition: The name of one inspector section.
      example: provenance
      status: canonical
      profile: component
      required: optional
    - name: inspectorSections[].fields
      type: array
      definition: The dictionary names of the fields the section groups.
      example:
        - authorship
        - generatedBy
        - provenanceUri
      status: canonical
      profile: component
      required: optional
    - name: replacedBy
      type: string-or-object
      definition: >-
        Pointer to the canonical document that supersedes this one. Either a path string or an object with named keys
        (e.g. {prose: ..., data: ...}) when the replacement spans multiple documents.
      example: datalake/manuscripts/mx-books/mx-appendices/appendix-m-index-of-metadata.md
      notes: 'Used by stub documents to declare their successor. Pairs with status: superseded.'
      status: canonical
      profile:
        - cog
        - any
      required: optional
    - name: subtitle
      type: string
      definition: Secondary title displayed below the main title. Used by book chapters, presentations, and articles.
      example: Why this metadata matters for AI agents
      status: canonical
      profile:
        - book
        - blog
        - any
      required: optional
    - name: appendix
      type: string
      definition: Appendix label or letter. Identifies an appendix within a manuscript volume.
      example: M
      status: canonical
      profile: book
      required: optional
    - name: execute
      type: object
      definition: Action block. Contains runtime, command, actions, and policy. Its presence makes a cog an action-doc.
      example:
        runtime: node
        command: node scripts/validate.js
      notes: >-
        Its presence makes a cog an action-doc. Action cogs live in scripts/ folder. Sub-fields: route (bash, ollama
        or agent; the default runtime for every block, declared in fields-data-cogs.yaml as execute.route) and
        actions[] (id, name, an optional per-action route, and usage prose, which for actionType sop is the
        descriptive instruction an LLM reads and performs). The vendor spelling x-mx-execute is deprecated (ADR 70):
        a vendor field is stripped from a published page, and an action block a reader cannot meet is not an action
        block.
      status: canonical
      profile: cog
      required: false
    - name: hasDeterministicScript
      type: boolean
      definition: True when the embedded or referenced script produces byte-identical output for the same inputs on every run; false when explicitly non-deterministic; absent means not applicable or not yet declared.
      example: true
      notes: >-
        Tri-state semantics: true = deterministic (declared by author), false = non-deterministic (declared by author),
        absent = not applicable or unknown. Applies to action-cogs with actionType scripted or hybrid. Machines enforcing
        determinism guarantees before executing a cog should check this field before shelling out. A cog that calls an
        LLM, reads system clock, or produces randomly-ordered output must declare false. A cog whose embedded script
        produces the same bytes for the same inputs on any machine must declare true. The field is opt-in: omitting it
        makes no claim either way.
      status: canonical
      profile: cog
      required: false
    - name: hasReasoning
      type: boolean
      definition: True when every step in the cog carries both a Reason annotation (why the step exists) and an Expected results annotation (what success looks like); false when explicitly declared absent; absent means not applicable or not yet assessed.
      example: true
      notes: >-
        Tri-state semantics: true = both Reason and Expected results are present after every step (declared by author),
        false = explicitly declared absent, absent = no claim. Applies to instruction manuals (info-docs with step sequences),
        action-docs, and any cog whose body guides an operator through a procedure. The two annotations together make a cog
        self-explanatory to a cold reader: Reason answers "why does this step exist?"; Expected results answers "how do I
        know it succeeded?". A cog that carries only one of the two must declare false or omit the field. Complements
        hasDeterministicScript (which applies to the embedded script); hasReasoning applies to the instructional prose.
      status: canonical
      profile: cog
      required: false
    - name: blocks
      type: array
      definition: >-
        Declares block types present in the document. Values: prose, action, definition, essence, provenance, version,
        code, html, sop, security.
      example:
        - prose
        - definition
        - code
      validValues:
        - prose
        - action
        - definition
        - essence
        - provenance
        - version
        - code
        - html
        - sop
        - security
      notes: Declares block types present in the document body.
      status: canonical
      profile: cog
      required: optional
    - name: policy
      type: string-or-object
      definition: Content handling rules for agents. Inherited from uber docs via effective doc resolution.
      example: inherit from parent uber-doc
      notes: Content handling rules for agents. Inherited via effective doc resolution.
      status: canonical
      profile: cog
      required: optional
    - name: accessibility
      type: string-or-object
      definition: Accessibility compliance level or detailed accessibility metadata for a cog.
      example: WCAG 2.1 AA
      notes: >-
        Declares the accessibility standard the cog content targets. Used alongside semantic and convergence for content
        quality scoring.
      status: canonical
      profile: cog
      required: optional
    - name: convergence
      type: string-or-object
      definition: Convergence score or metadata. Measures how well the cog aligns human and machine experiences.
      example: high
      notes: 'Part of the quality triad: accessibility, semantic, convergence. Core to MX''s dual-experience philosophy.'
      status: canonical
      profile: cog
      required: optional
    - name: publisher
      type: string-or-object
      definition: Entity that publishes and stands behind this cog. Can be a string (name) or object with name, url, and contact.
      example: CogNovaMX Ltd
      notes: >-
        Carries the Schema.org meaning; MX defines no separate provenance publisher field. Can be a structured object with sub-fields.
        Used in Community Owned Governance Standard cogs.
      status: canonical
      profile: cog
      required: optional
    - name: url
      type: string
      definition: >-
        The canonical external URL of the entity this record represents, per the Schema.org `url` property for the
        declared `schema` type (Person, Organization, BlogPosting). Distinct from `canonicalUri`, which is the
        GitHub-hosted source-of-truth location of this markdown file itself.
      example: https://allabout.network
      alignsWith:
        - schema:url
      notes: >-
        Used alongside schema and publisher on identity/profile cogs (a Person's homepage or LinkedIn) and on
        published-content records (a BlogPosting's rendered page).
      status: canonical
      profile: cog
      required: optional
    - name: cacheability
      type: string
      definition: >-
        How long an agent or resolver may cache this document's content before it must be re-fetched. Named tiers map to
        durations. A custom duration string (e.g., '4h', '30d') is also accepted.
      example: long-lived
      validValues:
        - ephemeral
        - short-lived
        - medium
        - long-lived
        - permanent
      notes: >
        Tiers:

        - ephemeral: must not be cached; content changes on every request (e.g., real-time prices, live status)

        - short-lived: cache for up to 1 hour (e.g., news feeds, dashboards)

        - medium: cache for up to 1 day (e.g., blog posts, reports)

        - long-lived: cache for up to 1 week (e.g., documentation, guides)

        - permanent: cache indefinitely until the document changes (e.g., specifications, standards)

        Custom durations use the format: number + unit (s, m, h, d, w). Examples: '30m', '4h', '30d'.

        Distinct from stability (content reliability) and lifecycle (development phase). Cacheability is about temporal
        validity — how quickly the content goes stale.

        Default when omitted: medium (cache for up to 1 day).
      status: canonical
      profile: any
    - name: volatileValues
      type: array
      definition: >-
        Declares that one or more values stated in the body (a price, an exchange rate, an interest rate, a stock
        level, an availability figure) are snapshots of a value that moves, records when each was observed and until
        when it may be quoted, and points at the mechanism a machine calls for the current value.
      example:
        - kind: price
          subject: Standard room, one night
          statedAt: '2026-09-09T10:00:00Z'
          validUntil: '2026-09-10T10:00:00Z'
          currency: GBP
          resolveVia:
            url: https://example.com/api/rates?room=standard
            method: get
            format: application/json
            cadence: PT1H
            access: public
          onStale: resolve
      alignsWith:
        - schema:priceValidUntil
        - schema:priceCurrency
        - schema:EntryPoint
      notes: >
        One entry per volatile value or group of values. Sub-keys per entry:

        - kind: price | exchange-rate | interest-rate | availability | stock-level | capacity | other

        - subject: what the value describes, in plain words

        - appliesTo: optional URL fragment or selector naming where the value sits in the body

        - statedAt: ISO 8601 date-time at which the stated value was observed

        - validUntil: ISO 8601 date-time after which the stated value must not be quoted as current

        - currency: ISO 4217 code for a monetary value; defaults to the document currency

        - resolveVia: the mechanism that returns the current value. url (the endpoint, feed, or page), optional
        cogUrn (a registered mechanism record a registry has attested), method (get | post | feed | page | contact),
        format (a media type), cadence (ISO 8601 duration between refreshes), access (public | key | partner)

        - onStale: what an agent does after validUntil. resolve (call the mechanism, never quote the stated value),
        quote-dated (quote the stated value with its statedAt date), omit (leave the value out)

        Distinct from cacheability (how long the whole document may be cached), expires (the date the whole file
        stops being authoritative), and temporalAnchors (dates the prose depends on). A volatile value is a figure
        inside the body that changes on a cadence while the document around it stays valid. Schema.org Offer carries
        the value and its validity window on a product; volatileValues is the document-level declaration that the
        stated figure is a snapshot and where the live figure is resolved. A registry attests the document, and with
        it the pointer, never the live value.
      status: canonical
      profile: any
      required: optional
    - name: temporalStance
      type: string
      definition: >-
        Declares the document's relationship between its prose and the dates the prose describes: frozen (the prose
        records state at publication and its dates do not move), living (the prose reflects state at fetch time and
        date-derived values are recomputed against the reader's clock), or anchored (the prose contains values computed
        from declared anchors and moves with them).
      example: anchored
      validValues:
        - frozen
        - living
        - anchored
      notes: >
        A document declaring anchored SHOULD declare temporalAnchors. A living document MAY omit anchors; the reader's
        clock is the implicit anchor. A frozen document MUST NOT declare anchors that move. Defined by the Gathering's
        MX Temporal Stance note; distinct from expires (a lifecycle endpoint) and from volatileValues (a figure that
        moves, not a date).
      status: canonical
      profile: any
      required: optional
    - name: temporalAnchors
      type: object
      definition: >-
        Named date anchors the document's prose depends on. Each key is a stable kebab-case identifier; each value
        pairs the anchor's current date with a description and, where the authoritative value is published elsewhere,
        its source.
      example:
        eu-ai-act-application:
          date: '2026-08-02'
          description: EU AI Act provisions for general-purpose AI become applicable.
          source: https://eur-lex.europa.eu/eli/reg/2024/1689
        contract-renewal:
          date: '2027-04-30'
          description: Master service agreement renewal date.
      notes: >
        Sub-keys per anchor: date (ISO 8601, required), description (what the anchor is, naming the external source
        where there is one), source (optional canonical URL of the authoritative value). An anchor whose date changes
        is a substantive edit: bump modified and review the prose against temporalProseGuidance. Identifiers are the
        keys temporalComputedFields and temporalProseGuidance reference. Defined by the Gathering's MX Temporal Stance
        note.
      status: canonical
      profile: any
      required: optional
    - name: temporalComputedFields
      type: object
      definition: >-
        Fields whose values are computed from anchors at render time. Each key names a computed field; each value
        names the anchor it is computed from and the computation to apply. A render-time agent never caches the
        result beyond a single render.
      example:
        daysUntilApplication:
          from: eu-ai-act-application
          compute: daysUntil
          format: integer
        contractMonthsRemaining:
          from: contract-renewal
          compute: monthsUntil
          format: integer
      notes: >
        Sub-keys per computed field: from (an anchor identifier in temporalAnchors, or the literal now), compute
        (daysUntil, daysSince, monthsUntil, monthsSince, quartersUntil, quartersSince, or dateValue for the anchor
        date verbatim), format (an optional presentation hint such as integer, iso-date, or human-readable, which an
        implementation may ignore). An unknown anchor identifier is a render failure, never a default. A computed
        value is excluded from any signature scope, because it changes on every render. Defined by the Gathering's MX
        Temporal Stance note.
      status: canonical
      profile: any
      required: optional
    - name: temporalProseGuidance
      type: object
      definition: >-
        Author-supplied instructions telling a future steward, human or machine, what to review or rewrite in the
        prose when a named anchor moves. Each key is an anchor identifier from temporalAnchors.
      example:
        eu-ai-act-application:
          onMove: Re-read the day-one section. If the anchor moves more than 30 days, rewrite the run-up timetable.
          affectedSections:
            - '#what-changes-on-day-one'
            - '#run-up-timetable'
          softCutoff: true
      notes: >
        Sub-keys per anchor: onMove (what to review or rewrite), affectedSections (optional URL fragments of the
        sections that depend on the anchor), softCutoff (true when a small move within tolerance needs no prose
        update; onMove then says what counts as material). An anchored document SHOULD list every anchor whose
        movement could leave the prose wrong. Defined by the Gathering's MX Temporal Stance note.
      status: canonical
      profile: any
      required: optional
    - name: ai
      type: object
      definition: AI-related metadata. Contains disclosure, attribution, freshness policies for AI-generated content.
      example:
        disclosure: true
        attribution: Generated by Claude
      notes: 'Container for AI-specific metadata: disclosure, attribution, freshness.'
      status: canonical
      profile: core
      required: optional
    - name: contextProvides
      type: string-or-array
      definition: What context this document provides to agents. Describes the knowledge or capability this document contributes.
      example: Field definitions and naming conventions for the MX ecosystem
      notes: >-
        The outward half of the Context Declaration pair: what this document offers an agent's context window.
        contextRequired is the inward half. Distinct from the ai block's code-carrier notation (ai.contextProvides on a
        code file), which describes what a source file contributes and stays with the carrier dictionary.
      status: canonical
      profile: core
      required: optional
    - name: contextRequired
      type: array
      definition: >-
        The files an agent must read before it can use this document safely. Repo-root-relative paths, no ../ segments,
        in reading order.
      example:
        - mx-canon/ssot/principles.cog.md
      notes: >-
        The inward half of the Context Declaration pair completed by contextProvides. A document that cannot be acted on
        safely without prior reading says so here rather than assuming the reader arrived informed; the two fields
        together give a machine a self-documenting dependency graph, so it knows what to read first without asking. An
        empty list is a statement that nothing is prerequisite, not an omission.
      status: canonical
      profile: core
      required: optional
    - name: aiAssistance
      type: string-or-object
      definition: 'AI assistance policy. Values: welcome, restricted, prohibited. Inheritable.'
      default: welcome
      example: restricted
      validValues:
        - welcome
        - restricted
        - prohibited
      notes: Inheritable. Only declare when restricting or prohibiting.
      status: canonical
      profile:
        - core
        - folder
      required: optional
    - name: aiEditable
      type: boolean
      definition: Whether this content can be edited by AI agents. In folder metadata defaults to true. Inheritable.
      default: false
      example: true
      notes: Inheritable. In folder metadata defaults to true. Only declare when granting edit permission on documents.
      status: canonical
      profile:
        - core
        - folder
      required: optional
    - name: aiTraining
      type: string
      definition: 'Training-data policy for this document or folder: whether its content may be used in AI training corpora. Values: allowed, prohibited, conditional. Inheritable. Trust lens.'
      example: conditional
      validValues:
        - allowed
        - prohibited
        - conditional
      notes: Inheritable. When conditional, check aiTrainingConditions. The enumerated per-object form of the document-level trainingDataPolicy narrative field.
      status: canonical
      profile:
        - core
        - folder
      required: optional
    - name: aiTrainingConditions
      type: array
      definition: Conditions under which AI training is permitted, as an array of strings describing exclusions or requirements.
      example:
        - exclude credentials
        - exclude personal data
      notes: Only relevant when aiTraining is conditional.
      status: canonical
      profile:
        - core
        - folder
      required: optional
    - name: aiSensitivePaths
      type: array
      definition: Glob patterns for paths that AI agents must not read or train on.
      example:
        - secrets/**
        - .env
        - credentials.*
      notes: Glob patterns, applied recursively within the folder. Folder metadata only.
      status: canonical
