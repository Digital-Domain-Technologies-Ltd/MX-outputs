    - name: event
      description: >-
        Fields for event, conference, and presentation records. Thin category; too few real examples in the estate
        to justify anything beyond the core required set (field-triage-rubric.cog.md Rule 2 - do not invent fields
        without evidence).
      required:
        - title
        - description
        - author
        - created
        - modified
    - name: script
      description: >-
        Fields for contentType: script documents (not code-carrier files, which are covered separately by
        fields-data-carriers.yaml). Thin category; minimal evidence of real usage in the estate - conservative
        required set only, matching core.
      required:
