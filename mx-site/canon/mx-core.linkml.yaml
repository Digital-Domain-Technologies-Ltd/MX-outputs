    slot_uri: mx:requestedActions
    range: RequestedActions
    multivalued: true
    status: mx:experimental
    inlined: true
    inlined_as_list: true
  requires:
    description: Hard dependencies. Array of cog names that must exist for this cog to function.
    slot_uri: mx:requires
    range: string
    multivalued: true
    status: mx:canonical
  residualRisk:
