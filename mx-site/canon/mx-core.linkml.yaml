    range: MxBeginEnum
    examples:
      - value: // @mx:begin security-critical
    status: mx:canonical
  mx:buildsOn:
    description: Context dependencies as comma-separated cog names.
    slot_uri: mx:mx:buildsOn
    range: string
    examples:
      - value: '@mx:buildsOn cog-unified-spec, field-dictionary'
    status: mx:canonical
  mx:category:
    description: Cog category.
    slot_uri: mx:mx:category
    range: string
    examples:
      - value: <meta name="mx:category" content="standard">
    status: mx:canonical
  mx:contextProvides:
    description: What context this file provides to agents.
    slot_uri: mx:mx:contextProvides
    range: string
    examples:
      - value: '@mx:contextProvides "Validation utilities for frontmatter"'
    status: mx:canonical
  mx:documentedIn:
    description: Path to companion documentation.
    slot_uri: mx:mx:documentedIn
    range: string
    examples:
      - value: '@mx:documentedIn ../docs/field-dictionary.cog.md'
    status: mx:canonical
  mx:end:
    description: Closes an annotated code block. Value matches the opening tag.
    slot_uri: mx:mx:end
    range: string
    examples:
      - value: // @mx:end security-critical
    status: mx:canonical
  mx:intentional:
    description: Line annotation marking deliberate unusual code.
    slot_uri: mx:mx:intentional
    range: string
    examples:
      - value: await sleep(100); // @mx:intentional rate-limiting
    status: mx:canonical
  mx:name:
    description: Cog name. Equivalent to name in YAML frontmatter.
    slot_uri: mx:mx:name
    range: string
    examples:
      - value: <meta name="mx:name" content="field-dictionary">
    status: mx:canonical
  mx:purpose:
    description: Why this file exists.
    slot_uri: mx:mx:purpose
    range: string
    examples:
      - value: '@mx:purpose utility'
    status: mx:canonical
  mx:sensitive:
    description: 'Line annotation marking sensitive data. Flags: no-log, no-expose.'
    slot_uri: mx:mx:sensitive
    range: string
    examples:
      - value: const API_KEY = process.env.API_KEY; // @mx:sensitive no-log no-expose
    status: mx:canonical
  mx:stability:
    description: >-
      Stability level. Values: stable, evolving, experimental, deprecated, archived, friable. friable means the file is
