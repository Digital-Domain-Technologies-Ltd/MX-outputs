    range: string
    examples:
      - value: https://bigquery.googleapis.com/v2/projects/bigquery-public-data/datasets/ga4_obfuscated_sample_ecommerce
    status: mx:canonical
  resourceProfile:
    description: >-
      The compute and energy a document's production or an AI system's operation uses, with the unit, whether the figure
