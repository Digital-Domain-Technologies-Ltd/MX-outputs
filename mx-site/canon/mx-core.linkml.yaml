      The date by which this document's content must next be reviewed for accuracy. Distinct from reviewCycle (the
      review cadence) - reviewBy is the specific next deadline.
    slot_uri: mx:reviewBy
    range: string
    status: mx:canonical
  reviewCycle:
    description: >-
      How often this document's content is reviewed for accuracy: daily, weekly, monthly, quarterly or annually, or an
      ISO 8601 duration.
    slot_uri: mx:reviewCycle
    range: string
    examples:
      - value: quarterly
    status: mx:canonical
  reviewDate:
    description: >-
      The date by which this document's content must next be reviewed for accuracy, declared at Zone 1 (top level). ISO
      8601 (YYYY-MM-DD).
    slot_uri: mx:reviewDate
    range: string
    examples:
      - value: '2026-09-01'
    status: mx:canonical
  reviewedBy:
    description: >-
      The named person who reviewed this document and accepted or rejected it. Records that a human checked the work; it
