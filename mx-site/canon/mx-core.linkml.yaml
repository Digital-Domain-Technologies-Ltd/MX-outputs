  OpenQuestions:
    description: Structured value of the MX field openQuestions.
    attributes:
      question:
        description: The question, in one sentence, as a person would be asked it.
        slot_uri: schema:text
        range: string
        examples:
          - value: Is 04/05/1920 the 4th of May or the 5th of April?
        status: mx:experimental
      about:
        description: >-
          What the question is about, as a field path in the form inferences[].field defines: inferences. followed by
          the field of the inference it concerns (inferences.birthDate), claims. followed by a claim's zero-based index
          (claims.0), or the path of any other field (sourceOfTruth.ref).
        slot_uri: mx:about
        range: string
        examples:
          - value: inferences.birthDate
        status: mx:experimental
      answerableBy:
        description: The role or party able to answer, such as owner, author, operator or a named source.
        slot_uri: mx:answerableBy
        range: string
        examples:
          - value: owner
        status: mx:experimental
      raisedBy:
        description: The person, script, engine or model that raised the question.
        slot_uri: mx:raisedBy
        range: string
        examples:
          - value: joymaker/backend/gedcom-import.js
        status: mx:experimental
      raisedAt:
        description: The ISO 8601 UTC timestamp at which the question was raised.
        slot_uri: mx:raisedAt
        range: string
        examples:
          - value: '2026-11-15T03:20:00Z'
        status: mx:experimental
      status:
        description: Whether the question is still open.
        slot_uri: mx:status
        range: OpenQuestionsStatusEnum
        examples:
          - value: open
        status: mx:experimental
      answer:
        description: The answer, as given; present only when the status is answered.
        slot_uri: mx:answer
        range: string
        examples:
          - value: The UK tax year.
        status: mx:experimental
      answeredBy:
        description: The role or party that gave the answer.
        slot_uri: mx:answeredBy
        range: string
        examples:
          - value: author
        status: mx:experimental
      answeredAt:
        description: The ISO 8601 UTC timestamp at which the answer was given.
        slot_uri: mx:answeredAt
        range: string
        examples:
          - value: '2026-11-11T10:00:00Z'
        status: mx:experimental
  Parties:
    description: Structured value of the MX field parties.
    attributes:
      role:
        description: The accountability role an entry in parties holds.
        slot_uri: mx:role
        range: PartiesRoleEnum
        examples:
          - value: riskOwner
        status: mx:canonical
  RequestedActions:
    description: Structured value of the MX field requestedActions.
    attributes:
      kind:
        description: What sort of response one requested action asks of the reader.
        slot_uri: mx:kind
        range: RequestedActionsKindEnum
        examples:
          - value: pay
        status: mx:experimental
      target:
        description: The URI where the reader takes the requested action.
        slot_uri: mx:target
        range: string
        examples:
          - value: https://www.example-council.gov.uk/pay
        status: mx:experimental
      dueBy:
        description: >-
          The ISO 8601 UTC date-time by which one requested action must be taken, where it differs from the document's
          replyBy.
        slot_uri: mx:dueBy
        range: datetime
        examples:
          - value: '2026-11-28T17:00:00Z'
        status: mx:experimental
  ResidualRisk:
    description: Structured value of the MX field residualRisk.
    attributes:
      level:
        description: >-
          The residual-risk level, in the same vocabulary as security.riskLevel so one risk scale serves the action-cog,
          the workflow record and the chain.
        slot_uri: mx:level
        range: ResidualRiskLevelEnum
        examples:
          - value: low
        status: mx:canonical
      basis:
        description: One sentence stating why that level remains after the controls.
        slot_uri: mx:basis
        range: string
        examples:
          - value: Every model output is reviewed by the editor before it is filed; a misfiled draft is recoverable.
        status: mx:canonical
      acceptedBy:
        description: The role that accepted the residual risk, drawn from the provenance parties roles.
        slot_uri: mx:acceptedBy
        range: string
        examples:
          - value: deployer
        status: mx:canonical
      reviewedAt:
        description: The date the residual-risk statement was last reviewed. ISO 8601 (YYYY-MM-DD).
        slot_uri: mx:reviewedAt
        range: string
        status: mx:canonical
  ResourceProfile:
    description: Structured value of the MX field resourceProfile.
    attributes:
      basis:
        description: Whether a resourceProfile figure was measured, estimated or declared by a third party.
        slot_uri: mx:basis
        range: ResourceProfileBasisEnum
        examples:
          - value: estimated
        status: mx:canonical
  RiskTreatment:
    description: Structured value of the MX field riskTreatment.
    attributes:
      option:
        description: The treatment option chosen for a risk.
        slot_uri: mx:option
        range: RiskTreatmentOptionEnum
        examples:
          - value: modify
        status: mx:canonical
  SourceOfTruth:
    description: Structured value of the MX field sourceOfTruth.
    attributes:
      ref:
        description: The upstream record, as a repository path, an https URI or a REGINALD cogUrn.
        slot_uri: mx:ref
        range: string
        examples:
          - value: family/smith-tree.ged
        status: mx:experimental
      covers:
        description: >-
          Which of the document's facts the source is authoritative for; absent means all of them, and in a list of
          sources every entry but a single one should say.
        slot_uri: mx:covers
        range: string
        examples:
          - value: the people, families, dates and places in this document
        status: mx:experimental
      checkedOn:
        description: The ISO 8601 date on which the document was last derived from, or checked against, its source.
        slot_uri: mx:checkedOn
        range: string
        examples:
          - value: '2026-11-15'
        status: mx:experimental
  VerificationSteps:
    description: Structured value of the MX field verificationSteps.
    attributes:
      timestamp:
        description: The ISO 8601 timestamp of one verification step.
        slot_uri: mx:timestamp
        range: string
        examples:
          - value: '2026-09-17T08:51:12Z'
        status: mx:canonical
      agent:
        description: The person, system, or rule that performed the step.
        slot_uri: mx:agent
        range: string
        examples:
          - value: reginald.allabout.network
        status: mx:canonical
      method:
        description: The method the step applied.
        slot_uri: mx:method
        range: string
        examples:
          - value: ed25519-signature-check
        status: mx:canonical
      outcome:
        description: The outcome of the step.
        slot_uri: mx:outcome
        range: VerificationStepsOutcomeEnum
        examples:
          - value: pass
        status: mx:canonical
slots:
  accessibility:
    description: Accessibility compliance level or detailed accessibility metadata for a cog.
    slot_uri: mx:accessibility
    range: Any
    examples:
      - value: WCAG 2.1 AA
    status: mx:canonical
  accuracyCommitment:
    description: Publisher's commitment to content accuracy.
    slot_uri: mx:accuracyCommitment
    range: string
    examples:
      - value: All factual claims verified against source documentation
    status: mx:canonical
  actingFor:
    description: >-
      The principal an agent acts for: the person or organisation whose authority the mandate carries, as a name and an
      optional identifier URI.
    slot_uri: mx:actingFor
    range: Any
    status: mx:experimental
  actionLog:
    description: >-
      Where actions are recorded, each attributed to the agentId and agentVersion that took it, the principal it was
      taken for, and any approval it waited on, as a repo-root-relative path or a URI.
    slot_uri: mx:actionLog
    range: string
    examples:
      - value: https://agents.example.com/travel-assistant/log
    status: mx:experimental
  actions:
    description: The actions an object card offers on its object, declared so a human and an agent see the same list.
    slot_uri: mx:actions
    range: Actions
    multivalued: true
    status: mx:canonical
    inlined: true
    inlined_as_list: true
  admittedAgents:
    description: The agentId values of the agents a publishing point admits when its agentAccess is listed.
    slot_uri: mx:admittedAgents
    range: string
    multivalued: true
    status: mx:experimental
  affectedGroups:
    description: The individuals, groups or societies an impact assessment considers.
    slot_uri: mx:affectedGroups
    range: string
    multivalued: true
    status: mx:canonical
  agentAccess:
    description: >-
      Which agents a publishing point admits: open admits any agent, declared admits an agent that presents an agent
      cog, listed admits only the agents named in admittedAgents, and closed admits none.
    slot_uri: mx:agentAccess
    range: AgentAccessEnum
    examples:
      - value: declared
    status: mx:experimental
  agentActions:
    description: >-
      The most an admitted agent may do at a publishing point, from the mandate vocabulary; an agent's effective
      authority there is what both this list and its own mandate name.
    slot_uri: mx:agentActions
    range: AgentActionsEnum
    multivalued: true
    status: mx:experimental
  agentId:
    description: >-
      The stable identifier of the agent an agent cog describes, as a URI its developer controls, so a publishing point
      can recognise the same agent across sessions and check it against an admission list.
    slot_uri: mx:agentId
    range: string
    examples:
      - value: https://agents.example.com/travel-assistant
    status: mx:experimental
  agentInterface:
    description: >-
      The interface a publishing point offers agents in place of its human interface (an API, a Model Context Protocol
      server, a feed, a submission folder), as a URI or a repo-root-relative path.
    slot_uri: mx:agentInterface
    range: string
    examples:
      - value: https://cms.example.com/api/agents
    status: mx:experimental
  agentPermissions:
    description: >-
      The URL of the agent permission manifest that governs how an AI agent may act on this resource: an
      agent-permissions.json file (Lightweight Agent Standards Working Group) or an A2WF site manifest. A pointer, not a
      vocabulary; the manifest format owns the terms.
    slot_uri: mx:agentPermissions
    range: string
    examples:
      - value: https://example.com/.well-known/agent-permissions.json
    status: mx:experimental
  agentType:
    description: >-
      Classification of the subject's agentic nature. Distinct from `contentType` (which describes the document) and
      `role` (which describes functional hat-wearing).
    slot_uri: mx:agentType
    range: AgentTypeEnum
    examples:
      - value: ai-agent
    status: mx:canonical
  agentVersion:
    description: >-
      The release of the agent an agent cog describes, so a mandate given to one release is not read as given to the
      next.
    slot_uri: mx:agentVersion
    range: string
    examples:
      - value: 2.1.0
    status: mx:experimental
  ai:
    description: AI-related metadata. Contains disclosure, attribution, freshness policies for AI-generated content.
    slot_uri: mx:ai
    range: Any
    status: mx:canonical
  aiAssistance:
    description: 'AI assistance policy. Values: welcome, restricted, prohibited. Inheritable.'
    slot_uri: mx:aiAssistance
    range: AiAssistanceEnum
    examples:
      - value: restricted
    status: mx:canonical
  aiEditable:
    description: Whether this content can be edited by AI agents. In folder metadata defaults to true. Inheritable.
    slot_uri: mx:aiEditable
    range: boolean
    examples:
      - value: 'true'
    status: mx:canonical
  aiGenerationAllowed:
    description: Whether AI agents may generate new content for this document or folder. Inheritable.
    slot_uri: mx:aiGenerationAllowed
    range: boolean
    examples:
      - value: 'false'
    status: mx:canonical
  aiGenerationReviewRequired:
    description: Whether AI-generated content requires human review before it is trusted. Inheritable.
    slot_uri: mx:aiGenerationReviewRequired
    range: boolean
    examples:
      - value: 'false'
    status: mx:canonical
  aiInvolvement:
    description: >-
      How AI took part in making the file: unknown, none, used, ai-generated, or one sentence naming the model and the
      human who directed it.
    slot_uri: mx:aiInvolvement
    range: string
    examples:
      - value: Drafted by Claude (Anthropic), directed and approved by Tom Cranstoun
    status: mx:experimental
  aiPermittedAreas:
    description: Glob patterns for paths where AI generation is allowed.
    slot_uri: mx:aiPermittedAreas
    range: string
    multivalued: true
    status: mx:canonical
  aiProhibitedAreas:
    description: Glob patterns for paths where AI generation is prohibited.
    slot_uri: mx:aiProhibitedAreas
    range: string
    multivalued: true
    status: mx:canonical
  aiSensitivePaths:
    description: Glob patterns for paths that AI agents must not read or train on.
    slot_uri: mx:aiSensitivePaths
    range: string
    multivalued: true
    status: mx:canonical
  aiTraining:
    description: >-
      Training-data policy for this document or folder: whether its content may be used in AI training corpora. Values:
      allowed, prohibited, conditional. Inheritable. Trust lens.
    slot_uri: mx:aiTraining
    range: AiTrainingEnum
    examples:
      - value: conditional
    status: mx:canonical
  aiTrainingConditions:
    description: Conditions under which AI training is permitted, as an array of strings describing exclusions or requirements.
    slot_uri: mx:aiTrainingConditions
    range: string
    multivalued: true
    status: mx:canonical
  aiUsageDeclaration:
    description: >-
      A structured AI-usage declaration conforming to the draft-cranstoun-mx-ai-usage-declaration Gathering draft spec -
      conformance level, review schedule, subject, and publisher. Trust lens.
    slot_uri: mx:aiUsageDeclaration
    range: Any
    status: mx:canonical
  aiUsageDeclarationUri:
    description: >-
      The URL of the publisher's AI Usage Declaration that covers this document - the signed, scope-bounded record of
      what machines did and did not do in producing the work, per the Gathering's MX AI Usage Declaration note. The HTML
      carrier form is <link rel="ai-usage" href="..." type="application/json">.
    slot_uri: mx:aiUsageDeclarationUri
    range: string
    examples:
      - value: https://mx.allabout.network/AI-USAGE.json
    status: mx:canonical
  aimsScope:
    description: The boundary of the AI management system a statement of applicability covers.
    slot_uri: mx:aimsScope
    range: string
    examples:
      - value: AI systems that produce patient-facing content in the UK business unit.
    status: mx:canonical
  alternateFormats:
    description: >-
      The other renderings of this same document a reader may fetch instead - the markdown behind an HTML page, the PDF
      beside a report, the JSON record beside a human-readable declaration - each an object naming the rendering's uri
      and its format as an IANA media type. Aligns with Schema.org encoding; the HTML carrier form is the native <link
      rel="alternate" type="..." href="..."> element.
    slot_uri: schema:encoding
    range: AlternateFormats
    multivalued: true
    status: mx:canonical
    inlined: true
    inlined_as_list: true
  appendix:
    description: Appendix label or letter. Identifies an appendix within a manuscript volume.
    slot_uri: mx:appendix
    range: string
    examples:
      - value: M
    status: mx:canonical
  applicability:
    description: >-
      The conditions under which this document's content is in force. A reader that does not match a declared condition
      treats the document as not applicable to it.
    slot_uri: mx:applicability
    range: Applicability
    status: mx:canonical
    inlined: true
  appliesToSites:
    description: >-
      The sites a personal cog takes part on, as host patterns: an exact host such as shop.example.com, or a leading
      wildcard such as *.example.com or *.de that covers the domain and every host under it.
    slot_uri: mx:appliesToSites
    range: string
    multivalued: true
    status: mx:canonical
  approvedAt:
    description: The date an AIMS record was approved, ISO 8601 (YYYY-MM-DD); the approver is a parties entry with role approver.
    slot_uri: mx:approvedAt
    range: string
    status: mx:canonical
  assessedAt:
    description: The date an impact assessment was carried out, ISO 8601 (YYYY-MM-DD).
    slot_uri: mx:assessedAt
    range: string
    status: mx:canonical
  attestation:
    description: >-
      The registry's attestation record for the object, or a pointer to it, the trust signal that answers who published
      this and when.
    slot_uri: mx:attestation
    range: Any
    examples:
      - value: https://reginald.example.com/records/provenance-and-the-regulator
    status: mx:canonical
  attestationRecord:
    description: >-
      The registry attestation record for this artefact, or a pointer to it, naming who published the artefact and when.
      Answers "who vouched for this, and where can I check?"
    slot_uri: mx:attestationRecord
    range: string
    examples:
      - value: https://reginald.example.com/records/provenance-and-the-regulator
    status: mx:canonical
  attestationStatus:
    description: >-
      Whether this artefact has been attested by a registry yet. Answers "has anyone vouched for this, and was that
      decision made deliberately?"
    slot_uri: mx:attestationStatus
    range: AttestationStatusEnum
    examples:
      - value: unattested
    status: mx:canonical
  attribution:
    description: >-
      Whether reuse of this document's content must credit its source. required means a citation or credit is a
      condition of reuse; requested means the publisher asks for one without making it a condition; not-required means
      none is expected.
    slot_uri: mx:attribution
    range: AttributionEnum
    examples:
      - value: required
    status: mx:canonical
  audience:
    description: >-
      Intended readership. Broad enum category only. For specific named people, organisations, or roles, use
      `targetReaders` instead.
    slot_uri: dcterms:audience
    exact_mappings:
      - schema:audience
    range: Any
    any_of:
      - range: AudienceEnum
      - range: AudienceEnum
        multivalued: true
    status: mx:canonical
  author:
    description: Creator of the document. Person name or collaborative attribution.
    slot_uri: dc:creator
    exact_mappings:
      - schema:author
    range: string
    required: true
    examples:
      - value: Tom Cranstoun and Maxine
    status: mx:canonical
  authorship:
    description: 'Authorship classification. Values: solo, collaborative, generated, curated.'
    slot_uri: mx:authorship
    range: string
    status: mx:canonical
  barState:
    description: >-
      The state a signal bar displays, bound to a named field and its value rather than to a state that exists only in
      the rendering.
    slot_uri: mx:barState
    range: BarState
    status: mx:canonical
    inlined: true
  blocks:
    description: >-
      Declares block types present in the document. Values: prose, action, definition, essence, provenance, version,
      code, html, sop, security.
    slot_uri: mx:blocks
    range: BlocksEnum
    multivalued: true
    status: mx:canonical
  book:
    description: Which book this chapter belongs to.
    slot_uri: mx:book
    range: string
    examples:
      - value: 'MX: The Protocols'
    status: mx:canonical
  buildsOn:
    description: >-
      Context graph. Array of cog names this document builds upon. Soft dependency — provides context, not a hard
      requirement.
    slot_uri: mx:buildsOn
    range: string
    multivalued: true
    status: mx:canonical
  cacheability:
    description: >-
      How long an agent or resolver may cache this document's content before it must be re-fetched. Named tiers map to
      durations; the five tiers are the only accepted values.
    slot_uri: mx:cacheability
    range: CacheabilityEnum
    examples:
      - value: long-lived
    status: mx:canonical
  cancellationTerms:
    description: >-
      What cancelling a booking or order the document offers costs, and until when cancelling is free, so an agent can
      read the terms before it commits on its owner's behalf.
    slot_uri: mx:cancellationTerms
    range: CancellationTerms
    status: mx:experimental
    inlined: true
  canonicalUri:
    description: >-
      The permanent, globally unique URI where the authoritative copy of this document lives. A reader that meets a copy
      anywhere can walk back to the source.
    slot_uri: schema:url
    range: string
    examples:
      - value: https://raw.githubusercontent.com/Digital-Domain-Technologies-Ltd/MX-hub/main/README.md
    status: mx:canonical
  category:
    description: >-
      The functional grouping a document belongs to, declared at Zone 1a (top level) beside its identity, so a registry,
      a graph or an agent can group documents without opening the mx: block. Controlled vocabulary; see validValues.
    slot_uri: mx:category
    range: CategoryEnum
    examples:
      - value: mx-core
    status: mx:canonical
  chapter:
    description: Chapter number within the book.
    slot_uri: mx:chapter
    range: float
    examples:
      - value: '5'
    status: mx:canonical
  citeAs:
    description: >-
      The persistent identifier a reader uses when citing this document - a DOI, an ARK, a URN, or a stable URL - as a
      URI. canonicalUri says where the current copy lives; citeAs says what to write in a reference list, and the two
      may differ.
    slot_uri: schema:identifier
    exact_mappings:
      - dcterms:identifier
    range: string
    examples:
      - value: https://doi.org/10.5281/zenodo.1234567
    status: mx:canonical
  claimBasis:
    description: >-
      How this document's load-bearing claims are known, taken as a whole: asserted, inferred, observed, corroborated,
      contested, or mixed when the claims differ.
    slot_uri: mx:claimBasis
    range: ClaimBasisEnum
    examples:
      - value: mixed
    status: mx:canonical
  claims:
    description: >-
      The load-bearing claims this document or record makes, each an object naming the statement, its basis, and the
      evidence that basis requires.
    slot_uri: mx:claims
    range: Claims
    multivalued: true
    status: mx:canonical
    inlined: true
    inlined_as_list: true
  classification:
    description: Content classification identifier. Context-dependent; prefer existing taxonomies over local values.
    slot_uri: mx:classification
    range: string
    status: mx:canonical
  cmsArchitecture:
    description: >-
      How the CMS delivers content: coupled (it renders the pages it serves), headless (it serves content through an API
      for other systems to render), decoupled (it renders through a separate front end it also manages),
      static-generator (it builds static files ahead of serving), or hybrid.
    slot_uri: mx:cmsArchitecture
    range: CmsArchitectureEnum
    examples:
      - value: static-generator
    status: mx:experimental
  cmsProduct:
    description: The name of the content management system a CMS cog describes, as its vendor names it.
    slot_uri: mx:cmsProduct
    range: string
    examples:
      - value: Example CMS
    status: mx:experimental
  cmsVersion:
    description: The release of the CMS the instance runs, as its vendor numbers it.
    slot_uri: mx:cmsVersion
    range: string
    examples:
      - value: '10.4'
    status: mx:experimental
  cogId:
    description: Unique cog identifier within the registry.
    slot_uri: mx:cogId
    range: string
    examples:
      - value: field-dictionary
    status: mx:canonical
  cogType:
    description: 'Cog type classification. Values: info, action, routing.'
    slot_uri: mx:cogType
    range: CogTypeEnum
    examples:
      - value: info
    status: mx:canonical
  cogTypes:
    description: >-
      The types one cog carries at once, when it is more than its top-level type: a roadmap that is also a
      smart-contract lists both. The top-level type stays the primary identity; a reader or runner that handles one of
      the listed types treats the cog as that type too.
    slot_uri: mx:cogTypes
    range: string
    multivalued: true
    status: mx:experimental
  cogs:
    description: 'Canonical field: cogs.'
    slot_uri: mx:cogs
    range: string
    status: mx:canonical
  completeness:
    description: >-
      Whether the enumeration a document carries is exhaustive, what it covers, and the date that holds, so a reader can
      tell an entry that is absent from one the document never set out to list.
    slot_uri: mx:completeness
    range: Completeness
    status: mx:canonical
    inlined: true
  confidenceMethod:
    description: How a confidence value was derived.
    slot_uri: mx:confidenceMethod
    range: string
    examples:
      - value: weighted-step-outcomes
    status: mx:canonical
  confidential:
