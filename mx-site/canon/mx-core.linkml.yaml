    slot_uri: mx:preview
    range: string
    examples:
      - value: https://mx.allabout.network/images/previews/provenance-regime-compatibility.png
    status: mx:canonical
  primaryLanguages:
    description: Primary programming or content languages in the folder.
    slot_uri: mx:primaryLanguages
    range: string
    multivalued: true
    status: mx:canonical
  principalAttestation:
    description: >-
      A pointer to an attestation record, issued by a party other than the agent's provider or deployer, that vouches
