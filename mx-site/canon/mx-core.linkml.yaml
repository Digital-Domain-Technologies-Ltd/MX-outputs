      Canonical URL of the file's AI-governance provenance cog, the hosted record that stands beside the file and holds
      the parties, frameworks, and every recorded action. Lets a machine reach the live, authoritative provenance chain
      without the chain embedded in the file itself.
    slot_uri: mx:provenanceUri
    range: string
    examples:
      - value: https://mx.allabout.network/blog/governance-when-ai-acts.mxprov.json
    status: mx:canonical
  publicationDate:
