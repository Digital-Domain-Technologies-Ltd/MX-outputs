    slot_uri: schema:citation
    range: string
    multivalued: true
    status: mx:canonical
  relatedFolders:
    description: Related folders with path, relationship type, and description.
    slot_uri: mx:relatedFolders
    range: string
    multivalued: true
    status: mx:canonical
  relatedTo:
    description: >-
      Sibling documents and resources this one relates to without depending on or describing them. The loosest of the
      relation fields: dependencies declares hard requirements, buildsOn declares conceptual ancestry, refersTo declares
      informational citations, relatedTo declares adjacency.
    slot_uri: schema:isRelatedTo
    range: string
    multivalued: true
    status: mx:canonical
  relationshipField:
    description: The name of the relationship field a relationship line renders, which is also the line's direction.
    slot_uri: mx:relationshipField
    range: RelationshipFieldEnum
    examples:
      - value: buildsOn
    status: mx:canonical
  replacedBy:
    description: >-
      Pointer to the canonical document that supersedes this one. Either a path string or an object with named keys
      (e.g. {prose: ..., data: ...}) when the replacement spans multiple documents.
    slot_uri: mx:replacedBy
    range: Any
    examples:
      - value: datalake/manuscripts/mx-books/mx-appendices/appendix-m-index-of-metadata.md
    status: mx:canonical
  replaces:
    description: 'Canonical field: replaces.'
    slot_uri: mx:replaces
    range: string
    status: mx:canonical
  replyBy:
