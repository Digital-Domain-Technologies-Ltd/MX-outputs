    slot_uri: mx:machineOutputs
    range: MachineOutputsEnum
    multivalued: true
    status: mx:experimental
  maintainedBy:
    description: Person or team who last confirmed the cog content is accurate.
    slot_uri: mx:maintainedBy
    range: string
    examples:
      - value: Tom Cranstoun
    status: mx:canonical
  maintainedDate:
    description: Date the cog was last confirmed accurate by its maintainer. ISO 8601 format (YYYY-MM-DD).
    slot_uri: mx:maintainedDate
    range: string
    status: mx:canonical
  maintainer:
    description: >-
      Person or team responsible for maintaining this document. Distinct from author — maintainer handles ongoing
      updates.
    slot_uri: schema:maintainer
    range: string
    examples:
      - value: Maxine
    status: mx:canonical
  mandate:
    description: >-
      The kinds of action an agent holds its principal's authority for, from a fixed vocabulary that a publishing-point
      cog's agentActions and humanApprovalFor use too.
    slot_uri: mx:mandate
    range: MandateEnum
    multivalued: true
    status: mx:experimental
  mcpServer:
