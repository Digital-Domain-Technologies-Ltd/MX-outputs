    slot_uri: mx:replyBy
    range: datetime
    examples:
      - value: '2026-12-01T17:00:00Z'
    status: mx:experimental
  requestedActions:
    description: >-
      What a piece of correspondence (a letter, a notice, a bill) asks its reader to do, one entry per action, so an
