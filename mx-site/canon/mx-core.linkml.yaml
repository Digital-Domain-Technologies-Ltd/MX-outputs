      accountable person or a registered organisation.
    slot_uri: mx:principalAttestation
    range: string
    examples:
      - value: https://reginald.example.com/attestations/principal/7f3c9a
    status: mx:experimental
  principalAttestationFor:
    description: >-
      The kinds of action, from the mandate vocabulary, for which a publishing point requires an admitted agent to
      present a principalAttestation the point can verify.
    slot_uri: mx:principalAttestationFor
    range: PrincipalAttestationForEnum
    multivalued: true
    status: mx:experimental
  project:
    description: Project metadata object. Contains name, description, repository, documentation.
    slot_uri: mx:project
    range: Any
    status: mx:canonical
  proofOfAuthorship:
    description: >-
      A verifiable link between the named author and the artefact: a cryptographic signature, a trust-chain identifier
      such as a DID, or a published-by-known-entity assertion. Answers "I made this, and I can prove it."
    slot_uri: mx:proofOfAuthorship
    range: Any
    status: mx:canonical
  provenanceOrigin:
    description: How the content was created.
    slot_uri: mx:provenanceOrigin
    range: ProvenanceOriginEnum
    examples:
      - value: human-directed
    status: mx:canonical
  provenancePedigree:
    description: >-
      The traceable chain from this artefact back to its source, including every transformation along the way, with the
      authority at each step. Answers "where did this come from, and through whom?"
    slot_uri: mx:provenancePedigree
    range: Any
    status: mx:canonical
  provenanceUri:
