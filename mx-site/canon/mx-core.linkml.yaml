      Describes one Model Context Protocol server at one transport endpoint: who runs it, the exact tool, resource and
      prompt lists it serves (as digests), what it may return, where it may send data, and its registry status, so an
      agent can check the live server against the record before every session and refuse it on any mismatch. The block
      is defined in the open standard (fields-data.yaml, blockTypes: mcpServer).
    slot_uri: mx:mcpServer
    range: Any
    status: mx:experimental
  messageId:
    description: >-
      A unique, stable identifier the sender gives one message, so a reply, a receipt or an audit can name exactly this
      message.
    slot_uri: schema:identifier
    range: string
    examples:
      - value: urn:uuid:6f1c2a0e-8b7d-4c3e-9a51-2d0f4e7b9c11
    status: mx:experimental
  metadataFields:
    description: >-
      The frontmatter fields that are mutable without invalidating the document's signature or attestation - editorial
      metadata such as created/modified dates, not normative content.
    slot_uri: mx:metadataFields
    range: string
    multivalued: true
    status: mx:canonical
  mitigations:
    description: >-
      The measures that address the impacts an assessment identifies, each naming the impact it addresses and its owning
      role.
    slot_uri: mx:mitigations
    range: string
    multivalued: true
    status: mx:canonical
  modified:
    description: Last modification date. ISO 8601 format (YYYY-MM-DD).
    slot_uri: dcterms:modified
    exact_mappings:
      - schema:dateModified
    range: string
    required: true
    examples:
      - value: '2026-03-02'
    status: mx:canonical
  movedDate:
    description: Date content was relocated. ISO 8601 format (YYYY-MM-DD).
    slot_uri: mx:movedDate
    range: string
    status: mx:canonical
  movedFrom:
    description: Previous file path before content was relocated.
    slot_uri: mx:movedFrom
    range: string
    examples:
      - value: datalake/knowledge/reference/field-definitions.md
    status: mx:canonical
