      source changes.
    slot_uri: mx:mx:stability
    range: MxStabilityEnum
    examples:
      - value: '@mx:stability stable'
    status: mx:canonical
  mx:tags:
    description: Discovery keywords as comma-separated string.
    slot_uri: mx:mx:tags
    range: string
    examples:
      - value: <meta name="mx:tags" content="metadata, yaml, frontmatter">
    status: mx:canonical
  mx:todo:
    description: Line annotation for tasks to complete.
    slot_uri: mx:mx:todo
    range: string
    examples:
      - value: // @mx:todo refactor Extract to separate function
    status: mx:canonical
  mx:type:
    description: Domain type classification.
    slot_uri: mx:mx:type
    range: string
    examples:
      - value: <meta name="mx:type" content="specification">
    status: mx:canonical
  mx:version:
    description: Version. Equivalent to version in YAML frontmatter.
    slot_uri: mx:mx:version
    range: string
    examples:
      - value: <meta name="mx:version" content="2.0">
    status: mx:canonical
  mxCompliance:
    description: MX compliance level or detailed compliance metadata for a published cog.
    slot_uri: mx:mxCompliance
    range: Any
    examples:
      - value: level-3
    status: mx:canonical
  mxSpecVersion:
    description: >-
      The version of the MX specification a document's metadata follows, so a machine knows which rules to read it by.
      Distinct from version, which is the document's own version.
    slot_uri: mx:mxSpecVersion
    range: MxSpecVersionEnum
    examples:
      - value: '0.9'
    status: mx:canonical
  mxWatchesFiles:
    description: >-
      Array of file paths this document watches for changes. Used by MX OS to trigger re-evaluation when watched files
      are modified.
    slot_uri: mx:mxWatchesFiles
    range: string
    multivalued: true
    status: mx:canonical
  narrativeContext:
    description: The URI of fuller editorial context a narrative layer points a human reader to.
    slot_uri: mx:narrativeContext
    range: string
    examples:
      - value: https://mx.allabout.network/blog/provenance-is-an-evidence-vehicle.html
    status: mx:canonical
  openQuestions:
    description: >-
      The questions this document leaves open, each saying what it is about, who can answer it, and, once answered, the
      answer and who gave it, so a later reader or engine knows what is not yet known.
    slot_uri: mx:openQuestions
    range: OpenQuestions
    multivalued: true
    status: mx:experimental
    inlined: true
    inlined_as_list: true
  operatesAt:
    description: >-
      The publishing points and systems an agent's mandate covers, as host patterns in the form appliesToSites uses or
      as URIs.
    slot_uri: mx:operatesAt
    range: string
    multivalued: true
    status: mx:experimental
  originator:
    description: >-
      The identity that originated this document or specification. Zone 1 (immutable, alongside author), distinct from
