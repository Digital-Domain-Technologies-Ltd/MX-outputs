    range: string
    examples:
      - value: https://mx.allabout.network/blog/governance/example-post.html
    status: mx:canonical
  servedPdfUri:
    description: >-
      The public http(s) URL where the PDF rendered from this document is served, so a reader of the source can reach
      the published rendering and a tool can link a reader of the PDF back to it.
    slot_uri: schema:encoding
    range: string
    examples:
      - value: https://mx.allabout.network/mx-explained.pdf
    status: mx:canonical
  slug:
    description: >-
      Stable kebab-case handle for identities, contacts, and entities. Used as a routing key in Reginald, a lookup key
      in CRM, and the URL slug. NOT a document title; for that use `title`.
    slot_uri: mx:slug
    range: string
    examples:
      - value: maxine
    status: mx:canonical
  smartContract:
    description: >-
      The deterministic rule a smart-contract cog carries: the facts it reads, each with a type, the condition over
      those facts, and the result and allow-listed actions that follow when the condition holds.
    slot_uri: mx:smartContract
    range: Any
    examples:
      - value: >-
          {id: overdue-invoice-notice, facts: {invoice.id: string, invoice.status: string, invoice.daysOverdue: number},
          when: {all: [{fact: invoice.status, op: eq, value: unpaid}, {fact: invoice.daysOverdue, op: gte, value: 30}]},
          then: {result: {notice: overdue, invoice: {fact: invoice.id}}}}
    status: mx:experimental
  snapPoints:
    description: The positions a grid mount lets a component occupy.
    slot_uri: mx:snapPoints
    range: string
    multivalued: true
    status: mx:canonical
  source:
    description: Origin source material or input files. References where the content was derived from.
    slot_uri: mx:source
    range: Any
    any_of:
      - range: string
      - range: string
        multivalued: true
    examples:
      - value: brainstorm.md
    status: mx:canonical
  sourceOfTruth:
    description: >-
      The upstream record this document's facts come from, such as a GEDCOM file, a registry entry, a contract or a
      dataset; when the document and that record disagree, the record wins and the document is derived again. One object
      for one source, or a list of them when the facts come from several, each naming what it covers.
    slot_uri: prov:hadPrimarySource
    range: SourceOfTruth
    status: mx:experimental
    inlined: true
  speakable:
    description: >-
      A voice-assistant-readable summary of this document, matching Schema.org's SpeakableSpecification intent - the
      passage a text-to-speech agent should read aloud.
    slot_uri: schema:speakable
    range: string
    status: mx:canonical
  spendLimit:
    description: >-
      The most an agent may commit under a pay mandate: an amount, an ISO 4217 currency code, and the period the amount
      covers (transaction, day, week or month).
    slot_uri: mx:spendLimit
    range: Any
    status: mx:experimental
  stability:
    description: >-
      Content stability. Values: stable, evolving, experimental, deprecated, archived, draft, final, friable. friable
      means the file is regenerated from a source and must never be hand-edited; any given rendering is transient and is
      remade when its source changes. Use it for generated indexes and for generated outputs (such as published blog
      HTML) regenerated from source. A file may carry one value or several: the values combine, so an item that is both
      an unfinished draft and regenerated from source declares [draft, friable].
    slot_uri: mx:stability
    range: Any
    any_of:
      - range: StabilityEnum
      - range: StabilityEnum
        multivalued: true
    examples:
      - value: stable
    status: mx:canonical
  stack:
    description: Technical stack object. Contains language, runtime, version.
    slot_uri: mx:stack
    range: Any
    status: mx:canonical
  status:
    description: >-
      Lifecycle state. Standard values: draft, active, published, deprecated, archived, unknown. Decision records:
      proposed, accepted, rejected, superseded. Workflow: pending, review, approved, planning, open, closed, sent.
      Standing: disputed (the content is under challenge and a consumer should weigh it as contested), withdrawn (the
      publisher no longer stands behind the content and a consumer should stop using it). Special: canonical.
    slot_uri: mx:status
    range: StatusEnum
    examples:
      - value: active
    status: mx:canonical
  statusNote:
    description: >-
      Freetext detail accompanying `status`. Use when status has meaningful context beyond the enum value — e.g. status:
      active with statusNote: 'Phase 1 Complete, Phase 2 in design'.
    slot_uri: mx:statusNote
    range: string
    examples:
      - value: Patent files in separate repo
    status: mx:canonical
  statusNotice:
    description: >-
      Why a document carries the status disputed or withdrawn, the date that standing began, and whom a reader contacts
      about it.
    slot_uri: mx:statusNotice
    range: Any
    status: mx:canonical
  stewardship:
    description: >-
      Zone 2 (mutable) authorship object grouping the four roles distinct from the immutable Zone 1 originator/author:
      steward, accountableContact, legalEntity, brand.
    slot_uri: mx:stewardship
    range: Any
    status: mx:canonical
  styleToken:
    description: The declared styling token for a signal bar's state, so one state looks the same everywhere it appears.
    slot_uri: mx:styleToken
    range: string
    examples:
      - value: token:mx-state-valid
    status: mx:canonical
  subtitle:
    description: Secondary title displayed below the main title. Used by book chapters, presentations, and articles.
    slot_uri: mx:subtitle
    range: string
    examples:
      - value: Why this metadata matters for AI agents
    status: mx:canonical
  summary:
    description: >-
      A longer prose overview of what this document does, in paragraph form. Distinct from description (short,
      SEO-scoped, top-level) and purpose (single-sentence why, and on cog-spec documents a structured {kind, subPurpose}
      taxonomy object rather than prose).
    slot_uri: mx:summary
    range: string
    examples:
      - value: >-
          Normative specification for the cog v1 magic-header HTML comment and its cogHeader frontmatter equivalent.
          Defines the grammar, the conventional keys, and the equivalence rule.
    status: mx:canonical
  supersededBy:
    description: 'Canonical field: supersededBy.'
    slot_uri: mx:supersededBy
    range: string
    status: mx:canonical
  supersedes:
    description: >-
      The document or documents this one replaces, by path, identifier or versioned name. The inverse of supersededBy,
      so a reader can walk a replacement in either direction.
    slot_uri: mx:supersedes
    range: Any
    any_of:
      - range: string
      - range: string
        multivalued: true
    examples:
      - value: mx-machine-readiness@2.1
    status: mx:canonical
  supportContact:
    description: Contact address (email, URL) for questions about this document's content. Operational-governance lens.
    slot_uri: mx:supportContact
    range: string
    examples:
      - value: info@cognovamx.com
    status: mx:canonical
  systemRef:
    description: >-
      A reference to the AI system inventory entry an AIMS record concerns, as a repository path, an https URI or a
      REGINALD cogUrn.
    slot_uri: mx:systemRef
    range: string
    examples:
      - value: https://example.org/aims/systems/leaflet-summariser.md
    status: mx:canonical
  tags:
    description: Discovery keywords. Array of strings for search, filtering, and agent matching.
    slot_uri: dc:subject
    exact_mappings:
      - schema:keywords
    range: string
    multivalued: true
    status: mx:canonical
  targetReaders:
    description: >-
      Specific named people, organisations, or roles this content addresses. Freetext companion to `audience` (which is
      enum-only). Use when you need to record 'Janus Boye, Founder, Boye & Company' or 'Business leaders, CTOs, product
      owners' — specificity that doesn't fit the audience enum.
    slot_uri: mx:targetReaders
    range: Any
    any_of:
      - range: string
      - range: string
        multivalued: true
    examples:
      - value: Janus Boye, Founder, Boye & Company
    status: mx:canonical
  temporalAnchors:
    description: >-
      Named date anchors the document's prose depends on. Each key is a stable kebab-case identifier; each value pairs
      the anchor's current date with a description and, where the authoritative value is published elsewhere, its
      source.
    slot_uri: mx:temporalAnchors
    range: Any
    status: mx:canonical
  temporalComputedFields:
    description: >-
      Fields whose values are computed from anchors at render time. Each key names a computed field; each value names
      the anchor it is computed from and the computation to apply. A render-time agent never caches the result beyond a
      single render.
    slot_uri: mx:temporalComputedFields
    range: Any
    status: mx:canonical
  temporalProseGuidance:
    description: >-
      Author-supplied instructions telling a future steward, human or machine, what to review or rewrite in the prose
      when a named anchor moves. Each key is an anchor identifier from temporalAnchors.
    slot_uri: mx:temporalProseGuidance
    range: Any
    status: mx:canonical
  temporalStance:
    description: >-
      Declares the document's relationship between its prose and the dates the prose describes: frozen (the prose
      records state at publication and its dates do not move), living (the prose reflects state at fetch time and
      date-derived values are recomputed against the reader's clock), or anchored (the prose contains values computed
      from declared anchors and moves with them).
    slot_uri: mx:temporalStance
    range: TemporalStanceEnum
    examples:
      - value: anchored
    status: mx:canonical
  termGlossary:
    description: >-
      The load-bearing terms a document binds, each mapped to the sense it carries in this document, so a reader, a
      translator or an agent applies that sense instead of inferring one.
    slot_uri: mx:termGlossary
    range: Any
    status: mx:canonical
  termReadings:
    description: >-
      The reading a term carries in this document, for each term a machine could read more than one way. Each entry
      names the term, the reading it carries here, and optionally the registry or glossary that defines that reading.
    slot_uri: mx:termReadings
    range: string
    multivalued: true
    status: mx:experimental
  title:
    description: Human-readable document title. The canonical identity field for all documents including cog files.
    slot_uri: dc:title
    range: string
    required: true
    examples:
      - value: MX Field Dictionary
    status: mx:canonical
  topic:
    description: >-
      The specific subject-area classification of this document, distinct from the general-discovery tags array. Aligns
      with Schema.org about.
    slot_uri: schema:about
    range: string
    multivalued: true
    status: mx:canonical
  trainingDataPolicy:
    description: >-
      Whether and how this document's content may be used in AI training corpora - permitted, restricted, or conditional
      on attribution. Trust lens: states the terms under which the content may be reused for training.
    slot_uri: mx:trainingDataPolicy
    range: string
    examples:
      - value: permitted-with-attribution
    status: mx:canonical
  transformations:
    description: >-
      The preparation steps applied to the data a document derives from, each naming its type, method, tool, date and
      the parties role that performed it.
    slot_uri: mx:transformations
    range: string
    multivalued: true
    status: mx:canonical
  translationOfWork:
    description: >-
      On a translated document, the canonicalUri of the source work it was translated from. Aligns with Schema.org
      translationOfWork.
    slot_uri: schema:translationOfWork
    range: string
    examples:
      - value: https://mx.allabout.network/letters/apology.md
    status: mx:canonical
  translator:
    description: 'Who or what performed a translation: a person''s name or a model identifier. Aligns with Schema.org translator.'
    slot_uri: schema:translator
    range: string
    examples:
      - value: Maxine (claude-opus-4-8)
    status: mx:canonical
  type:
    description: >-
      Document kind. OKF reserved top-level field naming what the file is, so a machine selects the right handling
      before reading the body. Common values include info-doc, action, blog-post, report, guide, skill, hook,
      routing-doc, and cogs; the set is open because document kinds grow with the estate.
    slot_uri: dc:type
    range: string
    examples:
      - value: info-doc
    status: mx:canonical
  updateTriggers:
    description: Conditions that trigger a cog update. Array of trigger descriptions.
    slot_uri: mx:updateTriggers
    range: string
    multivalued: true
    status: mx:canonical
  url:
    description: >-
      The canonical external URL of the entity this record represents, per the Schema.org `url` property for the
      declared `schema` type (Person, Organization, BlogPosting). Distinct from `canonicalUri`, which is the
      GitHub-hosted source-of-truth location of this markdown file itself.
    slot_uri: schema:url
    range: string
    examples:
      - value: https://allabout.network
    status: mx:canonical
  usage:
    description: Usage classification. Free-form; prefer existing vocabularies (Schema.org usageInfo, Dublin Core audience).
    slot_uri: schema:usageInfo
    range: string
    status: mx:canonical
  validatesAgainst:
    description: >-
      The schema(s) or spec(s) this document claims conformance against. Describes the document's claimed conformance
      (trust lens).
    slot_uri: mx:validatesAgainst
    range: string
    multivalued: true
    status: mx:canonical
  validationStatus:
    description: >-
      Outcome of the most recent validation of this document or of the run it reports, such as PASS or FAIL. A signal
      bar can bind to it.
    slot_uri: mx:validationStatus
    range: string
    examples:
      - value: PASS
    status: mx:canonical
  verificationChanged:
    description: The ISO 8601 timestamp of the last change in the object's verification state.
    slot_uri: mx:verificationChanged
    range: string
    examples:
      - value: '2026-09-17T08:51:12Z'
    status: mx:canonical
  verificationSteps:
    description: The steps of the verification trail, each timestamped and attributed to the agent that performed it.
    slot_uri: mx:verificationSteps
    range: VerificationSteps
    multivalued: true
    status: mx:canonical
    inlined: true
    inlined_as_list: true
  verificationSummary:
    description: A one-line statement of the outcome of the verification trail a verification panel exposes.
    slot_uri: mx:verificationSummary
    range: string
    examples:
      - value: Attested by the publisher, current version, publisher active, one claim corroborated.
    status: mx:canonical
  version:
    description: Semantic version string. Lives in frontmatter, never in filenames.
    slot_uri: schema:version
    range: string
    examples:
      - value: '2.0'
    status: mx:canonical
  visualWeight:
    description: >-
      The styling token that sets a relationship line's weight, derived from confidence for an inferred relationship and
      fixed for a declared one.
    slot_uri: mx:visualWeight
    range: string
    examples:
      - value: token:mx-line-declared
    status: mx:canonical
  volatileValues:
    description: >-
      Declares that one or more values stated in the body (a price, an exchange rate, an interest rate, a stock level,
      an availability figure) are snapshots of a value that moves, records when each was observed and until when it may
      be quoted, and points at the mechanism a machine calls for the current value.
    slot_uri: schema:priceValidUntil
    exact_mappings:
      - schema:priceCurrency
      - schema:EntryPoint
    range: string
    multivalued: true
    status: mx:canonical
  words:
    description: >-
      Spell-checker dictionary entries. Declares which terms are valid vocabulary. Distinct from tags — words validates
      spelling, tags enables discovery.
    slot_uri: mx:words
    range: string
    multivalued: true
    status: mx:canonical
  workTranslation:
    description: >-
      On a source document, the canonicalUris of works that are translations of it (the inverse of translationOfWork).
      Aligns with Schema.org workTranslation.
    slot_uri: schema:workTranslation
    range: string
    multivalued: true
    status: mx:canonical
  workflowId:
    description: >-
      Stable identifier of the workflow record that declares the boundary a document or a provenance chain was produced
      under: the tasks and authority given to the agent, the points where a human decides, and the residual risk
      accepted. Conventionally a slug naming the team and the process.
    slot_uri: mx:workflowId
    range: string
    examples:
      - value: survey-team-adaptive-interviewing
    status: mx:canonical
  workflowRecord:
    description: >-
      Where the workflow record named by workflowId lives: a repo-root-relative path or a URL, so a reader walks from a
      document or a provenance chain to the declared boundary in one step.
    slot_uri: mx:workflowRecord
    range: string
    examples:
      - value: workflows/survey-team-adaptive-interviewing.md
    status: mx:canonical
