    slot_uri: mx:publicationDate
    range: string
    status: mx:canonical
  publishedTo:
    description: >-
      Downstream provenance — where this content is published. Can be a relative path within the repository or an
      external URL. Used by the MX graph to build lineage edges tracing content from source to published destination.
    slot_uri: mx:publishedTo
    range: string
    examples:
      - value: https://allabout.network/blogs/mx/
    status: mx:canonical
  publisher:
    description: Entity that publishes and stands behind this cog. Can be a string (name) or object with name, url, and contact.
    slot_uri: mx:publisher
    range: Any
    examples:
      - value: CogNovaMX Ltd
    status: mx:canonical
  publishingPointKind:
    description: The kind of publishing point a publishing-point cog describes.
    slot_uri: mx:publishingPointKind
    range: PublishingPointKindEnum
    examples:
      - value: cms
    status: mx:experimental
  publishingPoints:
    description: >-
      The publishing points the CMS controls, as URIs or repo-root-relative paths of their publishing-point cogs, or as
      the URLs they serve where no cog exists yet.
    slot_uri: mx:publishingPoints
    range: string
    multivalued: true
    status: mx:experimental
  pulse:
    description: Whether a signal bar or badge animates a state change in addition to conveying it in text.
    slot_uri: mx:pulse
    range: boolean
    examples:
      - value: 'false'
    status: mx:canonical
  purpose:
    description: Free-text statement of why this document exists. Single sentence.
    slot_uri: schema:abstract
    range: string
    examples:
      - value: Reference for any contributor adding metadata to non-markdown files.
    status: mx:canonical
  quotes:
    description: >-
      The verbatim spans in this document that are someone else's words, external blockquotes, cited passages and quoted
      fragments, each entry the exact text as it appears in the body.
    slot_uri: mx:quotes
    range: string
    multivalued: true
    status: mx:canonical
  readingLevel:
    description: 'Content reading level. Values: beginner, intermediate, advanced, expert.'
    slot_uri: mx:readingLevel
    range: ReadingLevelEnum
    examples:
      - value: intermediate
    status: mx:canonical
  recordId:
    description: The organisation's own identifier for an AIMS record, stable across versions of the record.
    slot_uri: mx:recordId
    range: string
    examples:
      - value: R-014
    status: mx:canonical
  refersTo:
