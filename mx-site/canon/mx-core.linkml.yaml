    slot_uri: mx:originator
    range: string
    examples:
      - value: Tom Cranstoun
    status: mx:canonical
  ownership:
    description: Ownership details. Can be a string (owner name) or object with owner, delegate, and contact.
    slot_uri: mx:ownership
    range: Any
    examples:
      - value: Tom Cranstoun
    status: mx:canonical
  pages:
    description: Number of pages in a document, book, or PDF.
    slot_uri: mx:pages
    range: float
    examples:
      - value: '42'
    status: mx:canonical
  partOf:
    description: Parent collection, suite, or initiative.
    slot_uri: dcterms:isPartOf
    range: string
    examples:
      - value: mx-the-gathering
    status: mx:canonical
  parties:
    description: >-
      The role-attributed people and organisations accountable for a document, each entry carrying a role, a name, and
      optionally an email, an identifier URL, an organisation and an ISO 3166-1 country code.
    slot_uri: mx:parties
    range: Parties
    multivalued: true
    status: mx:canonical
    inlined: true
    inlined_as_list: true
  personalIdentity:
    description: The identity a personal cog belongs to, such as personal, consultant or author; base places it in every identity.
    slot_uri: mx:personalIdentity
    range: string
    examples:
      - value: base
    status: mx:canonical
  personalKind:
    description: >-
      What a personal cog declares about its owner, from a fixed set of kinds a reader app matches against the cogs it
      meets.
    slot_uri: mx:personalKind
    range: PersonalKindEnum
    examples:
      - value: dietary
    status: mx:canonical
  personalRole:
    description: >-
      The roles in which a personal cog takes part, such as consumer, trade-buyer or carer; any places it in every role.
