    slot_uri: mx:mx:ai
    range: string
    examples:
      - value: '// @mx:ai do-not-remove This null check prevents crash in edge case #1234'
    status: mx:canonical
  mx:audience:
    description: Intended readership.
    slot_uri: mx:mx:audience
    range: string
    examples:
      - value: '@mx:audience developer'
    status: mx:canonical
