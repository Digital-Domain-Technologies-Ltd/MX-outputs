    slot_uri: mx:personalRole
    range: string
    multivalued: true
    status: mx:canonical
  policy:
    description: Content handling rules for agents. Inherited from uber docs via effective doc resolution.
    slot_uri: mx:policy
    range: Any
    examples:
      - value: inherit from parent uber-doc
    status: mx:canonical
  preview:
