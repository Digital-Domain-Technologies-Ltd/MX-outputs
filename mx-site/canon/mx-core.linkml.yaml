    range: string
    multivalued: true
    status: mx:canonical
  refersToExternal:
    description: >-
      The external works this document draws on or cites, one entry per work, each a citation string a reader can
      resolve without the repository: author, title, venue or publisher, date, and an identifier such as an arXiv number
      or a URL. The outward counterpart of refersTo, which carries repository-relative paths. Aligns with Schema.org
      citation; the HTML carrier emits it as the JSON-LD citation property, the element form of <cite> and <blockquote
