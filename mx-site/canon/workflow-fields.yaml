title: MX Workflow Fields
version: '2.0'
created: '2026-05-08'
modified: '2026-10-12'
author: Tom Cranstoun
description: 'Field dictionary for workflow and process metadata used by tooling artefacts that borrow markdown frontmatter syntax. These fields describe submission acts, build acts, audit acts, and similar process state. They are NOT part of the open MX standard and NOT vendor extensions to the content vocabulary; they are workflow vocabulary that lives in its own dictionary so the canon and the vendor-extensions file stay focused on document content.'
mx:
  status: active
  category: workflow
  partOf: mx-cognovamx-tooling
  tags:
  - fields
  - workflow
  - process
  - metadata
  audience:
  - machines
  - humans
  contentType: field-dictionary
  runbook: |
    Workflow vocabulary for tooling artefacts. Each profile groups fields used by a specific workflow:
      - submission-package: fields used by /mx-gathering-submit cover-note packages
      - workflow-record: fields carried by a record of one AI-augmented workflow, the shared
        evidence shape for the six augmentation conditions
      - (future) audit-run, build-output, etc.
    A file using workflow fields declares its workflow via its directory location plus a contentType
    that matches the profile name. The validator loads this dictionary alongside fields-data.yaml and
    cognovamx-fields.yaml so workflow fields count as known.

  profiles:
    - name: submission-package
      description: Fields carried by the cover-note packages produced by /mx-gathering-submit when filing
        a draft to The Gathering's Stream community-review process. The package is a transient artefact
        that records which draft is being submitted, at which commit, on which date, via which path.
        Stream itself does not mandate this packaging shape; it is a CogNovaMX tooling convention so
        that the round-trip (prepare, file, feedback, incorporate, ratify) is auditable.
      header: |
        ---
        # Carrier: cover-note package written by /mx-gathering-submit
        # --- Zone 1a: Identity ---
        title: "Submission package: draft-cranstoun-mx-cogs"
        description: "Cover note for filing the cogs draft to the Stream review."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: submission-package
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          package: draft-cranstoun-mx-cogs-2026-09-14
          versionSubmitted: "02"
          preparedAt: 2026-09-14
          draftPath: draft-cranstoun-mx-cogs.md
          draftCommit: abc1234
          hubCommit: def5678
          draftUrl: https://github.com/ddttom/mx-shared-gathering/blob/main/draft-cranstoun-mx-cogs.md
          isNewNote: false
        ---
      optional:
        - tags
        - type
        - resource
    - name: workflow-record
      description: Fields carried by the record of one workflow that has an AI agent in it. The record
        documents the baseline process and its objective, the tasks and authority given to the agent,
        the points where humans review, override, authorise, and escalate, the fallback and recovery
        procedures, the errors and unintended agent actions that occurred, the human effort spent on
        verification and repair, and where the evidence on human capability lives. The shape follows
        the workflow record proposed in "When Does AI Augment Work? A Workflow-Level Framework for
        Human-Agent Collaboration" (Wu, Ziems et al., arXiv:2609.12482, section 7), which is the
        evidence a claim of genuine augmentation needs under that paper's six conditions. It is a
        CogNovaMX tooling convention; the paper proposes the checklist and no vocabulary, so the field
        names here are ours. One record per workflow; a periodic operational review updates the same
        record and stamps reviewedAt.
      header: |
        ---
        # Carrier: workflow record kept beside the process it documents
        # --- Zone 1a: Identity ---
        title: "Workflow record: draft triage"
        description: "One AI-augmented workflow, its agent authority, review points and recovery path."
        author: Tom Cranstoun
        created: 2026-09-14
        modified: 2026-09-14
        # --- Zone 1b: OKF reserved surface (optional) ---
        type: workflow-record
        tags: [example, profile]
        resource: https://example.com/the-one-asset-this-document-describes
        # --- Zone 2: MX operational ---
        mx:
          workflowId: draft-triage-2026-09
          baselineProcess: "An editor reads each incoming draft and files it to a queue."
          objective: "Every draft reaches the right queue within one working day."
          agentTasks: [classify-draft, suggest-queue]
          agentAuthority: recommend
          reviewPoints: ["editor confirms the suggested queue before filing"]
          escalationPath: "A draft the agent cannot classify goes to the editor unfiled."
          fallbackProcedure: "The editor files by hand when the agent is unavailable."
          recoveryProcedure: "A misfiled draft is moved back and the classification logged."
          verificationEffort: "About two minutes per draft to confirm the queue."
          unintendedActions: []
          capabilityEvidence: "reports/triage/2026-q3-review.md"
          reviewedAt: 2026-09-14
        ---
      optional:
        - tags
        - type
        - resource

  fields: []
  deprecations: []
