<?xml version="1.0" encoding="UTF-8"?>
<!--
  MX Compatible badge - page illustration.

  This is the QR-free wordmark used to illustrate the badge on web pages
  (a QR pointing back at the page it sits on would be pointless). The
  composite badge that ships inside a PDF, with a per-document QR spliced
  into the right-hand slot, is built by
  scripts/lib/pdf/render-mx-compatible-badge.cjs from the template at
  mx-outputs/brand/mx-compatible-badge.svg.

  Colours: navy #0a1628 (brand background), gold #d4a843 (accent),
  white #ffffff. Typeface: brand font stack.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 92"
     width="220" height="92"
     role="img"
     aria-label="MX Compatible">
  <title>MX Compatible</title>
  <desc>The badge an MX Compatible PDF carries: a tagged, attested, provenance-bearing document.</desc>

  <rect x="0" y="0" width="220" height="92" fill="#ffffff" stroke="#d4a843" stroke-width="1"/>

  <g transform="translate(12, 18)">
    <rect width="56" height="56" fill="#0a1628"/>
    <text x="28" y="40"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="24"
          font-weight="700"
          fill="#ffffff"
          text-anchor="middle">MX</text>
  </g>

  <g transform="translate(80, 26)">
    <text x="0" y="14"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="9"
          font-weight="600"
          fill="#0a1628"
          letter-spacing="1.2">MACHINE EXPERIENCE</text>
    <text x="0" y="38"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="22"
          font-weight="700"
          fill="#d4a843">Compatible</text>
    <text x="0" y="56"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="7.5"
          fill="#5a6878">tagged &#183; provenance &#183; attested</text>
  </g>
</svg>
