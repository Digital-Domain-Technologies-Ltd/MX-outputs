<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MX Printworks. Publishing for the AI Age. CogNovaMX.">
  <defs>
    <linearGradient id="pw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="pw-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#e0b84e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pw-bg)"/>

  <!-- Print/publishing margin guides -->
  <g opacity="0.06" stroke="#5ba4e6" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Gold accent bar -->
  <rect x="100" y="160" width="6" height="200" fill="url(#pw-gold)" rx="3"/>

  <!-- MX Printworks title -->
  <text x="140" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#e8edf2" letter-spacing="-1">MX Printworks</text>

  <!-- Tagline -->
  <text x="140" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#d4a843" letter-spacing="0.5">Publishing for the AI Age</text>

  <!-- Description -->
  <text x="140" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#b3c1d4">Not just printing, producing systems of knowledge.</text>

  <!-- Book motif (stylised open book) -->
  <g transform="translate(920, 180)" opacity="0.16">
    <path d="M0,120 L0,0 Q60,-20 120,0 L120,120 Q60,100 0,120Z" fill="#5ba4e6"/>
    <path d="M120,0 Q180,-20 240,0 L240,120 Q180,100 120,120Z" fill="#d4a843"/>
    <line x1="120" y1="0" x2="120" y2="120" stroke="#0a1628" stroke-width="2"/>
  </g>

  <!-- CogNovaMX branding -->
  <text x="140" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#8a9cb0" letter-spacing="2">COGNOVAMX LTD</text>

  <!-- URL -->
  <text x="140" y="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#6f86a0">mx.allabout.network/about/printworks</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#pw-gold)"/>
</svg>
