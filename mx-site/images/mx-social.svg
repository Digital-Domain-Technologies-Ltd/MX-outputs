<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Machine Experience by CogNovaMX. Making the web, and everything you publish beyond it, work for everyone and everything that uses it.">
  <defs>
    <linearGradient id="mxsoc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="mxsoc-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ba4e6"/>
      <stop offset="55%" stop-color="#2070c0"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#mxsoc-bg)"/>

  <!-- Subtle diagonal grid -->
  <g opacity="0.05" stroke="#5ba4e6" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="-180"/>
    <line x1="0" y1="320" x2="1200" y2="20"/>
    <line x1="0" y1="520" x2="1200" y2="220"/>
    <line x1="0" y1="720" x2="1200" y2="420"/>
  </g>

  <!-- Machine-readability node motif -->
  <g opacity="0.14" stroke="#5ba4e6" stroke-width="2">
    <line x1="980" y1="170" x2="1080" y2="250"/>
    <line x1="980" y1="170" x2="940" y2="300"/>
    <line x1="940" y1="300" x2="1050" y2="380"/>
    <line x1="1080" y1="250" x2="1050" y2="380"/>
    <line x1="1050" y1="380" x2="990" y2="460"/>
    <line x1="940" y1="300" x2="990" y2="460"/>
    <circle cx="980" cy="170" r="9" fill="#5ba4e6" stroke="none"/>
    <circle cx="1080" cy="250" r="9" fill="#d4a843" stroke="none"/>
    <circle cx="940" cy="300" r="9" fill="#5ba4e6" stroke="none"/>
    <circle cx="1050" cy="380" r="9" fill="#5ba4e6" stroke="none"/>
    <circle cx="990" cy="460" r="9" fill="#d4a843" stroke="none"/>
  </g>

  <!-- MX wordmark -->
  <text x="88" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" fill="url(#mxsoc-mark)">MX</text>

  <!-- Gold accent bar -->
  <rect x="92" y="278" width="156" height="6" rx="3" fill="#d4a843"/>

  <!-- Machine Experience -->
  <text x="92" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e8edf2">Machine Experience</text>

  <!-- Tagline -->
  <text x="92" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#b3c1d4">Making the web, and everything you publish beyond it,</text>
  <text x="92" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#b3c1d4">work for everyone and everything that uses it.</text>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#08111f"/>
  <rect x="0" y="558" width="1200" height="2" fill="#2070c0" opacity="0.5"/>
  <text x="92" y="603" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#d4a843">CogNovaMX</text>
  <text x="1108" y="603" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b3c1d4">mx.allabout.network</text>
</svg>
