<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MX: LLM View</title>

  <!-- MX metadata: internal extension surface, not a public web page. -->
  <meta name="mx:status" content="active">
  <meta name="mx:contentType" content="extension-popup">
  <meta name="mx:audience" content="humans">
  <meta name="mx:aiAssistance" content="welcome">
  <meta name="mx:aiEditable" content="false">
  <meta name="mx:category" content="mx-tools">

  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1>MX: LLM View</h1>
    <p class="page-url" id="page-url">Loading…</p>
  </header>

  <div id="loading" class="loading-state">
    <p class="loading-text">Fetching with <code>Accept: text/markdown</code>…</p>
  </div>

  <p id="error" class="error-state hidden"></p>

  <section id="result" class="hidden" aria-live="polite">
    <div class="meta-row">
      <span class="badge-label">HTTP</span>
      <span id="http-status" class="badge">--</span>
      <span class="badge-label">Type</span>
      <span id="content-type" class="badge badge-neutral" title="">--</span>
      <span id="verdict" class="status-pill">--</span>
    </div>

    <p id="redirect-notice" class="redirect-notice hidden"></p>
    <p id="counts" class="counts-row"></p>

    <pre id="body-content" class="body-pre"></pre>
  </section>

  <footer class="popup-footer">
    <div class="footer-row">
      <span class="footer-note">No cookies sent &middot; no data leaves the browser</span>
      <button type="button" id="btn-copy" class="copy-btn hidden">Copy body</button>
    </div>
    <p class="version">v0.1.0 &middot; MX: LLM View</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
